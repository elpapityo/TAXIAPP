<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#153e5c"><meta name="description" content="TAXIAPP v0.3.227 の画像付き操作ヘルプ">
<title>TAXIAPP ヘルプ | v0.3.227</title>
<style>
:root{font:16px/1.75 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:#172e42;background:#f4f7fa;--navy:#153e5c;--blue:#125e9c;--line:#d5e2ea;--surface:#fff;--muted:#475d6e}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:var(--blue)}:focus-visible{outline:3px solid #db8300;outline-offset:3px}.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:8px;background:white;z-index:100;padding:10px}
header{background:var(--navy);color:white;padding:16px max(22px,calc((100% - 1240px)/2));display:flex;align-items:center;gap:16px;justify-content:space-between}header a{color:white;text-decoration:none;font-weight:700}header small{display:block;color:#c3e2ee}header strong{font-size:1.45rem}.version{background:#d9f0ef;color:#005b5e;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.78rem}
.shell{max-width:1250px;margin:auto;display:grid;grid-template-columns:294px minmax(0,1fr);gap:24px;padding:24px}.side{min-width:0;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 30px);overflow:auto;border:1px solid var(--line);background:white;border-radius:15px;padding:18px}.side h2{font-size:1.04rem;margin:0 0 8px}.side button{width:100%;text-align:left;border:0;background:transparent;color:#213e55;padding:9px 10px;border-radius:8px;line-height:1.4}.side button:hover,.side button[aria-current="page"]{background:#e5f2ff;font-weight:bold}.side .group{font-size:.85rem;font-weight:bold;color:#41627a;margin:18px 6px 4px}.search{width:100%;min-height:48px;border:2px solid #aec5d7;border-radius:10px;padding:9px 12px;background:white;color:#142e45}.search-count{font-size:.82rem;color:var(--muted);min-height:23px;margin:8px 0 0}
.content{min-width:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:20px;box-shadow:0 3px 14px #122a3d08}.card h1{font-size:clamp(1.5rem,3vw,2rem);line-height:1.4;margin:0 0 10px}.card h2{font-size:1.18rem;margin:0 0 9px}.lead{color:#36576b;line-height:1.8}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.tile{border:2px solid #c5ddeb;background:#f6fbff;border-radius:13px;padding:20px;min-width:0;text-align:left;color:#123b5d}.tile strong{display:block;font-size:1.1rem}.tile span{display:block;color:#3d5b72;font-size:.91rem}.tile:hover{border-color:#126da2}.meta{font-size:.85rem;color:var(--muted);margin-bottom:12px}.topic-nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:25px}.topic-nav button,.nav-button{background:#fff;border:1px solid #8aa8be;color:#144e75;padding:10px 15px;border-radius:9px;font-weight:bold}.topic-nav button:disabled{opacity:.45;cursor:default}
.steps{counter-reset:steps;padding:0;list-style:none}.steps li{margin:18px 0;padding:17px 16px 17px 22px;border-left:4px solid #127c82;background:#f5fafb;border-radius:4px 10px 10px 4px}.steps strong{display:block;font-size:1.05rem;margin-bottom:7px}.steps p{margin:0;overflow-wrap:anywhere}.completion{margin:20px 0;border:2px solid #93c7b4;border-radius:10px;background:#effaf5;padding:16px 18px}.completion strong{color:#165a45}.completion p{margin:6px 0 0}.setup-links{margin:22px 0}.setup-links .tile{display:block;width:100%;margin:9px 0}.note{padding:14px 17px;border:1px solid #e2cf9b;border-radius:10px;background:#fffaea;margin-top:19px}.important{margin:16px 0;border-left:5px solid #a36519;background:#fff7eb;padding:13px 16px}.status{display:inline-block;border:1px solid #b4ccd4;background:#e8f4f4;padding:3px 11px;border-radius:999px;font-size:.79rem;font-weight:700}.status.caution{background:#fff2e5;border-color:#dfc29c}
.figure{border:1px solid #d4e1eb;border-radius:13px;background:#f5f8fc;display:grid;place-items:center;padding:15px;margin:20px 0}.figure button{max-width:min(100%,600px);display:block;border:2px solid transparent;border-radius:10px;background:white;padding:7px}.figure button:hover{border-color:#1979a7}.figure img{display:block;width:100%;max-height:800px;object-fit:contain}.figure figcaption{font-size:.8rem;color:var(--muted);margin-top:9px;text-align:center}.faq details{border-top:1px solid #dce5ee;padding:14px 0}.faq summary{cursor:pointer;font-weight:bold;font-size:1.03rem}.faq details p{margin:9px 0 0}.muted{color:var(--muted)}.result{border-bottom:1px solid #e2e9ee;padding:12px 0}.result button{font-weight:bold;border:0;background:transparent;color:var(--blue);text-align:left;padding:5px}.result p{margin:2px 0;font-size:.86rem;color:var(--muted)}
.dialog{position:fixed;inset:0;z-index:50;background:#0c1629ee;display:none;align-items:center;justify-content:center;flex-direction:column;padding:55px 10px 20px}.dialog[aria-hidden="false"]{display:flex}.dialog img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;background:white}.dialog button{position:absolute;right:15px;top:10px;border:0;border-radius:8px;background:white;padding:9px 14px;color:#162f45;font-weight:bold}.dialog p{color:white;font-size:.85rem;margin-top:8px}.small{font-size:.86rem}.back{margin-bottom:14px}.top-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.visible-mobile{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr;padding:12px;gap:12px}.side{position:static;max-height:none;display:none}.side.open{display:block}.visible-mobile{display:inline-block}.card{padding:19px 16px}.tiles{grid-template-columns:1fr}header{padding:12px 15px}header strong{font-size:1.12rem}.version{display:none}.figure{padding:6px;margin-left:-7px;margin-right:-7px}.steps li{padding:13px}.topic-nav button{flex:1 1 calc(50% - 8px)}.topic-nav span{order:-1;flex:1 0 100%;text-align:center}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header><div><a href="./index.html#home"><strong>TAXIAPP 操作ヘルプ</strong></a><small>初期設定の5画面を順に説明／出庫・日報確認まで</small></div><span class="version">資料基準 v0.3.227</span><a href="../index.html" title="本体へ戻る">アプリに戻る</a></header>
<div class="shell">
<aside class="side" id="side"><h2>目次・キーワード検索</h2><label for="search" class="small">操作名やボタン名で探す</label><input id="search" class="search" type="search" placeholder="例：支払、保存、GPS" autocomplete="off"><div class="search-count" id="count" role="status"></div><div id="toc"></div></aside>
<main class="content" id="main" tabindex="-1"><div class="top-actions"><button type="button" id="toggleToc" class="nav-button visible-mobile" aria-expanded="false" aria-controls="side">☰ 目次・検索を開く</button><span class="small muted">写真は撮影時のPC画面です。スマートフォンでは配置が異なる場合があります。</span></div><div id="view"></div></main>
</div>
<div class="dialog" id="zoom" role="dialog" aria-modal="true" aria-hidden="true" aria-label="実画面画像の拡大"><button type="button" id="closeZoom">✕ 閉じる（Esc）</button><img id="zoomImage" alt=""><p>画像は拡大表示です。閉じるには「閉じる」を押してください。</p></div>
<script src="./manual-content.js"></script>
<script>
(()=>{'use strict';
 const data=window.TAXI_HELP_DATA||{pages:[]};const pages=data.pages;const el=id=>document.getElementById(id);let search='',lastFocus=null;
 const faq=[['入力した住所や金額が消えた','保存前に他の欄へ移り、値が残ったことを確認します。保存済みの場合は「営業記録一覧」の対象行で「編集」を選びます。'],['「未確認」と「なし」は同じですか','違います。「未確認」は未取得の可能性があります。営業履歴で日付を選び「選択日の日報を取得・更新」を使います。'],['月間売上が見つかりません','月間営業計画・実績の締め月を確認して「Firestore実績を更新」を押します。15日締めでは暦月と期間が違います。'],['通信不良で保存が確認できません','未同期の原本を保持し、回線と同期表示を確認します。端末データの消去・ログアウト・強制復元をしてはいけません。'],['GPSが使えません','端末とブラウザの位置情報許可を確認します。取得できない住所は手入力できます。走行距離精度や画面OFF時の動作は未検証です。'],['一般利用者も補助簿を印刷できますか','一般利用者の画面ではGoogle補助簿の印刷入口を確認していません。管理者側の実印刷は今回未検証です。入庫操作で自動印刷はされません。'],['初期設定をやり直すと日報が消えますか','「設定」→「データ・アカウント」→「初期設定ガイドを最初から開く」は既存データを削除せず案内を再表示する実装です。ただし中断再開は未試験です。'],['複合決済・高速の保存はすべて検証済みですか','いいえ。複合決済、割引・Uberの全組合せ、高速料金・距離・複数区間の保存は今回の検証対象外です。']];
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const aliases={'full-04':'setup-01','full-05':'setup-02','full-06':'setup-03','full-07':'setup-04','full-08':'setup-05'}; const url=id=>'#'+encodeURIComponent(id); const sectionName=s=>s==='setup'?'初期設定（5画面を順番に）':s==='quick'?'まず使う（クイック）':s==='dev'?'開発者向け検証記録':'詳しい操作説明';
 const searchText=p=>(p.title+' '+p.note+' '+p.steps.map(s=>s.heading+' '+s.body).join(' ')).toLowerCase();
 function toc(){const filtered=pages.filter(p=>searchText(p).includes(search.toLowerCase())); let out='<button type="button" data-page="home">⌂ ヘルプのトップ</button><button type="button" data-page="faq">？ よくある質問</button>';
  for(const sect of ['setup','quick','full','dev']){out+='<div class="group">'+sectionName(sect)+'</div>';for(const p of filtered.filter(p=>p.section===sect)){out+='<button type="button" data-page="'+p.id+'" '+(location.hash===url(p.id)?'aria-current="page"':'')+'>'+escape(p.title)+'</button>';}}
  el('toc').innerHTML=out;el('count').textContent=search?(filtered.length+' 件見つかりました'):'全 '+pages.length+' ページ';}
 function nav(p){const group=pages.filter(x=>x.section===p.section);let i=group.findIndex(x=>x.id===p.id);let prev=group[i-1]?.id,next=group[i+1]?.id;
  if(p.id==='quick-01')next='setup-01';
  if(p.id==='setup-01')prev='quick-01';
  if(p.id==='setup-05')next='quick-02';
  if(p.id==='quick-02')prev='setup-05';
  return '<nav class="topic-nav" aria-label="前後のページ"><button '+(prev?'data-page="'+prev+'"':'disabled')+'>← 前のページ</button><span>'+escape(sectionName(p.section))+' '+(i+1)+' / '+group.length+'</span><button '+(next?'data-page="'+next+'"':'disabled')+'>'+(p.id==='setup-05'?'次：出庫へ':'次のページ →')+'</button></nav>';}

 function fig(p){return p.image?'<figure class="figure"><button type="button" data-zoom="images/'+escape(p.image)+'" aria-label="'+escape(p.title)+'の実画面を拡大"><img src="images/'+escape(p.image)+'" loading="lazy" alt="'+escape(p.title)+'：v0.3.227の実画面の切り出し"></button><figcaption>画面画像（資料 '+(p.section==='quick'?'クイック':'詳しい版')+' p.'+p.page+'）。画像を押すと拡大します。</figcaption></figure>':'';}
 function show(){let id=decodeURIComponent((location.hash||'#home').slice(1));id=aliases[id]||id;let p=pages.find(x=>x.id===id),out='';
  if(id==='home'){out='<section class="card"><h1>はじめてのTAXIAPP：初期設定から始める</h1><p class="lead">Google認証・オプチャネーム登録の後に表示される初期設定5画面を、実際の画面写真を見ながら1つずつ進めます。最初の画面は「メーターモード」です。</p><div class="tiles"><button class="tile" data-page="setup-01"><strong>① 初期設定を始める（5画面）</strong><span>メーターモード → 乗務員設定 → 距離設定 → 入力項目の選択 → 月間売上目標</span></button><button class="tile" data-page="quick-01"><strong>🚕 まず使う：クイックガイド</strong><span>初期設定の5項目を確認して、出庫・営業・支払・入庫へ</span></button></div><div class="important"><strong>ご確認ください：</strong>写真の「初期設定のやり直し」は再案内時の撮影です。Google認証・オプチャネーム登録の2画面はこの資料で操作確認していません。営業データは変更しません。</div><div class="important"><strong>安全に停車してから操作してください。</strong> 未同期・競合がある場合はデータを消さないでください。</div><p class="small muted">基準資料：Web版 v0.3.227／2026年10月29日。写真はPCで撮影したテスト例です。</p></section><section class="card"><h2>そのほかの操作</h2><div class="tiles">'+[['quick-02','出庫から営業を始める'],['full-16','営業記録を修正する'],['full-21','月間実績を確認する'],['full-25','バックアップを保存する']].map(z=>'<button class="tile" data-page="'+z[0]+'"><strong>'+z[1]+'</strong></button>').join('')+'</div></section>';}
  else if(id==='faq'){out='<article class="card faq"><h1>よくある質問・困ったとき</h1><p>保存・同期で迷った場合は、消す前に保存状態とバックアップを確認してください。</p>'+faq.map(([q,a])=>'<details><summary>'+escape(q)+'</summary><p>'+escape(a)+'</p></details>').join('')+'<p><button class="nav-button" data-page="full-28">詳細の「困ったとき」を読む →</button></p></article>';}
  else if(p){let status=p.source_label==='実操作確認'?'実操作確認':p.source_label;out='<article class="card"><div class="meta">'+escape(sectionName(p.section))+'・資料 '+p.page+'ページ　<span class="status '+(status==='実操作確認'?'':'caution')+'">'+escape(status)+'</span></div><h1>'+escape(p.title)+'</h1><p class="lead">以下の画面名・ボタン名は v0.3.227 の資料に基づきます。画面と実際の入力値を見比べて操作してください。</p>'+fig(p)+'<ol class="steps">'+p.steps.map((s,i)=>'<li><strong>'+(p.section==='full'?(i+1)+'. ':'')+escape(s.heading)+'</strong><p>'+escape(s.body)+'</p></li>').join('')+'</ol>'+(p.completion?'<div class="completion"><strong>✓ この画面の完了確認</strong><p>'+escape(p.completion)+'</p></div>':'')+(p.id==='quick-01'?'<div class="setup-links"><h2>5画面の詳しい説明（順番に開けます）</h2>'+pages.filter(x=>x.section==='setup').map(x=>'<button class="tile" data-page="'+x.id+'"><strong>'+escape(x.title)+'</strong><span>実画面画像と入力・操作・確認方法を読む</span></button>').join('')+'</div>':'')+(p.note?'<aside class="note"><strong>注意：</strong>'+escape(p.note)+'</aside>':'')+nav(p)+'</article>';if(p.id==='full-29'){out+='<section class="card"><h2>開発・検証情報（一般操作説明とは別）</h2><p>実機GPS・画面OFFでの距離計測、スマートフォン縦横画面、複合決済／高速／割引の全保存条件、競合解決、管理者の既存Google帳票実印刷は未検証です。</p><p>Google認証・オプチャ登録は本人による操作です。日報・計算・認証・同期・印刷ロジックはこのヘルプの対象外です。</p></section>';}}
  else{out='<section class="card"><h1>ページが見つかりません</h1><button class="nav-button" data-page="home">ヘルプのトップへ</button></section>';}
  el('view').innerHTML=out;toc();document.title=(p?p.title:'TAXIAPP ヘルプ')+' | v0.3.227';}
 function jump(id){location.hash=url(id);if(decodeURIComponent(location.hash.slice(1))===id)show();window.scrollTo({top:0,behavior:'instant'});if(matchMedia('(max-width:850px)').matches){el('side').classList.remove('open');el('toggleToc').setAttribute('aria-expanded','false');}}
 document.addEventListener('click',e=>{const pg=e.target.closest('[data-page]');if(pg){jump(pg.dataset.page);return;} const zi=e.target.closest('[data-zoom]');if(zi){lastFocus=zi;el('zoomImage').src=zi.dataset.zoom;el('zoomImage').alt=zi.getAttribute('aria-label');el('zoom').setAttribute('aria-hidden','false');el('closeZoom').focus();return;}if(e.target===el('zoom')||e.target===el('closeZoom'))closeZoom();});
 function closeZoom(){el('zoom').setAttribute('aria-hidden','true');el('zoomImage').removeAttribute('src');lastFocus?.focus();}
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el('zoom').getAttribute('aria-hidden')==='false')closeZoom();});
 el('toggleToc').addEventListener('click',()=>{const now=el('side').classList.toggle('open');el('toggleToc').setAttribute('aria-expanded',String(now));if(now)el('search').focus();});
 el('search').addEventListener('input',e=>{search=e.target.value.trim();toc();if(search){const found=pages.filter(p=>searchText(p).includes(search.toLowerCase()));el('view').innerHTML='<section class="card"><h1>検索結果：'+escape(search)+'</h1><p>'+found.length+'件見つかりました。</p>'+found.map(p=>'<div class="result"><button data-page="'+p.id+'">'+escape(p.title)+'</button><p>'+escape(sectionName(p.section))+'</p></div>').join('')+(found.length?'':'<p>該当する操作はありません。別の言葉で検索してください。</p>')+'</section>';}});
 window.addEventListener('hashchange',show);show();
})();
</script>
</body></html>
