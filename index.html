/* v0.1.4 One-meter operation UI (independent of the business logic) */
:root{--ui-font:1.30;--ui-touch:62px;--ui-primary-touch:78px;--ui-button-touch:62px;--ui-button-primary:78px}
html[data-ui-text="normal"]{--ui-font:1}
html[data-ui-text="large"]{--ui-font:1.30}
html[data-ui-text="extra"]{--ui-font:1.55}
html[data-ui-buttons="normal"]{--ui-touch:48px;--ui-primary-touch:66px;--ui-button-touch:48px;--ui-button-primary:66px}
html[data-ui-buttons="compact"]{--ui-touch:48px;--ui-primary-touch:66px;--ui-button-touch:44px;--ui-button-primary:56px}
html[data-ui-buttons="large"]{--ui-touch:62px;--ui-primary-touch:78px;--ui-button-touch:62px;--ui-button-primary:78px}
html[data-ui-buttons="extra"]{--ui-touch:78px;--ui-primary-touch:96px;--ui-button-touch:78px;--ui-button-primary:96px}
html[data-ui-buttons="compact"] .btn{padding-block:7px}
html[data-ui-buttons="compact"] .btn.big{padding-block:9px}
html[data-ui-buttons="compact"] .chip{padding-block:7px}
.h1{font-size:calc(27px * var(--ui-font));line-height:1.24}
.h2{font-size:calc(19px * var(--ui-font));line-height:1.3}
.hero-heading{font-size:calc(23px * var(--ui-font));line-height:1.35}
.field .field-label,.field-label{font-size:calc(13px * var(--ui-font));line-height:1.45}
.field-sub{font-size:calc(11px * var(--ui-font))}
.helper,.meta,.panel-strip,.warn,.danger-note,.statline,.sidebar-note,.ui-preview p{font-size:calc(13px * var(--ui-font));line-height:1.5}
.caption-note,.tag,.footnote,.wait-history,.small,.pill,.eyebrow,.brand-tag,.metric .label,.metric small{font-size:calc(12px * var(--ui-font));line-height:1.5}
.metric strong{font-size:calc(23px * var(--ui-font))}
.metric .label{font-size:calc(12px * var(--ui-font))}
.control{font-size:calc(17px * var(--ui-font));min-height:var(--ui-touch);line-height:1.4}
.btn{font-size:calc(14px * var(--ui-font));min-height:var(--ui-button-touch);padding:10px 13px;line-height:1.4}
.btn.big{font-size:calc(19px * var(--ui-font));min-height:var(--ui-button-primary);padding:14px 15px}
.chip{font-size:calc(14px * var(--ui-font));min-height:var(--ui-button-touch);min-width:var(--ui-touch);line-height:1.3;padding:10px 11px}
.chip.label-chip{font-size:calc(13px * var(--ui-font));min-width:var(--ui-touch)}
.details summary{font-size:calc(15px * var(--ui-font));min-height:var(--ui-touch)}
.nav button{min-height:var(--ui-button-touch)}.nav-label{font-size:calc(13px * var(--ui-font));line-height:1.25}
.nav-ico{font-size:calc(19px * var(--ui-font))}
.settings-advanced>summary{font-size:calc(16px * var(--ui-font));border-radius:12px;background:#e7f1fa;padding:18px 16px}.settings-advanced>.inner{padding:12px}.settings-advanced>.inner .card{padding:17px}.settings-advanced .control{max-width:100%}
.ui-choice{margin:10px 0 16px}.ui-choice>.chip{flex:1;min-width:0}
.ui-preview{border:2px solid #9eb9d8;background:#f1f8ff;border-radius:16px;padding:16px;margin-top:22px}
.ui-preview strong{font-size:calc(17px * var(--ui-font));display:block;margin-bottom:5px}
.passenger-control{margin:5px 0 12px}
.passenger-control .selector{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.passenger-control .chip{min-width:0}
html[data-ui-contrast="high"]{--line:#95a8bd;--muted:#405771;--blue:#0654a3;--dark:#13263b;--teal:#00635d}
html[data-ui-contrast="high"] .card,html[data-ui-contrast="high"] .metric{border-width:2px}
html[data-ui-contrast="high"] .control,html[data-ui-contrast="high"] .chip{border:2px solid #6c849e}
html[data-ui-contrast="high"] .chip.active{background:#d7edff;border:3px solid #094d96;color:#063b7b}
html[data-ui-contrast="high"] .btn:focus-visible,html[data-ui-contrast="high"] button:focus-visible{outline:4px solid #e8a421;outline-offset:2px}
html[data-ui-theme="night"]{color-scheme:dark;--sheet:#182a3f;--line:#3b5772;--muted:#b0c3da;--blue:#71b8ff;--dark:#e9f5ff;--teal:#52d5ca;color:#edf5ff;background:#101c2a}
html[data-ui-theme="night"] body{background:#101c2a;color:#edf5ff}
html[data-ui-theme="night"] .card,html[data-ui-theme="night"] .metric,html[data-ui-theme="night"] .sheet-page,html[data-ui-theme="night"] .details,html[data-ui-theme="night"] .sidebar{background:#182a3f;color:#edf5ff;border-color:#3b5772}
html[data-ui-theme="night"] .hero,html[data-ui-theme="night"] .ui-preview,html[data-ui-theme="night"] .details summary{background:#243a54;color:#edf5ff;border-color:#5882a7}
html[data-ui-theme="night"] .control,html[data-ui-theme="night"] .chip,html[data-ui-theme="night"] .btn:not(.primary):not(.teal):not(.dark){background:#263d56;color:#eff7ff;border-color:#6588a9}
html[data-ui-theme="night"] .chip.active{background:#194b70;color:#fff;border-color:#73c2ff}
html[data-ui-theme="night"] .btn.primary{background:#1775c9;color:#fff;border-color:#1775c9}
html[data-ui-theme="night"] .btn.teal{background:#076961;color:#fff;border-color:#48b7a9}
html[data-ui-theme="night"] .btn.dark{background:#294766;color:#fff}
html[data-ui-theme="night"] .helper,html[data-ui-theme="night"] .caption-note,html[data-ui-theme="night"] .tag,html[data-ui-theme="night"] .footnote,html[data-ui-theme="night"] .meta,html[data-ui-theme="night"] .field-label,html[data-ui-theme="night"] .field .field-label,html[data-ui-theme="night"] .brand-tag,html[data-ui-theme="night"] .metric .label,html[data-ui-theme="night"] .metric small{color:#bed0e3}
html[data-ui-theme="night"] .panel-strip,html[data-ui-theme="night"] .warn,html[data-ui-theme="night"] .danger-note,html[data-ui-theme="night"] .local-warning,html[data-ui-theme="night"] .wait-summary{background:#243f56;color:#f4f8ff;border-color:#63829e}
html[data-ui-theme="night"] .nav button{color:#daeaff}html[data-ui-theme="night"] .nav button.selected{background:#214a72;color:#fff}
html[data-ui-theme="night"] .data-table th{background:#263d56;color:#d8edff}html[data-ui-theme="night"] .data-table td{border-color:#3b5772}
html[data-ui-theme="night"] .status-pill{background:#24473f;color:#d5fff4}html[data-ui-theme="night"] .status-pill.stop{background:#314459;color:#eaf1ff}
html[data-ui-theme="night"] .pill{background:#194b70;color:#deedff;border-color:#639ac7}
html[data-ui-theme="night"] .eyebrow{color:#b3ddff}
@media(max-width:700px){
  .layout{padding:12px 10px calc(var(--ui-touch) * 1.7 + 45px)}
  .sidebar .nav button{min-height:calc(var(--ui-button-touch) + 8px);padding:7px 1px}
  .sidebar .nav .nav-ico{font-size:calc(19px * var(--ui-font));line-height:1}
  .sidebar .nav .nav-label{font-size:clamp(10px,calc(11px * var(--ui-font)),17px);line-height:1.2}
  .card{padding:16px}
  .action-grid{gap:10px}
  .form-grid,.form-grid.three,.details .form-grid{gap:14px}
  .ui-preview .action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .ui-preview .btn.big{overflow-wrap:anywhere}
}
@media(max-width:360px){.ui-choice>.chip{padding-left:4px;padding-right:4px}}


/* v0.1.5: unobtrusive interface; warnings, GPS status and actual financial values stay visible. */
html[data-ui-help="hide"] .helper,
html[data-ui-help="hide"] .field-sub,
html[data-ui-help="hide"] .caption-note:not([role="status"]),
html[data-ui-help="hide"] .footnote,
html[data-ui-help="hide"] .sidebar-note,
html[data-ui-help="hide"] .wait-history,
html[data-ui-help="hide"] .explainer,
html[data-ui-help="hide"] .eyebrow {display:none!important;}
html[data-ui-help="hide"] .hero-heading {margin-bottom:12px;}
html[data-ui-help="hide"] .section-heading {margin-bottom:13px;}
.cash-checkout{margin-top:18px;padding:16px;border:2px solid #7296bb;border-radius:17px;background:#f4f9ff;display:grid;gap:13px;}
.cash-due,.cash-change{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:calc(16px * var(--ui-font));font-weight:750;}
.cash-due strong{font-size:calc(23px * var(--ui-font));font-variant-numeric:tabular-nums;color:#154f91;}
.cash-change{background:#dff6ee;color:#135d42;border:2px solid #82c6ad;border-radius:12px;padding:11px 14px;}
.cash-change strong{font-size:calc(31px * var(--ui-font));font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.cash-shortfall:not(:empty){width:100%;font-size:calc(15px * var(--ui-font));color:#a12e2e;}
.cash-deposit{font-size:calc(24px * var(--ui-font));text-align:right;font-weight:800;}
.deposit-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;}
.deposit-buttons .btn{font-size:calc(13px * var(--ui-font));padding:6px 4px;min-width:0;white-space:nowrap;}

/* v0.3.1: high-visibility waiting clock and single-tap standby notes */

.wait-display{background:#f6fbff;border:2px solid #b5d5eb;border-radius:16px;padding:16px;margin-top:10px;}

.highway-fold{margin:22px 0;border-color:#99bed8}.highway-fold summary{font-size:calc(19px * var(--ui-font));font-weight:850;min-height:var(--ui-touch);display:flex;align-items:center}.settlement-section{border-top:2px solid #d2e1ee;margin-top:22px;padding-top:22px}.settlement-section .stepper{margin-bottom:9px}

/* v0.3.0: switchable payment methods, in either order, with an auto remainder */

/* v0.3.3: time-now controls and preset waiting places */
.time-with-now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:stretch}
.time-with-now .control{min-width:0}
.time-now{min-height:var(--ui-touch);min-width:98px;white-space:nowrap;padding:10px 14px;background:#eaf4ff;border-color:#8dbce3;color:#134f82}

html[data-ui-theme="night"] .time-now{background:#1b4769;color:#e9f7ff;border-color:#6c9cba}
html[data-ui-theme="night"] .wait-place-item{background:#22415a;color:#fff}
html[data-ui-theme="night"] .wait-place-move,html[data-ui-theme="night"] .wait-place-remove{background:#1a334c;border-color:#52708b;color:#f1f7fe}

@media(max-width:700px){.pickup-main-fields,.alight-main-fields{grid-template-columns:minmax(0,1fr)!important}}
@media(max-width:450px){.time-now{min-width:80px;padding:9px 10px}}

/* v0.3.5: prevent large native time inputs being squeezed by the now button. */
.time-field{min-width:0;max-width:100%;}

/* v0.3.7: compact precision keypad (one decimal only for km); close on scroll. */

.calc-detail .statline.total{border-top:2px solid #bdd2e5;border-bottom:0;margin-top:5px;font-weight:850}
.calc-detail .statline.total b{font-size:calc(19px * var(--ui-font));}
.gps-control{margin:18px 0}.gps-control .gps-status{font-weight:750;margin:10px 0;overflow-wrap:anywhere;}
.gps-help{font-size:calc(12px * var(--ui-font));line-height:1.7;margin:10px 0 0;color:var(--muted)}
.keypad-overlay{position:fixed;z-index:110;inset:0;pointer-events:auto;touch-action:manipulation;background:#081d3122;display:flex;align-items:flex-end;justify-content:center;padding:8px 8px max(8px,env(safe-area-inset-bottom))}

.keypad-value{font-variant-numeric:tabular-nums;text-align:right;font-size:calc(25px * var(--ui-font));font-weight:850;background:#eff5fb;border:1px solid #a3c1d8;border-radius:10px;padding:6px 12px;margin:7px 0 9px;min-height:48px;overflow-wrap:anywhere}
.keypad-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.keypad-grid button{border:1px solid #b6cadc;color:#173e64;border-radius:10px;background:#fff;min-height:50px;font-size:calc(23px * var(--ui-font));font-weight:800}

 .sidebar .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));}

}

/* If an exception occurs during boot, don't leave the user on a perpetual spinner. */
(function () {
  function showBootError(message) {

function totals(records=[],settings={},shiftDate=''){

function historyRecordTime(record){
 if(record.kind==='cancel')return String(record.meta?.dispatchAt||record.raw.C||'').slice(0,8)+' ～ '+String(record.meta?.cancelAt||'').slice(0,8);
 return (record.raw.G||record.raw.C||'—')+' ～ '+(record.raw.M||'—');

function historyRecordDetails(record,shift){
 const raw=record.raw||{},p=pricing(record,shift.settings,shift.date);
 const isCancel=record.kind==='cancel';
 const tender=isCancel?[]:(record.kind==='ride'&&record.status==='complete'
  ?settledTenderAmounts(record,shift.settings,shift.date).items.filter(x=>x.type&&x.received>0):[]);
 const item=(name,value)=>`<div class="history-fact"><span>${safeText(name)}</span><strong>${safeText(value===''||value===null||value===undefined?'—':value)}</strong></div>`;
 const cashRows=tender.map(x=>`<tr><td>${safeText(LABELS[x.type]||x.type)}</td><td>${money(x.received)}</td><td>${money(x.company)}</td></tr>`).join('');
 const paymentBlock=isCancel?'<p class="helper">キャンセルは0円で記録。売上・納金には加算しません。</p>':
  tender.length?`<div class="table-wrap"><table class="data-table history-payment-table"><thead><tr><th>支払方法</th><th>受取額</th><th>会社納金対象</th></tr></thead><tbody>${cashRows}</tbody><tfoot><tr><th>合計</th><th>${money(tender.reduce((a,x)=>a+x.received,0))}</th><th>${money(tender.reduce((a,x)=>a+x.company,0))}</th></tr></tfoot></table></div>`:'<p class="helper">決済内訳は未記録です。</p>';
 const note=record.meta?.dispatchNote?item('配車・迎車メモ',record.meta.dispatchNote):'';
 return `<details class="details history-record-detail" data-record-detail="${safeText(record.id)}"><summary>№${safeText(raw.A)}　${safeText(prettyTag(record))}　${safeText(historyRecordTime(record))}　${money(p.printedDetail)}　<small>詳しく見る</small></summary><div class="inner">
  <h3 class="subsection">営業内容</h3>
  <div class="history-fact-grid">
  ${item('営業番号',raw.A)}${item('配車区分',prettyTag(record))}
  ${item('迎車受信・開始',record.meta?.dispatchAt||raw.C)}
  ${item(isCancel?'キャンセル時刻':'乗車時刻',isCancel?record.meta?.cancelAt:raw.G)}
  ${isCancel?'':item('降車時刻',raw.M)}
  ${item('乗車地・迎車場所',raw.AL)}${item('降車地',raw.AM)}
  ${item('乗車距離（km）',raw.F)}${item('降車距離（km）',raw.L)}
  ${note}${record.meta?.gpsCancelTripKm!==undefined?item('キャンセル時GPSトリップ（参考）',Number(record.meta.gpsCancelTripKm).toFixed(1)+' km'):''}
  </div>
  ${record.meta?.gpsDistance?`<h3 class="subsection">GPS距離（参考値）</h3><div class="history-fact-grid">
  ${item('乗車時トリップ（GPS）',record.meta.gpsDistance.boardQuality==='valid'?Number(record.meta.gpsDistance.boardTripKm||0).toFixed(1)+' km':'未測位・補正が必要')}
  ${item('降車時トリップ（GPS）',record.meta.gpsDistance.alightQuality==='valid'?Number(record.meta.gpsDistance.alightTripKm).toFixed(1)+' km':'未測位・補正が必要')}
  ${item('実車GPS計測分（欠測区間は含まない）',record.meta.gpsDistance.realRouteKm===undefined?'未確定':Number(record.meta.gpsDistance.realRouteKm).toFixed(1)+' km')}
  ${item('営業中の計測中断',record.meta.gpsDistance.alightGapCount===undefined?'不明':Math.max(0,record.meta.gpsDistance.alightGapCount-record.meta.gpsDistance.boardGapCount)+'件')}
  </div>`:''}
  <h3 class="subsection">金額・手数料</h3>
  <div class="history-fact-grid">
  ${item('メーター売上',money(p.meter))}
  ${item('割引',money(p.discount))}
  ${item('GO手数料',money(p.goFee))}
  ${item('Uber配車手数料（会社納金対象外）',money(p.uberSurcharge))}
  ${item('実車高速料金',money(p.realToll))}
  </div>
  <h3 class="subsection">金種ごとの受取金額</h3>
  ${paymentBlock}
  <p class="footnote">受取額は各決済で預かった金額、会社納金対象はアプリ内の精算計算による金額です。手数料の控除を区別して表示します。金額0円の決済方法は省略しています。</p>
 </div></details>`;
}

 <section class="card"><h2 class="h2">現在の営業</h2><div class="live-stats">${stat('現在時刻',`<span data-live-now>${shortTime(stamp())}</span>`)}${stat('出庫時刻',shortTime(shift.startedAt))}${stat('出庫からの経過時間',`<span data-live-elapsed>${durationHms(elapsed)}</span>`)}${stat('前回の降車から',`<span data-live-payment>${durationJapanese(elapsedSinceLastPayment(shift))}</span>`)}${stat('実車時間（記録分・進行中含む）',`<span data-live-ride>${durationHms(v.liveDuration)}</span>`)}${stat('待機時間（記録分）',`<span data-live-wait>${durationHms(v.waitDuration)}</span>`)}${stat('空車・迎車等（参考）',`<span data-live-unclassified>${durationHms(v.unclassified)}</span>`,'休憩など未分類の時間も含む')}</div></section>
 ${dailyReferenceStrip(shift)}<section class="card"><h2 class="h2">売上の実績</h2><div class="live-stats">${shift.gpsTrip?`${stat('GPSトリップ推定値',((shift.gpsTrip.tripKm||0).toFixed(1))+' km')}${stat('GPS実車／空車',((shift.gpsTrip.realKm||0).toFixed(1))+' km ／ '+((shift.gpsTrip.emptyKm||0).toFixed(1))+' km')}`:''}${stat('確定メーター売上',money(v.t.meter))}${stat('メーター照合用累計',money(check.total),`キャンセル ${check.cancelCount}件 × ${money(CANCEL_METER_CHECK_AMOUNT)} を加算・売上対象外`)}${stat('営業回数',v.t.rides+'件')}${stat('1回あたり平均',money(avg))}${stat('時間あたり売上',`<span data-live-pace>${money(v.pace)}</span>`,'出庫からの経過時間を使用')}</div><details class="details"><summary>任意の帰庫予定時刻で別試算（13時間基準は変更しません）</summary><div class="inner"><h3 class="h2">予定入庫時刻による別の参考試算</h3><p class="helper">帰庫予定時刻は任意です。現在までの売上ペースが続くと仮定した単純計算で、正式な営業予測ではありません。</p><label class="field"><span class="field-label">帰庫予定時刻（未入力でも可）</span><input type="time" step="60" class="control" data-plan-end value="${safeText(target)}"></label><div class="live-stats" style="margin-top:12px">${stat('今後の参考売上',`<span data-live-remaining>—</span>`)}${stat('一日売上の参考試算',`<span data-live-forecast>—</span>`)}</div><p class="footnote">実績30分以上・営業1件以上・帰庫予定が未来の場合のみ表示します。今後の実際の需要、休憩、運賃変化などは考慮できません。予測式の正式採用は未確定です。13時間基準の分析には影響しません。</p></div></details></section>
 ${dailyReferenceDetails(shift,v.duty)}<section class="card"><h2 class="h2">営業の時系列</h2>${timeline}<p class="footnote">現行記録にある待機開始・精算履歴を表示しています。以前の乗務には精算確定時刻が保存されていない場合があります。</p></section>`;

GO手数料含む／Uber手数料除外）',money(t.cashRemittance)],['Uber配車料（会社納金不要）',money(t.uberSurcharge)],['キャンセル（売上計上なし）',money(t.cancellation)],['実車高速（客負担）',money(t.realToll)],['実車高速を含む明細金額',money(t.printedDetail)]].map(([k,v])=>`<div class="statline"><span>${k}</span><b>${v}</b></div>`).join('')}</section><section class="card"><h2 class="h2">手数料・控除</h2>${[['GO手数料（降車完了分）',money(t.goFee)],['Uber配車料（会社への納金不要）',money(t.uberSurcharge)],['空車高速 → 雑損',money(t.emptyToll)],['割引（既知ルールのみ）',money(t.discount)],['ETC記録額（実＋空）',money(t.realToll+t.emptyToll)]].map(([k,v])=>`<div class="statline"><span>${k}</span><b>${v}</b></div>`).join('')}<div class="warn">Uberの運営側料率は未確認のため自動計算しません。現金納金額はGO・Uberの配車料と空車高速の雑損を分けて集計します。ETC・キャンセル・全複合金種は別途検証が必要です。</div></section></div><section class="card"><h2 class="h2">支払方法別（精算内訳）</h2>${Object.entries(t.paymentTotals).map(([k,v])=>`<div class="statline"><span>${safeText(LABELS[k]||k)}</span><b>${money(v)}</b></div>`).join('')||'<p class="subtle">精算済みのデータがありません。</p>'}</section>`;}

 * Never edits any existing daily report, raw distance or settlement.
 */
function renderHighwayReport(){
 const shifts=[...(model.shifts||[])].sort((a,b)=>String(b.startedIso||'').localeCompare(String(a.startedIso||'')));
 const selected=shifts.find(s=>s.id===highwayShiftId)||shifts[0]||null;
 const head=titleBlock('高速道路利用一覧','HIGHWAY REPORT','利用した高速道路の個別明細・実車／空車小計・当日の合計を確認できます。');
 if(!selected)return head+'<section class="card"><p class="empty-state">確認できる乗務記録がありません。</p></section>';
 const report=window.TAXIAPP_HIGHWAY_REPORT?.collect(selected,r=>deriveRaw(r,selected.settings));
 if(!report)return head+'<section class="card"><p class="warn">高速道路一覧を読み込めませんでした。元の日報データは変更していません。</p></section>';
 const km=(n,d=3)=>n===null||n===undefined?'未記録':Number(n).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d})+' km';
 const yen=n=>n===null?'未記録':money(n);
 const text=v=>safeText(String(v||'未記録'));
 const stat=(name,v)=>'<div class="statline"><span>'+name+'</span><b>'+v+'</b></div>';
 const parts=(name,subtotal)=>{
  const issue=subtotal.unknownDistances?'<p class="warn">距離が未記録・不整合の明細 '+subtotal.unknownDistances+' 件があります。小計は判明分のみです。</p>':'';
  return '<section class="card"><h2 class="h2">'+name+'の小計（'+subtotal.count+'区間）</h2>'+
   stat('区間距離',km(subtotal.sectionKm,1))+
   stat('免除距離（高速区間の75％）',km(subtotal.exemptKm))+
   stat('高速料金の記録済み合計',money(subtotal.chargeYen))+
   issue+'</section>';
 };
 const totalDistance=number(selected.startingOdo)!==null&&number(selected.endingOdo)!==null&&
  number(selected.endingOdo)>=number(selected.startingOdo)
  ?Math.round((number(selected.endingOdo)-number(selected.startingOdo))*1000)/1000:null;
 const limitKm=Math.round((275+report.exemptKm)*1000)/1000;
 const excess=totalDistance===null?null:Math.round(Math.max(0,totalDistance-limitKm)*1000)/1000;
 const warning=report.unknownDistances>0;
 const compare=totalDistance===null
  ?'<p class="caption-note">出庫・入庫のトリップがそろっていないため、総走行距離の比較は未計算です。</p>'
  :'<div class="statline"><span>出庫～入庫の総走行距離</span><b>'+km(totalDistance)+'</b></div>'+
   stat('距離基準（275km＋免除距離）',km(limitKm))+
   stat('基準超過（参考）',km(excess))+
   (warning?'<p class="warn">高速区間の未記録があるため、距離超過は仮の計算です。明細を確認してください。</p>'
   :excess>0?'<p class="warn">距離基準を超えています。未登録の高速利用がないか確認してください。</p>'
   :'<p class="caption-note">記録された高速免除距離を含めると、距離基準内です。</p>');
 const rows=report.entries.map(r=>{
  const label=r.mode==='実'?'実車高速':'空車高速';
  const ico=r.mode==='実'?'🚕':'🚙';
  return '<article class="highway-report-entry">'+
   '<div class="highway-report-entry-head"><strong>日報 №'+safeText(r.no)+'</strong><span>'+ico+' '+label+'</span></div>'+
   '<div class="highway-report-route"><div><small>入口IC</small><strong>'+text(r.entryIC)+'</strong><small>'+text(r.entryTime)+'</small></div>'+
   '<div aria-hidden="true">→</div><div><small>出口IC</small><strong>'+text(r.exitIC)+'</strong><small>'+text(r.exitTime)+'</small></div></div>'+
   '<div class="highway-report-entry-data">'+
    '<div><small>区間距離</small><strong>'+km(r.sectionKm,1)+'</strong></div>'+
    '<div><small>免除距離（75％）</small><strong>'+km(r.exemptKm)+'</strong></div>'+
    '<div><small>高速料金</small><strong>'+yen(r.chargeYen)+'</strong></div>'+
   '</div>'+
   (r.distanceMissing?'<p class="warn">乗距離・降距離が未記録または不正です。距離小計には含めていません。</p>':'')+
   '</article>';
 }).join('');
 return head+
  '<div class="actions"><button type="button" class="btn" data-tab="history">← 営業履歴へ戻る</button></div>'+
  '<section class="card"><label class="field"><span class="field-label">乗務日を選択</span><select class="control" id="highwayShiftSelect">'+
   shifts.map(s=>'<option value="'+safeText(s.id)+'" '+(s.id===selected.id?'selected':'')+'>'+safeText(s.date)+'　出庫 '+shortTime(s.startedAt)+' ／ '+safeText(s.vehicle||'車番未設定')+'</option>').join('')+
   '</select></label><p class="caption-note">保存済みの営業記録を表示します。閲覧専用のためデータは変更されません。</p></section>'+
  '<section class="card"><h2 class="h2">本日の高速道路利用合計</h2>'+
   stat('高速利用区間',report.count+'区間（実車 '+report.real.count+'／空車 '+report.empty.count+'）')+
   stat('区間距離の合計',km(report.sectionKm,1))+
   stat('免除距離の合計（75％）',km(report.exemptKm))+
   stat('高速料金の記録済み合計',money(report.chargeYen))+
   (warning?'<p class="warn">区間距離が未確定の明細 '+report.unknownDistances+' 件があります。距離合計は判明している分だけです。</p>':'')+
   '<div class="divider"></div><h3 class="h2">275kmとの比較</h3>'+compare+
   '<p class="footnote">距離はICの乗車時・降車時の車両トリップ差から計算。免除は区間ごとに75％。この画面は会社の日報内基準の参考比較で、法的な走行制限の判定ではありません。</p></section>'+
  '<section class="highway-report-subtotals">'+parts('実車高速',report.real)+parts('空車高速',report.empty)+'</section>'+
  '<section class="card"><h2 class="h2">高速利用の個別明細（'+report.count+'区間）</h2>'+
   (rows?'<div class="highway-report-list">'+rows+'</div>':'<p class="empty-state">この乗務に記録された高速道路の利用はありません。</p>')+
   '</section>';
}

// Spreadsheet-link settings are local preferences only. No remote Google write
// is attempted until an authenticated, tested connector exists.
const SHEET_TARGET_DEFAULTS={
 mode:'off',syncMode:'off',printMode:'off',
 spreadsheetName:'TAXIAPP_補助簿印刷_新運用テスト_20261016',
 spreadsheetUrl:'https://docs.google.com/spreadsheets/d/1tBoPSm_hni7VE_TcP3n0gvGXexX9G4KSKUD3xPJZNS4/edit',webAppUrl:'',
 fileBaseName:'TAXIAPP',fileNamePattern:'{name}_{date}_{type}'
};
function sheetTargetPrefs(){return {...SHEET_TARGET_DEFAULTS,...(model.prefs?.sheetTarget||{})};}
function validSheetUrl(s){
 try{const u=new URL(String(s||''));return u.protocol==='https:'&&u.hostname==='docs.google.com'&&/^\/spreadsheets\/d\/[a-zA-Z0-9_-]{15,}(\/|$)/.test(u.pathname)?u.href:'';}catch{return '';}
}
function safeFilenamePart(s){return String(s??'').replace(/[\\/:*?"<>|\x00-\x1f\x7f]/g,'_').replace(/\s+/g,' ').replace(/[. ]+$/g,'').trim().slice(0,170);}
function exportFileName(kind,shift){
 const p=sheetTargetPrefs(),day=(kind==='全データ')?dateStamp(new Date()):(shift?.date||dateStamp(new Date()));
 const base=safeFilenamePart(p.fileBaseName)||'TAXIAPP';
 const pattern=String(p.fileNamePattern||SHEET_TARGET_DEFAULTS.fileNamePattern);
 // Prevent unintended collisions if a custom pattern omits the type placeholder.
 const output=pattern.replaceAll('{name}',base).replaceAll('{date}',day).replaceAll('{type}',kind);
 const stem=safeFilenamePart(output)||`${base}_${day}_${kind}`;
 const unique=pattern.includes('{type}')?stem:safeFilenamePart(stem+'_'+kind);
 return unique+(kind==='全データ'?'.json':'.csv');
}
// Google Apps Script bridge: local save is independent of cloud delivery.
// The device-local key is never added to model.prefs or exported in JSON backups.
const TAXIAPP_CLOUD_KEY='taxiapp-google-access-v1';
let cloudStatus='接続設定待ち',cloudTimer=null,cloudRunning=false,cloudLastDigest=new Map();
function googleWriteKey(){try{return localStorage.getItem(TAXIAPP_CLOUD_KEY)||'';}catch{return '';}}
function setGoogleWriteKey(value){
 try{localStorage.setItem(TAXIAPP_CLOUD_KEY,String(value||'').trim());return true;}
 catch{toast('この端末に接続キーを保存できません',true);return false;}
}
function googleWebAppUrl(value){
 try{
  const url=new URL(String(value||'').trim());
  return url.protocol==='https:'&&url.hostname==='script.google.com'&&
    /^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)?url.href:'';
 }catch{return '';}
}
function googleIsConfigured(){return Boolean(googleWebAppUrl(sheetTargetPrefs().webAppUrl)&&googleWriteKey().length>=24);}
function setGoogleStatus(message){
 cloudStatus=String(message);
 const el=appEl.querySelector('[data-cloud-status]');
 if(el)el.textContent=cloudStatus;
}
function googleShiftPacket(shift){
 const records=(shift.records||[]).map(record=>{
  const item={...record,raw:deriveRaw(record,shift.settings)};
  item.amounts=pricing(record,shift.settings,shift.date);
  if(record.kind==='ride'&&record.status==='complete')
   item.payments=settledTenderAmounts(record,shift.settings,shift.date).items.map(t=>({
    type:t.type,received:t.received,company:t.company
   }));
  else item.payments=[];
  return item;
 });
 return {kind:'TAXIAPP_SHIFT_V1',shift:{...shift,records},summary:totals(shift.records,shift.settings,shift.date)};
}
// POST through a hidden form avoids browser CORS restrictions on Apps Script Web Apps.
// The receiver returns an HTML acknowledgement via postMessage; opaque fetch success
// is NEVER treated as evidence that records reached Google Sheets.
function googlePostRequest(action,fields={}){
 const endpoint=googleWebAppUrl(sheetTargetPrefs().webAppUrl),key=googleWriteKey();
 if(!endpoint||key.length<24)return Promise.reject(Error('WebアプリURLと接続キーを設定してください'));
 const nonce='tx-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 return new Promise((resolve,reject)=>{
  const iframe=document.createElement('iframe'),form=document.createElement('form');
  iframe.name='taxi_sync_'+nonce.replace(/[^A-Za-z0-9_]/g,'');
  iframe.style.display='none';iframe.setAttribute('aria-hidden','true');
  form.method='POST';form.action=endpoint;form.target=iframe.name;
  form.style.display='none';form.acceptCharset='UTF-8';
  const add=(field,value)=>{
   const item=document.createElement('input');item.type='hidden';
   item.name=field;item.value=String(value);form.appendChild(item);
  };
  add('action',action);add('key',key);add('nonce',nonce);add('origin',window.location.origin);
  for(const [field,value] of Object.entries(fields))add(field,value);
  let settled=false;
  function done(error,response){
   if(settled)return;
   settled=true;clearTimeout(timeout);window.removeEventListener('message',onMessage);
   form.remove();iframe.remove();
   if(error)reject(error);else resolve(response);
  }
  function onMessage(event){
   const origin=String(event.origin||'');
   let trusted=false;
   try{
    const url=new URL(origin),hostname=url.hostname;
    trusted=url.protocol==='https:'&&(hostname==='script.google.com'||
      hostname==='script.googleusercontent.com'||hostname.endsWith('.googleusercontent.com'));
   }catch{}
   if(!trusted)return;
   const data=event.data;
   if(!data||data.type!=='TAXIAPP_SYNC_RESULT'||data.nonce!==nonce)return;
   if(data.ok)done(null,data);
   else done(Error(String(data.message||'Google側の受信エラー')));
  }
  const timeout=setTimeout(()=>done(Error('Googleの受信確認が時間切れです。接続とWebアプリの公開設定を確認してください')),45000);
  window.addEventListener('message',onMessage);
  document.body.appendChild(iframe);document.body.appendChild(form);
  try{form.submit();}catch(error){done(error);}
 });
}

function googlePostShift(packet){return googlePostRequest('sync',{payload:JSON.stringify(packet)}).then(x=>x.message);}
async function googleSendShift(shift,manual=false){
 if(!shift){if(manual)toast('送信する乗務データがありません',true);return false;}
 if(!googleIsConfigured()){if(manual)toast('先にWebアプリURLと接続キーを設定してください',true);return false;}
 if(cloudRunning){if(manual)toast('送信中です。完了後に再試行してください');return false;}
 cloudRunning=true;
 try{
  const packet=googleShiftPacket(shift),digest=JSON.stringify(packet);
  if(!manual&&cloudLastDigest.get(shift.id)===digest)return true;
  setGoogleStatus('Googleへ送信中：'+shift.date);
  const message=await googlePostShift(packet);
  cloudLastDigest.set(shift.id,digest);
  setGoogleStatus('受信確認済み：'+shift.date+'　'+message);
  if(manual)toast('Googleスプレッドシートへの保存を確認しました');
  return true;
 }catch(error){
  setGoogleStatus('送信未確認：'+String(error?.message||error));
  if(manual)toast('Google送信エラー：'+String(error?.message||error),true);
  return false;
 }finally{cloudRunning=false;}
}
function scheduleGoogleSync(){
 if(sheetTargetPrefs().mode!=='auto'||!googleIsConfigured())return;
 clearTimeout(cloudTimer);
 cloudTimer=setTimeout(()=>{
  const current=getShift()||selectedShift();
  if(!current)return;
  if(cloudRunning){scheduleGoogleSync();return;}
  googleSendShift(current,false);
 },3000);
}
async function googleSendAllShifts(){
 if(!googleIsConfigured()){toast('Googleの接続設定を完了してください',true);return;}
 const shifts=[...(model.shifts||[])];
 if(!shifts.length){toast('送信する乗務データがありません',true);return;}
 if(!confirm(shifts.length+'乗務をGoogleシートへ送信しますか？'))return;
 let successful=0;
 for(const shift of shifts){
  while(cloudRunning)await new Promise(done=>setTimeout(done,300));
  if(await googleSendShift(shift,false))successful++;
 }
 setGoogleStatus('まとめて送信：'+successful+'/'+shifts.length+'乗務を確認');
 toast(successful+'/'+shifts.length+'乗務の受信を確認しました',successful!==shifts.length);
}


/* Cloud synchronization is per-duty, revision checked and opt-in.
 * The current local dataset remains available even during internet outages.
 */
const syncUI=window.TAXIAPP_SYNC_UI({
 getModel:()=>model,
 getPacket:googleShiftPacket,
 endpoint:()=>googleWebAppUrl(sheetTargetPrefs().webAppUrl),
 configured:googleIsConfigured,
 prefs:sheetTargetPrefs,
 request:async(action,fields)=>{
  const result=await googlePostRequest(action,fields);
  return result.data;
 },
 replace:async(id,incoming,existing)=>{
  if(!incoming||incoming.id!==id||!Array.isArray(incoming.records)||
     incoming.records.length>MAX_RECORDS||!incoming.settings)
   throw Error('受信した乗務の内容が不正です');
  if(model.activeId===id &&
     (model.shifts.find(x=>x.id===id)?.gpsTrip?.enabled||keypadActive||
      appEl.querySelector('input:focus,textarea:focus,select:focus')))
   throw Error('この端末で編集中の乗務です。GPS・入力を終了してから再同期してください');
  const previous=deepCopy(model);
  const i=model.shifts.findIndex(x=>x.id===id);
  if(i<0)model.shifts.push(deepCopy(incoming));
  else model.shifts[i]=deepCopy(incoming);
  model.shifts.sort((a,b)=>String(b.startedIso||'').localeCompare(String(a.startedIso||'')));
  try{
   await save(true);
   const stored=db?await idbGet(db):JSON.parse(localStorage.getItem('taxiapp-v1')||'null');
   if(!stored?.shifts?.some(x=>x.id===id))throw Error('受信した乗務を保存できませんでした');
  }catch(error){
   model=previous;await save(true);throw error;
  }
  if(tab==='history'||tab==='highway'||tab==='live')render();
 },
 root:appEl,isSettings:()=>tab==='settings',setStatus:setGoogleStatus,
 render:render,toast,escape:safeText,download,dateStamp
});

function handleSheetTargetSetting(target){const field=target.dataset.cloudSetting??target.dataset.fileSetting;
 if(!['mode','syncMode','printMode','spreadsheetName','spreadsheetUrl','webAppUrl','fileBaseName','fileNamePattern'].includes(field))return;
 const value=String(target.value||'').trim();
 if(field==='spreadsheetUrl'&&value&&!validSheetUrl(value)){toast('GoogleスプレッドシートのURLを確認してください。設定は変更していません。',true);target.value=sheetTargetPrefs().spreadsheetUrl;return;}
 if(field==='webAppUrl'&&value&&!googleWebAppUrl(value)){toast('Googleの /exec WebアプリURLを入力してください',true);target.value=sheetTargetPrefs().webAppUrl;return;}
 if(field==='mode'&&!['off','manual','auto'].includes(value))return;
 if(field==='syncMode'&&!['off','on'].includes(value))return;
 if(field==='printMode'&&!['off','manual','auto'].includes(value))return;
 if(field==='fileNamePattern'&&(!value||value.length>180)){toast('ファイル名の書式を入力してください。',true);target.value=sheetTargetPrefs().fileNamePattern;return;}
 if(field==='fileBaseName'&&!safeFilenamePart(value)){toast('ファイル名の先頭部分を入力してください。',true);target.value=sheetTargetPrefs().fileBaseName;return;}
 model.prefs.sheetTarget={...sheetTargetPrefs(),[field]:value};saveLater();if(field==='syncMode'&&value==='on')syncUI.schedule();
 // Render after change, not each keystroke: preserves the caret and Android IME.
 render();
 if(field==='mode'&&value==='auto'&&!googleIsConfigured())toast('自動送信にはWebアプリURLと接続キーが必要です',true);
 else toast('設定を保存しました。');
}

async function reverseAddress(gps){

 const key=`${lat.toFixed(5)},${lon.toFixed(5)}`;
 if(gsiAddressCache.has(key))return gsiAddressCache.get(key);
 const url=`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
 const [resp,municipalities]=await Promise.all([
  fetch(url,{signal:AbortSignal.timeout(8500)}),
  loadMunicipalities()
 ]);
 if(!resp.ok)throw Error('住所検索通信エラー');
 const response=await resp.json();
 const found=response?.results;
 if(!found?.muniCd||!found?.lv01Nm)throw Error('住所データなし');
 const area=String(found.lv01Nm).trim();

    throw Error('上書きに失敗し元の状態への復元もできません。移行前バックアップを保管してください：'+String(restoreError.message||restoreError));
   }
   throw Error('上書きできなかったため元のデータへ戻しました：'+String(error.message||error));
  }
  historyDate='';historyShiftId='';printShiftId='';tab='settings';
  render();toast('PCから'+newCount+'乗務と設定を引き継ぎました。Google送信は手動にしています。');
 }catch(e){toast('一括引き継ぎに失敗：'+String(e.message||e),true);}
}
async function deleteWholeShift(shiftId){
 const shift=model.shifts.find(s=>s.id===shiftId);
 if(!shift){toast('削除対象が見つかりません',true);return;}
 if(cloudRunning){toast('Google送信中は削除できません',true);return;}
 const unfinished=shift.id===model.activeId||!shift.endedAt;
 const display=shift.date+'　'+shortTime(shift.startedAt)+'〜'+(shift.endedAt?shortTime(shift.endedAt):'未入庫');
 const total=totals(shift.records,shift.settings,shift.date);
 if(!confirm('【テスト乗務1件をまとめて削除】\n'+display+'\n営業 '+shift.records.length+'件／メーター売上 '+money(total.meter)+
  '\nこの乗務の営業明細・編集中の記録・待機履歴・GPSもまとめて端末から削除します。\nGoogleシートへ送信したデータは残ります。\n本当に削除しますか？'))return;
 if(unfinished&&!confirm('【未入庫データの削除を最終確認】\nこの乗務はまだ入庫済みになっていません。\n入庫操作をせずに出庫からのテスト記録をすべて破棄し、乗務中の状態も解除します。\n続けますか？'))return;
 const previous=deepCopy(model);
 try{
  // Invalidate any pending save and GPS watch before removing an active duty.
  clearTimeout(persistTimer);persistTimer=0;
  clearTimeout(cloudTimer);cloudTimer=null;
  if(shift.id===model.activeId)gpsTripUI?.clearWatch();
  model=window.TAXIAPP_DEVICE_DATA.deleteShift(model,shiftId,{allowUnfinished:unfinished}).model;
  await save(true);
  const stored=db?await idbGet(db):JSON.parse(localStorage.getItem('taxiapp-v1')||'null');
  if(!stored||!Array.isArray(stored.shifts)||stored.shifts.some(s=>s.id===shiftId)||stored.activeId!==model.activeId)
   throw Error('削除後の記録を保存できません');
  if(historyShiftId===shiftId)historyShiftId='';
  if(printShiftId===shiftId)printShiftId='';
  render();toast(display+' の乗務を削除しました。');
 }catch(e){
  model=previous;
  try{
   await save(true);
   if(getShift()?.gpsTrip?.enabled)gpsTripUI?.start(getShift(),true);
  }catch(restoreError){
   toast('削除・復元とも失敗しました。事前のJSONバックアップを確認してください：'+String(restoreError.message||restoreError),true);
   return;
  }
  render();toast('削除を取り消しました：'+String(e.message||e),true);
 }
}
async function importBackup(file){if(!file)return;if(file.size>5*1024*1024){toast('バックアップファイルが大きすぎます。',true);return;}let json;try{json=JSON.parse(await file.text());if(json.version!==1||!Array.isArray(json.shifts)||json.shifts.some(s=>!Array.isArray(s.records)||s.records.length>MAX_RECORDS||s.records.some(r=>!r.raw||!r.kind||!['ride','empty','cancel'].includes(r.kind))||!s.settings))throw Error('互換性のないデータです');}catch(e){toast('復元できません: '+e.message,true);return;}const existingIds=new Set(model.shifts.map(s=>s.id));
 const addition=json.shifts.filter(s=>!existingIds.has(s.id));
 const skipped=json.shifts.length-addition.length;
 if(!addition.length){toast(`新規に取り込む乗務はありません（重複 ${skipped}件）`);return;}
 if(!confirm(`バックアップから${addition.length}乗務を追加します。既存${model.shifts.length}乗務は変更しません。\n同じIDの${skipped}乗務は上書きせずスキップします。続けますか？`))return;
 model.shifts.push(...addition);
 model.shifts.sort((a,b)=>String(b.startedIso||'').localeCompare(String(a.startedIso||'')));
 upgradeWaitingHistory();await save();historyDate='';historyShiftId='';tab='history';render();toast(`${addition.length}乗務を追加しました。既存データは維持しました。`);}
appEl.addEventListener('click',event=>{const conflict=event.target.closest('[data-sync-resolve]');if(conflict){syncUI.resolve(conflict.dataset.id,conflict.dataset.syncResolve==='local');return;}let tabButton=event.target.closest('[data-tab]');if(tabButton){closeKeypad(true,true);renderAfterKeypad=false;tab=tabButton.dataset.tab;render();return;}let action=event.target.closest('[data-action]');if(action){if(action.dataset.action==='saveDraft'){
  if(skipSaveClick?.button===action&&Date.now()-skipSaveClick.at<1500){skipSaveClick=null;return;}
  skipSaveClick=null;invokeSaveDraft();return;
 }handleAction(action.dataset.action,action.dataset.id);return;}let nowButton=event.target.closest('[data-time-now]');if(nowButton){fillCurrentTime(nowButton.dataset.timeNow);return;}let movePlace=event.target.closest('[data-wait-move]');if(movePlace){moveWaitingPlace(Number(movePlace.dataset.waitMove),movePlace.dataset.waitDirection);return;}let removePlace=event.target.closest('[data-wait-remove]');if(removePlace){removeWaitingPlace(Number(removePlace.dataset.waitRemove));return;}let ui=event.target.closest('[data-ui-key]');if(ui){setUiOption(ui.dataset.uiKey,ui.dataset.uiValue);return;}let inputOption=event.target.closest('[data-input-key]');if(inputOption){setInputOption(inputOption.dataset.inputKey,inputOption.dataset.inputValue);return;}let highway=event.target.closest('[data-highway-mode]');if(highway){toggleRideHighway(highway.dataset.highwayMode);return;}let cash=event.target.closest('[data-deposit]');if(cash){setDeposit(cash.dataset.deposit);return;}let select=event.target.closest('[data-setcol]');if(select){handleSetCol(select.dataset.setcol,select.dataset.value);return;}let waitPlace=event.target.closest('[data-wait-place]');if(waitPlace){const sh=getShift();if(sh?.waiting&&!sh.draft){sh.waiting.place=waitPlace.dataset.waitPlace;saveLater();refreshWaitView(sh.waiting.id);}return;}});
appEl.addEventListener('click',event=>{const target=event.target.closest('[data-pay-amount]');if(!target||!target.readOnly||target.disabled)return;activatePaymentAmount(Number(target.dataset.payAmount));});
appEl.addEventListener('keydown',event=>{if(event.target.id==='newWaitPlace'&&event.key==='Enter'){event.preventDefault();addWaitingPlace(event.target.value);}});appEl.addEventListener('input',handleInput);appEl.addEventListener('change',event=>{if(event.target.id==='importBackup'){importBackup(event.target.files?.[0]);return;}
 if(event.target.matches('[data-pref-gps-start]')){model.prefs.gpsTripAtStart=event.target.value==='off'?'off':'on';saveLater();toast('出庫時GPS設定を保存しました');return;}
 if(event.target.id==='historyDate'){historyDate=event.target.value;historyShiftId='';render();return;}
 if(event.target.id==='printShiftSelect'){printShiftId=event.target.value;render();return;} if(event.target.id==='highwayShiftSelect'){highwayShiftId=event.target.value;render();return;}
 if(event.target.id==='historyShiftSelect'){historyShiftId=event.target.value;render();return;}
 if(event.target.matches('[data-plan-end]')){const active=getShift();if(active){active.plannedEndAt=event.target.value;saveLater();render();}return;}
if(event.target.matches('[data-cloud-token]')){if(setGoogleWriteKey(event.target.value)){setGoogleStatus('接続キーを保存しました。送信テストを行ってください');saveLater();}return;}
if(event.target.matches('[data-cloud-setting],[data-file-setting]')){handleSheetTargetSetting(event.target);return;}
if(event.target.matches('[data-col],[data-pref],[data-setting],[data-meta],[data-shiftstart],[data-shift-odo],[data-wait-field],[data-pay-method]')){handleInput(event);}});
window.addEventListener('beforeunload',()=>{if(persistTimer){clearTimeout(persistTimer);save();}});
await load();if(upgradeWaitingHistory())await save();render();if(getShift()?.gpsTrip?.enabled)gpsTripUI?.start(getShift(),true);
if(sheetTargetPrefs().mode==='auto')scheduleGoogleSync();
window.addEventListener('online',()=>{if(sheetTargetPrefs().mode==='auto')scheduleGoogleSync();});
document.addEventListener('visibilitychange',()=>{gpsTripUI?.hidden();if(document.visibilityState==='visible'&&sheetTargetPrefs().mode==='auto')scheduleGoogleSync();});

})().catch(function (err) {
  console.error('TAXIAPP startup error:',err);
  var root=document.getElementById('app');
  if(root && root.querySelector('.boot')) {
    root.innerHTML='<div style="margin:20px;padding:20px;border:1px solid #c66;border-radius:12px;background:#fff8f8"><h2>TAXIAPPの起動に失敗しました</h2><p>再読み込みしても進まない場合は、Chromeで開いてください。</p><p id="bootErr"></p></div>';
    document.getElementById('bootErr').textContent=String(err && err.message || err);
  }
});
</script>
