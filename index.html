/* v0.1.4 One-meter operation UI (independent of the business logic) */
:root{--ui-font:1.30;--ui-touch:62px;--ui-primary-touch:78px}
html[data-ui-text="normal"]{--ui-font:1}
html[data-ui-text="large"]{--ui-font:1.30}
html[data-ui-text="extra"]{--ui-font:1.55}
html[data-ui-buttons="normal"]{--ui-touch:48px;--ui-primary-touch:66px}
html[data-ui-buttons="large"]{--ui-touch:62px;--ui-primary-touch:78px}
html[data-ui-buttons="extra"]{--ui-touch:78px;--ui-primary-touch:96px}
.h1{font-size:calc(27px * var(--ui-font));line-height:1.24}
.h2{font-size:calc(19px * var(--ui-font));line-height:1.3}
.hero-heading{font-size:calc(23px * var(--ui-font));line-height:1.35}
.field .field-label,.field-label{font-size:calc(13px * var(--ui-font));line-height:1.45}
.field-sub{font-size:calc(11px * var(--ui-font))}
.helper,.meta,.panel-strip,.warn,.danger-note,.statline,.sidebar-note,.ui-preview p{font-size:calc(13px * var(--ui-font));line-height:1.5}
.caption-note,.tag,.footnote,.wait-history,.small,.pill,.eyebrow,.brand-tag,.metric .label,.metric small{font-size:calc(12px * var(--ui-font));line-height:1.5}
.metric strong{font-size:calc(23px * var(--ui-font))}
.metric .label{font-size:calc(12px * var(--ui-font))}
.control{font-size:calc(17px * var(--ui-font));min-height:var(--ui-touch);line-height:1.4}
.btn{font-size:calc(14px * var(--ui-font));min-height:var(--ui-touch);padding:10px 13px;line-height:1.4}
.btn.big{font-size:calc(19px * var(--ui-font));min-height:var(--ui-primary-touch);padding:14px 15px}
.chip{font-size:calc(14px * var(--ui-font));min-height:var(--ui-touch);min-width:var(--ui-touch);line-height:1.3;padding:10px 11px}
.chip.label-chip{font-size:calc(13px * var(--ui-font));min-width:var(--ui-touch)}
.details summary{font-size:calc(15px * var(--ui-font));min-height:var(--ui-touch)}
.nav button{min-height:var(--ui-touch)}.nav-label{font-size:calc(13px * var(--ui-font));line-height:1.25}
.nav-ico{font-size:calc(19px * var(--ui-font))}
.settings-advanced>summary{font-size:calc(16px * var(--ui-font));border-radius:12px;background:#e7f1fa;padding:18px 16px}.settings-advanced>.inner{padding:12px}.settings-advanced>.inner .card{padding:17px}.settings-advanced .control{max-width:100%}
.ui-choice{margin:10px 0 16px}.ui-choice>.chip{flex:1;min-width:0}
.ui-preview{border:2px solid #9eb9d8;background:#f1f8ff;border-radius:16px;padding:16px;margin-top:22px}
.ui-preview strong{font-size:calc(17px * var(--ui-font));display:block;margin-bottom:5px}
.passenger-control{margin:5px 0 12px}
.passenger-control .selector{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.passenger-control .chip{min-width:0}
html[data-ui-contrast="high"]{--line:#95a8bd;--muted:#405771;--blue:#0654a3;--dark:#13263b;--teal:#00635d}
html[data-ui-contrast="high"] .card,html[data-ui-contrast="high"] .metric{border-width:2px}
html[data-ui-contrast="high"] .control,html[data-ui-contrast="high"] .chip{border:2px solid #6c849e}
html[data-ui-contrast="high"] .chip.active{background:#d7edff;border:3px solid #094d96;color:#063b7b}
html[data-ui-contrast="high"] .btn:focus-visible,html[data-ui-contrast="high"] button:focus-visible{outline:4px solid #e8a421;outline-offset:2px}
html[data-ui-theme="night"]{color-scheme:dark;--sheet:#182a3f;--line:#3b5772;--muted:#b0c3da;--blue:#71b8ff;--dark:#e9f5ff;--teal:#52d5ca;color:#edf5ff;background:#101c2a}
html[data-ui-theme="night"] body{background:#101c2a;color:#edf5ff}
html[data-ui-theme="night"] .card,html[data-ui-theme="night"] .metric,html[data-ui-theme="night"] .sheet-page,html[data-ui-theme="night"] .details,html[data-ui-theme="night"] .sidebar{background:#182a3f;color:#edf5ff;border-color:#3b5772}
html[data-ui-theme="night"] .hero,html[data-ui-theme="night"] .ui-preview,html[data-ui-theme="night"] .details summary{background:#243a54;color:#edf5ff;border-color:#5882a7}
html[data-ui-theme="night"] .control,html[data-ui-theme="night"] .chip,html[data-ui-theme="night"] .btn:not(.primary):not(.teal):not(.dark){background:#263d56;color:#eff7ff;border-color:#6588a9}
html[data-ui-theme="night"] .chip.active{background:#194b70;color:#fff;border-color:#73c2ff}
html[data-ui-theme="night"] .btn.primary{background:#1775c9;color:#fff;border-color:#1775c9}
html[data-ui-theme="night"] .btn.teal{background:#076961;color:#fff;border-color:#48b7a9}
html[data-ui-theme="night"] .btn.dark{background:#294766;color:#fff}
html[data-ui-theme="night"] .helper,html[data-ui-theme="night"] .caption-note,html[data-ui-theme="night"] .tag,html[data-ui-theme="night"] .footnote,html[data-ui-theme="night"] .meta,html[data-ui-theme="night"] .field-label,html[data-ui-theme="night"] .field .field-label,html[data-ui-theme="night"] .brand-tag,html[data-ui-theme="night"] .metric .label,html[data-ui-theme="night"] .metric small{color:#bed0e3}
html[data-ui-theme="night"] .panel-strip,html[data-ui-theme="night"] .warn,html[data-ui-theme="night"] .danger-note,html[data-ui-theme="night"] .local-warning,html[data-ui-theme="night"] .wait-summary{background:#243f56;color:#f4f8ff;border-color:#63829e}
html[data-ui-theme="night"] .nav button{color:#daeaff}html[data-ui-theme="night"] .nav button.selected{background:#214a72;color:#fff}
html[data-ui-theme="night"] .data-table th{background:#263d56;color:#d8edff}html[data-ui-theme="night"] .data-table td{border-color:#3b5772}
html[data-ui-theme="night"] .status-pill{background:#24473f;color:#d5fff4}html[data-ui-theme="night"] .status-pill.stop{background:#314459;color:#eaf1ff}
html[data-ui-theme="night"] .pill{background:#194b70;color:#deedff;border-color:#639ac7}
html[data-ui-theme="night"] .eyebrow{color:#b3ddff}
@media(max-width:700px){
  .layout{padding:12px 10px calc(var(--ui-touch) * 1.7 + 45px)}
  .sidebar .nav button{min-height:calc(var(--ui-touch) + 8px);padding:7px 1px}
  .sidebar .nav .nav-ico{font-size:calc(19px * var(--ui-font));line-height:1}
  .sidebar .nav .nav-label{font-size:clamp(10px,calc(11px * var(--ui-font)),17px);line-height:1.2}
  .card{padding:16px}
  .action-grid{gap:10px}
  .form-grid,.form-grid.three,.details .form-grid{gap:14px}
  .ui-preview .action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .ui-preview .btn.big{overflow-wrap:anywhere}
}
@media(max-width:360px){.ui-choice>.chip{padding-left:4px;padding-right:4px}}


/* v0.1.5: unobtrusive interface; warnings, GPS status and actual financial values stay visible. */
html[data-ui-help="hide"] .helper,
html[data-ui-help="hide"] .field-sub,
html[data-ui-help="hide"] .caption-note:not([role="status"]),
html[data-ui-help="hide"] .footnote,
html[data-ui-help="hide"] .sidebar-note,
html[data-ui-help="hide"] .wait-history,
html[data-ui-help="hide"] .explainer,
html[data-ui-help="hide"] .eyebrow {display:none!important;}
html[data-ui-help="hide"] .hero-heading {margin-bottom:12px;}
html[data-ui-help="hide"] .section-heading {margin-bottom:13px;}
.cash-checkout{margin-top:18px;padding:16px;border:2px solid #7296bb;border-radius:17px;background:#f4f9ff;display:grid;gap:13px;}
.cash-due,.cash-change{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:calc(16px * var(--ui-font));font-weight:750;}
.cash-due strong{font-size:calc(23px * var(--ui-font));font-variant-numeric:tabular-nums;color:#154f91;}
.cash-change{background:#dff6ee;color:#135d42;border:2px solid #82c6ad;border-radius:12px;padding:11px 14px;}
.cash-change strong{font-size:calc(31px * var(--ui-font));font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.cash-shortfall:not(:empty){width:100%;font-size:calc(15px * var(--ui-font));color:#a12e2e;}
.cash-deposit{font-size:calc(24px * var(--ui-font));text-align:right;font-weight:800;}
.deposit-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;}
.deposit-buttons .btn{font-size:calc(13px * var(--ui-font));padding:6px 4px;min-width:0;white-space:nowrap;}
html[data-ui-theme="night"] .cash-checkout{background:#233b54;border-color:#5f95c3;}
html[data-ui-theme="night"] .cash-due strong{color:#a9d8ff;}
html[data-ui-theme="night"] .cash-change{background:#123c34;color:#d6ffeb;border-color:#4a9c84;}
html[data-ui-theme="night"] .cash-shortfall:not(:empty){color:#ffc6bb;}
@media(max-width:510px){.deposit-buttons{grid-template-columns:repeat(3,minmax(0,1fr));}.cash-checkout{padding:14px 12px;}}

/* v0.3.1: high-visibility waiting clock and single-tap standby notes */
.compact-metrics{grid-template-columns:repeat(2,minmax(0,1fr));}
.wait-display{background:#f6fbff;border:2px solid #b5d5eb;border-radius:16px;padding:16px;margin-top:10px;}
.wait-clock{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
.wait-clock>div{display:flex;flex-direction:column;gap:2px;min-width:0;}
.wait-title{font-size:calc(13px * var(--ui-font));font-weight:750;color:#506782;}
.wait-clock strong{font-size:clamp(25px,calc(30px * var(--ui-font)),56px);line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;}
.wait-inputs{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start;}

<script>
/* If an exception occurs during boot, don't leave the user on a perpetual spinner. */
(function () {
  function showBootError(message) {
    var root = document.getElementById('app');
    if (root && root.querySelector('.boot')) {
      root.innerHTML = '<main style="padding:30px;font-family:sans-serif;max-width:650px;margin:auto"><h2>起動できませんでした</h2><p>ブラウザの制限またはプログラムエラーが発生しました。</p><p style="overflow-wrap:anywhere">' + String(message || '').replace(/</g,'&lt;') + '</p><p>Chromeで開き直してください。既存データは削除しないでください。</p></main>';
    }
  }
  window.addEventListener('error', function (e) { showBootError(e.message); });
  window.addEventListener('unhandledrejection', function (e) { showBootError(e.reason && e.reason.message || e.reason); });
  setTimeout(function () { if (document.querySelector('#app > .boot')) showBootError('起動に時間がかかっています。'); }, 8000);
})();
</script>

 shift.waiting={id:`wait-${now.getTime()}-${Math.floor(Math.random()*10000)}`,startedAt:stamp(now),startedIso:now.toISOString(),place:'',odometer:'',geo:null,gpsStatus:'GPSを取得中…'};
 return shift.waiting;
}
function elapsedWaitingText(waiting,now=new Date()){
 if(!waiting?.startedIso)return '00:00';
 const elapsed=Math.max(0,Math.floor((now.getTime()-Date.parse(waiting.startedIso))/1000));
 const hours=String(Math.floor(elapsed/3600)).padStart(2,'0');
 const minutes=String(Math.floor((elapsed%3600)/60)).padStart(2,'0');
 return `${hours}:${minutes}`;
}
function makeDispatch(shift,now=new Date(),type='G'){
 if(shift.records.length>=MAX_RECORDS)throw new Error('1乗務60件を超えて登録できません');
 const previous=shift.waiting||null;
 const d=makeDraft(shift,'dispatch',now,type);
 pauseWaiting(shift,now,'dispatch');
 d.raw.C=stamp(now);d.raw.E=type;d.status='dispatching';
 d.meta.dispatchAt=stamp(now);d.meta.dispatchIso=now.toISOString();d.meta.dispatchNote='';d.meta.waitStartBeforeDispatch=previous?.startedAt||'';d.meta.waitPlace=previous?.place||'';d.meta.waitOdometer=previous?.odometer??'';
 return d;
}
function boardDispatch(shift,now=new Date()){
 const d=shift.draft;if(!d||d.kind!=='dispatch')throw new Error('迎車中の記録がありません');
 d.kind='ride';d.status='draft';d.raw.G=stamp(now);d.meta.boardedFromDispatch=true;d.meta.boardedIso=now.toISOString();return d;
}
function cancelDispatch(shift,now=new Date()){
 const d=shift.draft;if(!d||d.kind!=='dispatch')throw new Error('迎車中の記録がありません');
 d.kind='cancel';d.status='draft';d.raw.B='キャンセル';d.raw.N='キ';d.raw.K=0;d.meta.cancelAt=stamp(now);d.meta.cancelIso=now.toISOString();
 const prev=[...shift.records].reverse().find(x=>x.kind==='ride'&&x.raw?.M);
 // 旧記録と同様、キャンセル欄の距離・時刻は前回の降車から継承する。
 if(prev){d.raw.G=prev.raw.M;d.raw.M=prev.raw.M;d.raw.F=prev.raw.L;d.raw.L=prev.raw.L;}
 return d;
}
function makeDraft(shift,kind='ride',now=new Date(),type='乗'){
 if(shift.records.length>=MAX_RECORDS)throw new Error('1乗務60件を超えて登録できません');
 const raw=blankRaw();raw.A=shift.records.length+1;
 const previous=[...shift.records].reverse().find(x=>x.raw?.M || x.meta?.cancelAt);
 raw.C=previous?.raw?.M||previous?.meta?.cancelAt||shift.startedAt;
 raw.E=kind==='empty'?'':type;
 if(kind==='ride'){raw.G=stamp(now);raw.P='';}
 if(kind==='cancel'){raw.B='キャンセル';raw.N='キ';raw.K=0;}
 if(kind==='empty'){raw.P='空';}
 return {id:`record-${now.getTime()}-${Math.floor(Math.random()*10000)}`,kind,raw,meta:{createdAt:now.toISOString(),serviceDate:shift.date,cancelAt:kind==='cancel'?stamp(now):'',pickupGeo:null,dropGeo:null,uberReservation:'',uberTip:'',uberAppDisplayed:''},status:'draft'};
}

/* 乗務員回収とアプリ運営会社回収を区別する。
   GOの200円は営業完了後だけ計上し、メーター売上には一切混ぜない。 */
function driverCollects(type){return Boolean(type)&&!['G','D','U','乗','キ'].includes(type);}
function goCollectionFee(row,settings={},completedOnly=false){
 if(!row||row.kind!=='ride'||row.raw?.E!=='G'||(completedOnly&&row.status!=='complete'))return 0;
 const first=row.raw.N,second=row.meta?.splitPayment?.second;
 return driverCollects(first)||driverCollects(second)?feeSettings(settings).goFee:0;
}
function hasRealHighway(raw){return String(raw?.P||'').includes('実');}
function hasEmptyHighway(raw){return String(raw?.P||'').includes('空');}
function calculatedDiscount(raw){
 const meter=number(raw?.K);
 return (raw?.O==='シ'||raw?.O==='高')&&meter!==null?Math.ceil(Math.max(0,meter)/100)*10:0;
}
function updateDiscountForDraft(d,changed=''){
 if(!d?.raw||d.kind!=='ride')return;
 const raw=d.raw;
 if(changed==='AR'){
  d.meta??={};d.meta.discountManual=number(raw.AR)!==null&&number(raw.AR)>0;
  return;
 }
 if(changed==='O'){
  d.meta??={};d.meta.discountManual=false;
 }
 if(raw.O!=='シ'&&raw.O!=='高'){
  if(changed==='O')raw.AR='';
  return;
 }
 if(d.meta?.discountManual&&number(raw.AR)>0)return;
 raw.AR=number(raw.K)===null?'':calculatedDiscount(raw);
}
function deriveRaw(row,settings={}){
 const raw={...row.raw}; const cfg=feeSettings(settings);
 const parts=['AF','AG','AH'].map(k=>number(raw[k]));
 if(hasEmptyHighway(raw))raw.AI=parts.reduce((s,x)=>s+(x??0),0);
 const distance=(a,b)=>number(raw[a])!==null&&number(raw[b])!==null?Math.max(0,Math.round((Number(raw[b])-Number(raw[a]))*10)/10):null;
 // 区間距離は運転手が入力しない。乗距離・降距離から自動算出し、
 // 既存44列CSVのX/AJに互換出力する。旧版の手入力値より実距離を優先する。
 // 高速距離の75％を免除距離として計算する。端数は1走行ごとに
 // 大きく丸めず、集計時に再計算できるよう最大0.001kmで保持する。
 const exemption=d=>Math.round(d*0.75*1000)/1000;
 if(hasRealHighway(raw)){const d=distance('S','V');if(d!==null){raw.X=d;raw.Y=exemption(d);}}
 if(hasEmptyHighway(raw)){const d=distance('AB','AE');if(d!==null){raw.AJ=d;raw.AK=exemption(d);}}
 if((raw.O==='シ'||raw.O==='高')&&(number(raw.AR)===null||number(raw.AR)===0)&&!row.meta?.discountManual&&number(raw.K)!==null)raw.AR=calculatedDiscount(raw);
 const hasAlighted=Boolean(raw.M);
 raw.AQ=hasAlighted?goCollectionFee(row,cfg,true):0;
 if(row.kind==='cancel'){raw.N='キ';raw.K=0;raw.AQ=0;}
 return raw;
}
/* Estimate the cash payment amount using the same basis as the v0.1.4 reference amount.
   When the operator explicitly enters AN (料金), treat that value as authoritative
   for change; otherwise this stays a provisional estimate until account reconciliation. */
function uberHasInCabPayment(row){
 const a=row?.raw?.N||'',b=row?.meta?.splitPayment?.second||'';
 return row?.raw?.E==='U' && [a,b].some(x=>x&&x!=='U'&&x!=='キ');
}
/* Uber input is the *customer-facing* amount displayed by Uber.
   Example A: meter 2000 -> displayed 1800: app pays 200, in-cab 1800.
   Example B: meter 2000 -> displayed 2100: in-cab pays 2100,
              extra 100 is a dispatch charge, NOT meter sales and NOT remitted.
   Do not infer a discount from either case. Never double-count the 100 fee. */
function uberAppAmounts(row,settings={}){
 if(row?.kind!=='ride'||row?.raw?.E!=='U')return null;
 const displayed=number(row?.meta?.uberAppDisplayed),meter=number(row?.raw?.K);
 if(displayed===null||meter===null)return null;
 const cfg=feeSettings(settings);
 const positiveDifference=Math.round(displayed-meter);
 const surcharge=positiveDifference>0?positiveDifference:0;
 const appPaid=Math.max(0,Math.round(meter-displayed));
 return {displayed,appPaid,surcharge,meter,valid:displayed>=0&&(surcharge===0||surcharge===cfg.uberSurcharge)};
}
function uberDispatchFeeApplies(row,serviceDate='',settings={}){
 const app=uberAppAmounts(row,settings);
 // Determine the fee only from an observed Uber app amount, never from a guess.
 return Boolean(app?.valid && app.surcharge>0 && uberHasInCabPayment(row));
}
function estimatedCashDue(row,settings={},shiftDate=''){
 if(!row||row.kind!=='ride')return null;
 const raw=row.raw||{};
 const authoritative=number(raw.AN);
 if(authoritative!==null)return Math.max(0,Math.round(authoritative));
 const meter=number(raw.K);if(meter===null)return null;
 const cfg=feeSettings(settings),isUber=raw.E==='U';
 const discount=(raw.O==='シ'||raw.O==='高')&&!row.meta?.discountManual&&(number(raw.AR)===null||number(raw.AR)===0)?calculatedDiscount(raw):amount(raw.AR);
 const uberReservation=isUber?amount(row.meta?.uberReservation):0;
 // When the Uber app displays meter + 100 yen, the additional fee is collected
 // from the passenger but is excluded from company cash remittance.
 const app=uberAppAmounts(row,settings);
 const uberSurcharge=app?.valid&&uberDispatchFeeApplies(row,shiftDate,settings)?app.surcharge:0;
 const goFee=goCollectionFee(row,cfg,false);
 return Math.max(0,Math.round(meter+amount(raw.W)+uberReservation+uberSurcharge+goFee-discount));

function cashChange(row,settings={},shiftDate=''){
 const split=paymentBreakdown(row,settings,shiftDate);
 // Cash deposits must be reconciled against CASH due, not card/ticket/app-paid amounts.
 const due=split.due===null?null:Math.max(0,Math.round(split.items.filter(x=>x.type==='現').reduce((sum,x)=>sum+x.amount,0)));
 const deposit=number(row?.raw?.AO);
 return {due,deposit,change:due===null||deposit===null?null:Math.max(0,Math.round(deposit-due)),
         shortage:due===null||deposit===null?null:Math.max(0,Math.round(due-deposit))};

function syncCashChange(row,settings={},shiftDate=''){
 if(!row?.raw)return null;
 const result=cashChange(row,settings,shiftDate);
 row.raw.AP=result.change===null?'':result.change;

function pricing(row,settings={},shiftDate=''){
 const cfg=feeSettings(settings),raw=deriveRaw(row,cfg),done=row.status==='complete';
 const meter=row.kind==='ride'&&done?amount(raw.K):0;

 const cancellation=row.kind==='cancel'&&done?cfg.cancelFee:0;
 const goFee=done?amount(raw.AQ):0;
 const discount=row.kind==='ride'&&done?amount(raw.AR):0;
 const uberRide=done&&raw.E==='U'&&(row.kind==='ride'||row.kind==='cancel');
 const reservation=uberRide?amount(row.meta?.uberReservation):0;
 const tip=uberRide?amount(row.meta?.uberTip):0;
 // Uber basic commission covers trip sales, cancellation and reservation; never toll or tip.
 const uberFee=0; // 事業者契約の料率は乗務員向けの日報では推測・計上しない。
 // Additional dispatch fee began 2026-09-28; Uber app-paid transactions are excluded.
 const serviceDate=shiftDate||row.meta?.serviceDate||dateStamp(new Date());

}
/* 売上（メーター）と受取額（手数料を含む）を別々に保持する。
   GO回収手数料は総入金額へ別加算、Uber100円は会社へ納金しない。 */
function settledTenderAmounts(row,settings={},shiftDate=''){
 const split=paymentBreakdown(row,settings,shiftDate);
 const raw=split.items.filter(x=>x.type&&x.amount!==null).map(x=>({type:x.type,received:Math.max(0,Math.round(x.amount)),company:Math.max(0,Math.round(x.amount))}));
 const fees=pricing(row,settings,shiftDate);
 let goLeft=fees.goFee,uberLeft=fees.uberSurcharge;
 // 預り手数料は乗務員が扱う金種側へ、現金優先で割り当てる。
 const driver=raw.filter(x=>driverCollects(x.type)).sort((a,b)=>(a.type==='現'?0:1)-(b.type==='現'?0:1));
 for(const item of driver){const go=Math.min(item.company,goLeft);item.company-=go;goLeft-=go;}
 for(const item of driver){const fee=Math.min(item.company,uberLeft);item.company-=fee;uberLeft-=fee;}

}
function totals(records=[],settings={},shiftDate=''){
 const t={records:records.length,rides:0,cancels:0,emptyHighways:0,cashReceived:0,cashDeposit:0,uberCashNoDeposit:0,meter:0,realToll:0,emptyToll:0,cancellation:0,goFee:0,uberFee:0,uberSurcharge:0,uberCrewShare:0,reservation:0,tip:0,discount:0,customerBill:0,printedDetail:0,paymentTotals:{},unallocatedFees:0};
 for(const row of records){
  if(row.status!=='complete')continue;
  const p=pricing(row,settings,shiftDate);
  if(row.kind==='ride')t.rides++;
  if(row.kind==='cancel')t.cancels++;
  if((row.kind==='ride'||row.kind==='empty')&&hasEmptyHighway(row.raw))t.emptyHighways++;
  for(const key of ['meter','realToll','emptyToll','cancellation','goFee','uberFee','uberSurcharge','uberCrewShare','reservation','tip','discount','customerBill','printedDetail'])t[key]+=p[key];
  if(row.kind==='ride'){
   const settlement=settledTenderAmounts(row,settings,shiftDate);
   t.unallocatedFees+=settlement.unallocatedFees;
   for(const item of settlement.items){t.paymentTotals[item.type]=(t.paymentTotals[item.type]||0)+item.company;
    if(item.type==='現'){t.cashReceived+=item.received;t.cashDeposit+=item.company;t.uberCashNoDeposit+=Math.min(p.uberSurcharge,item.received-item.company);}}
  } else if(row.kind==='cancel'){
   // キは印刷上のキャンセル記号であり、メーター運賃の決済方法ではない。
   t.paymentTotals['キ']=(t.paymentTotals['キ']||0)+p.cancellation;
  }

 // 現金はGO手数料とUber納金不要100円を除いた金額。空車高速は雑損控除。
 t.cashRemittance=t.meter-t.discount-Object.entries(t.paymentTotals).reduce((sum,[code,value])=>sum+(code!=='現'&&code!=='キ'?value:0),0)-t.emptyToll;

 // 運賃以外の実車高速は現金納金額に含めず、二重計上を防ぐ。
 t.etcRemittance=t.realToll+t.emptyToll;
 t.totalRemittance=t.cashRemittance+t.goFee+t.etcRemittance;
 return t;
}

/* The old A:AR schema can store only one main payment code. Split amounts are stored in meta
   and exported separately; never silently attribute the full price to the first method. */
function splitPaymentMeta(row){return row.meta?.splitPayment||{second:'',manualSlot:null,manualAmount:''};}
function paymentBreakdown(row,settings={},shiftDate=''){
 const charge=estimatedCashDue(row,settings,shiftDate);
 const uber=uberAppAmounts(row,settings);
 const first=row.raw?.N||'',cfg=splitPaymentMeta(row),second=cfg.second&&cfg.second!==first?cfg.second:'';
 const slot=cfg.manualSlot===0||cfg.manualSlot===1?cfg.manualSlot:null;
 const amt=number(cfg.manualAmount);
 const hasManual=Boolean(second)&&slot!==null&&amt!==null&&String(cfg.manualAmount)!=='';
 const due=charge===null?null:Math.round(charge);
 let firstAmount=due,secondAmount=0;
 if(second&&due!==null&&hasManual){firstAmount=slot===0?amt:due-amt;secondAmount=slot===1?amt:due-amt;}
 if(!second&&slot===0&&amt!==null&&due!==null)firstAmount=amt;
 if(due===null){firstAmount=null;secondAmount=null;}
 let incomplete=(Boolean(second)&&!hasManual)||(!second&&slot===0&&amt!==null&&due!==null&&amt!==due);
 let invalidUber=Boolean(uber&&!uber.valid);
 let autoUber=false;
 // If the driver enters the amount shown on the Uber app, the difference from
 // the meter is app-paid, NOT a fare discount. Remaining fare is settled in-car.
 // Additional customer dispatch fee (if applicable) is separately accounted for.
 if(uber&&uber.valid&&due!==null){
  autoUber=true;
  const cabinDue=Math.round(due-uber.appPaid);
  if(first==='U'){
   firstAmount=uber.appPaid;
   secondAmount=second?cabinDue:0;
   incomplete=cabinDue>0&&!second;
  }else if(second==='U'){
   firstAmount=cabinDue;secondAmount=uber.appPaid;incomplete=false;
  }else if(second){
   if(hasManual){firstAmount=slot===0?amt:cabinDue-amt;secondAmount=slot===1?amt:cabinDue-amt;}
   else{firstAmount=cabinDue;secondAmount=0;}
   incomplete=!hasManual;
  }else{firstAmount=cabinDue;secondAmount=0;incomplete=!first&&cabinDue>0;}
 }
 const invalid=hasManual&&due!==null&&!(autoUber&&(first==='U'||second==='U'))&&(amt<0||amt>(autoUber?due-uber.appPaid:due)) || (!second&&slot===0&&amt!==null&&due!==null&&(amt<0||amt>due));
 let items=due===null?[]:[{type:first,amount:firstAmount},...(second?[{type:second,amount:secondAmount}]:[])];
 if(autoUber&&first!=='U'&&second!=='U')items.push({type:'U',amount:uber.appPaid});

}
function validatePaymentBreakdown(row,settings={},shiftDate=''){
 if(row.kind!=='ride')return [];
 const p=paymentBreakdown(row,settings,shiftDate),errors=[];
 if(p.invalidUber)errors.push('Uberアプリ表示額がメーターを超える場合、差額は配車手数料100円か確認してください');
 if(p.invalid)errors.push('支払金額が請求額を超えています');
 if(p.incomplete)errors.push(p.autoUber?'車内決済の金種・割り振りを確認してください':p.second?'どちらか一方の金額を入力してください':'残額がある場合は追加金種を選択してください');
 if(p.second&&p.first===p.second)errors.push('同じ金種を重複して選べません');

}
function splitPaymentRows(shift){const rows=[];
 for(const record of shift.records){if(record.kind!=='ride'||record.status!=='complete')continue;
  const p=settledTenderAmounts(record,shift.settings,shift.date),split=p.split;
  for(const item of p.items){
   rows.push([record.raw.A,record.raw.E,item.type,item.received,item.company,split.due,record.raw.K||0,record.raw.W||0,item.type===record.raw.N?'最初の金種':item.type==='U'&&uberAppAmounts(record,shift.settings)?'Uberアプリ自動計算':'追加金種',record.meta?.uberAppDisplayed??'',item.received-item.company,item.type==='現'?item.company:'']);
  }

}
function exportPaymentsCsv(shift){const heading=['日報番号','配車区分','金種','乗務員・アプリ受取額','会社精算に算入する額','精算請求額','メーター金額','実車高速','金種内訳','Uberアプリ表示額','GO・Uber手数料の別管理額','うち現金納金対象額'];return '\ufeff'+[heading,...splitPaymentRows(shift)].map(r=>r.map(csvQuote).join(',')).join('\r\n')+'\r\n';}

function validateDraft(draft){let errs=[];if(!draft)errs.push('入力データがありません');else if(draft.kind==='ride'){

const DB_NAME='taxiapp-store-v1';const STORE='state';const KEY='taxiapp';
const appEl=document.getElementById('app'), noticeEl=document.getElementById('notice');
const labels={drive:['🚕','乗務入力'],live:['◴','営業状況'],history:['▤','営業履歴'],summary:['▥','日報集計'],print:['▧','印刷準備'],shift:['◷','出庫・入庫'],settings:['⚙','表示設定']};

let historyDate='',historyShiftId='',printShiftId='',storageStatus='確認中';

function safeText(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
const UI_DEFAULTS={text:'large',buttons:'large',contrast:'high',theme:'day',help:'hide'};

function renderInputChoice(key,choices){const value=inputPrefs()[key];return `<div class="selector ui-choice" role="group">${choices.map(([v,label])=>`<button type="button" class="chip ${value===v?'active':''}" data-input-key="${key}" data-input-value="${v}" aria-pressed="${value===v}">${safeText(label)}</button>`).join('')}</div>`;}
function numberInputMode(kind){return inputPrefs().keyboard==='system'?(kind==='distance'?'decimal':'numeric'):'none';}

function waitingPlaces(){return Array.isArray(model.prefs?.waitPlaces)?model.prefs.waitPlaces.filter(v=>typeof v==='string'&&v.trim()).slice(0,30):[];}
function addWaitingPlace(name){
 const place=String(name??'').replace(/\s+/g,' ').trim();
 if(!place){toast('待機場所を入力してください',true);return false;}
 if(place.length>60){toast('待機場所は60文字以内にしてください',true);return false;}
 const items=waitingPlaces();
 if(items.includes(place)){toast('すでに登録されています',true);return false;}
 if(items.length>=30){toast('登録できる待機場所は30件までです',true);return false;}

}
function removeWaitingPlace(index){
 const items=waitingPlaces();if(!Number.isInteger(index)||index<0||index>=items.length)return;

 // Existing waiting / past history deliberately retained unchanged.

function moveWaitingPlace(index,direction){

 const other=index+step;

}
function renderWaitPlaceSettings(){

 return `<section class="card" aria-label="待機場所の設定"><h2 class="h2">待機場所の登録・並び替え</h2><p class="helper">駅・空港・乗り場などを登録できます。↑ ↓ で並び替えると、待機開始時の選択一覧にも同じ順番で表示します。</p><div class="wait-place-settings"><input class="control" id="newWaitPlace" maxlength="60" placeholder="例：大阪空港／○○駅タクシー乗り場" aria-label="新しい待機場所"><button class="btn primary" type="button" data-action="addWaitPlace">＋ 追加</button></div>${items.length?`<div class="wait-place-list">${entries}</div>`:'<p class="caption-note">登録済みの場所はありません。</p>'}<p class="footnote">順番の変更や候補の削除をしても、記録済みの待機履歴は変更されません。</p></section>`;
}
function displayPrefs(){const provided=model.prefs?.ui||{};return Object.fromEntries(Object.entries(UI_DEFAULTS).map(([k,def])=>[k,UI_OPTIONS[k].includes(provided[k])?provided[k]:def]));}
function applyUi(){const settings=displayPrefs();for(const [k,value] of Object.entries(settings))document.documentElement.dataset['ui'+k[0].toUpperCase()+k.slice(1)]=value;document.documentElement.style.colorScheme=settings.theme==='night'?'dark':'light';}
function renderUiChoice(key,choices){const value=displayPrefs()[key];return `<div class="selector ui-choice" role="group" aria-label="${safeText(key)}">${choices.map(([v,label])=>`<button type="button" class="chip ${value===v?'active':''}" data-ui-key="${key}" data-ui-value="${v}" aria-pressed="${value===v}">${label}</button>`).join('')}</div>`;}
function setUiOption(key,value){if(!(key in UI_OPTIONS)||!UI_OPTIONS[key].includes(value))return;model.prefs??={};model.prefs.ui={...displayPrefs(),[key]:value};applyUi();saveLater();render();}
function getShift(){return model.shifts.find(x=>x.id===model.activeId)||null;}
function selectedShift(){return getShift()||model.shifts[0]||null;}
function historyMatches(){const date=historyDate||selectedShift()?.date||dateStamp();return (model.shifts||[]).filter(s=>s.date===date).sort((a,b)=>String(b.startedIso||'').localeCompare(String(a.startedIso||'')));}
function selectedHistoryShift(){const a=historyMatches();return a.find(s=>s.id===historyShiftId)||a[0]||null;}
function selectedPrintShift(){return model.shifts.find(s=>s.id===printShiftId)||selectedShift();}
function lastPayment(shift){return (shift?.records||[]).filter(r=>r.kind==='ride'&&r.status==='complete'&&r.meta?.settledIso&&Number.isFinite(Date.parse(r.meta.settledIso))).sort((a,b)=>Date.parse(b.meta.settledIso)-Date.parse(a.meta.settledIso))[0]||null;}
function durationSeconds(a,b=new Date()){const start=Date.parse(a),end=b instanceof Date?b.getTime():Date.parse(b);return Number.isFinite(start)&&Number.isFinite(end)?Math.max(0,Math.floor((end-start)/1000)):null;}
function durationHms(total){if(total===null||!Number.isFinite(total))return '計測待ち';const h=Math.floor(total/3600),m=Math.floor(total%3600/60),sec=total%60;return [h,m,sec].map(x=>String(x).padStart(2,'0')).join(':');}
function durationJapanese(seconds){if(seconds===null||!Number.isFinite(seconds))return '計測待ち';const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),sec=Math.floor(seconds%60);return `${String(h).padStart(2,'0')}時間${String(m).padStart(2,'0')}分${String(sec).padStart(2,'0')}秒`;}
function rideDurationSeconds(raw){if(!raw?.G||!raw?.M)return 0;const toSec=value=>{const v=String(value).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);return v?Number(v[1])*3600+Number(v[2])*60+Number(v[3]||0):null};const a=toSec(raw.G),b=toSec(raw.M);return a===null||b===null?0:(b>=a?b-a:b+86400-a);}
function closedWaitSeconds(shift){return (shift?.waitSegments||[]).reduce((sum,w)=>sum+(durationSeconds(w.startedIso,w.endedIso)||0),0);}
function totalWaitSeconds(shift,now=new Date()){return closedWaitSeconds(shift)+(shift?.waiting?(durationSeconds(shift.waiting.startedIso,now)||0):0);}
function elapsedSinceLastPayment(shift,now=new Date()){const last=lastPayment(shift);return last?durationSeconds(last.meta.settledIso,now):null;}
function paymentElapsedPanel(shift){const last=lastPayment(shift);return `<section class="card last-payment-clock" aria-label="前回の精算からの経過時間"><div class="last-payment-heading"><strong>前回の精算から</strong><span class="caption-note">${last?'前回精算 '+safeText(new Date(last.meta.settledIso).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})):'精算完了後に計測を開始'}</span></div><div class="last-payment-value" data-last-payment-elapsed>${durationJapanese(elapsedSinceLastPayment(shift))}</div>${!last?'<p class="footnote">旧記録には精算完了時刻がないため、降車時刻で代用しません。次に精算・保存すると開始します。</p>':''}</section>`;}
function shiftElapsed(shift,now=new Date()){return durationSeconds(shift?.startedIso,shift?.endedIso||now);}
function plannedEndDatetime(shift){const val=String(shift?.plannedEndAt||'');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(val))return null;const start=new Date(shift.startedIso);if(!Number.isFinite(start.getTime()))return null;const end=new Date(start);const [h,m]=val.split(':').map(Number);end.setHours(h,m,0,0);if(end.getTime()<=start.getTime())end.setDate(end.getDate()+1);return end;}
function liveBusinessNumbers(shift,now=new Date()){
 const t=totals(shift.records,shift.settings,shift.date),elapsed=shiftElapsed(shift,now),rides=shift.records.filter(r=>r.kind==='ride'&&r.status==='complete'),activeRide=shift.draft?.kind==='ride'&&!shift.draft.editId&&shift.draft.status==='draft'?(durationSeconds(shift.draft.meta?.boardedIso||shift.draft.meta?.createdAt,now)||0):0,liveDuration=rides.reduce((sum,r)=>sum+rideDurationSeconds(r.raw),0)+activeRide,waitDuration=totalWaitSeconds(shift,now),unclassified=elapsed===null?null:Math.max(0,elapsed-liveDuration-waitDuration),hours=elapsed?elapsed/3600:0,pace=hours>0?t.meter/hours:0,plan=plannedEndDatetime(shift),totalPlanSeconds=plan?durationSeconds(shift.startedIso,plan):null,remaining=plan?Math.max(0,(plan.getTime()-now.getTime())/1000):null;
 return {t,elapsed,liveDuration,waitDuration,unclassified,pace,planned:plan,remaining,referenceEstimate:plan&&elapsed>=1800&&t.rides>0&&remaining>0?t.meter+pace*remaining/3600:null};
}
function liveBusinessRows(shift){const items=[];if(shift.waitSegments)for(const w of shift.waitSegments)items.push({at:w.startedIso||'',kind:'待機',detail:w.place||'待機場所未設定',time:shortTime(w.startedAt)});if(shift.waiting)items.push({at:shift.waiting.startedIso||'',kind:'待機中',detail:shift.waiting.place||'待機場所未設定',time:shortTime(shift.waiting.startedAt)});for(const r of shift.records||[])items.push({at:r.meta?.settledIso||'',kind:r.kind==='cancel'?'キャンセル':r.kind==='ride'?'精算':'その他',detail:`№${r.raw.A} ${r.raw.AL||'—'} → ${r.raw.AM||'—'} / ${money(amount(r.raw.K))}`,time:shortTime(r.raw.M||r.raw.C)});return items.sort((a,b)=>String(a.at||'').localeCompare(String(b.at||'')));}

function curRecord(shift){return shift?.draft||null;}
function friendlyDate(v){try{return new Date(v+'T12:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}catch{return v;}}
function shortTime(t){return t?String(t).slice(0,5):'--:--';}
function waitMinutes(shift,now=new Date()){
 const segments=shift?.waitSegments||[],seconds=segments.reduce((sum,segment)=>{
  const a=Date.parse(segment.startedIso),b=Date.parse(segment.endedIso);return sum+(Number.isFinite(a)&&Number.isFinite(b)?Math.max(0,(b-a)/1000):0);
 },0);
 const current=shift?.waiting;const a=current?Date.parse(current.startedIso):NaN;
 return Math.round((seconds+(Number.isFinite(a)?Math.max(0,(now-a)/1000):0))/60);
}
function upgradeWaitingHistory(){let changed=false;for(const shift of model.shifts||[]){
 if(shift.waitTrackingVersion===2)continue;
 // Earlier builds automatically labeled cruising as waiting. Preserve those intervals without counting them as verified waiting.
 shift.legacyWaitSegments=shift.waitSegments||[];
 shift.legacyWaiting=shift.waiting||null;
 shift.waitSegments=[];shift.waiting=null;shift.waitTrackingVersion=2;
 changed=true;
 }return changed;}

function prettyTag(r){return r.kind==='dispatch'?'迎車中':r.kind==='empty'?'空車高速':r.kind==='cancel'?'キャンセル':(r.raw.E==='G'?'GO':r.raw.E==='D'?'DiDi':r.raw.E==='U'?'Uber':'乗込み');}
function toast(text,error=false){noticeEl.textContent=text;noticeEl.style.background=error?'#8e3737':'#1a3855';noticeEl.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>noticeEl.classList.remove('visible'),3200);}
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function idbGet(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function idbPut(db,state){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function load(){try{db=await Promise.race([openDb(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('DB起動の待機時間超過')),2500))]);const m=await idbGet(db);storageStatus='IndexedDB';if(m&&m.version===1&&Array.isArray(m.shifts))model=m;}catch(e){console.warn('IndexedDB unavailable',e);db=null;try{const m=JSON.parse(localStorage.getItem('taxiapp-v1'));storageStatus='localStorage（代替保存）';if(m?.version===1&&Array.isArray(m.shifts))model=m;}catch{storageStatus='保存できない環境';}}}
async function save(){const data=deepCopy(model);try{if(db){await idbPut(db,data);storageStatus='IndexedDB';return;}localStorage.setItem('taxiapp-v1',JSON.stringify(data));storageStatus='localStorage（代替保存）';}catch(e){console.error(e);try{localStorage.setItem('taxiapp-v1',JSON.stringify(data));db=null;storageStatus='localStorage（代替保存）';return;}catch{storageStatus='保存できない環境';toast('自動保存できません。すぐにJSONバックアップを保存してください。',true);}}}
function saveLater(){clearTimeout(persistTimer);persistTimer=setTimeout(save,350);}
function renderNav(){return `<div class="sidebar"><nav class="card nav" aria-label="メインメニュー">${Object.entries(labels).map(([id,[icon,title]])=>`<button data-tab="${id}" class="${tab===id?'selected':''}" ${tab===id?'aria-current="page"':''}><span class="nav-ico">${icon}</span><span class="nav-label">${title}</span></button>`).join('')}</nav><div class="sidebar-note">端末内に自動保存します。<br>定期的にJSONバックアップも保存してください。</div></div>`;}
function header(){const shift=getShift();return `<header class="topbar"><div class="brand"><span class="brand-icon">🚕</span><div><div class="brand-name">TAXIAPP</div><div class="brand-tag">乗務日報 · ブラウザ試作 v0.3.13</div></div></div><span class="status-pill ${shift?'':'stop'}">${shift?'● 乗務中':'○ 出庫前 / 帰庫済'}</span></header>`;}
let pendingRender=false, renderAfterKeypad=false;
function render(){

function titleBlock(title,kicker,description){return `<div class="section-heading"><div><div class="eyebrow">${safeText(kicker)}</div><h1 class="h1">${safeText(title)}</h1>${description?`<div class="helper">${description}</div>`:''}</div></div>`;}
function metrics(shift){let t=totals(shift.records,shift.settings,shift.date);return `<div class="metrics compact-metrics"><div class="metric"><div class="label">本日の記録数</div><strong>${t.records}<span style="font-size:13px"> / ${MAX_RECORDS}件</span></strong><small>営業 ${t.rides}件・キャンセル ${t.cancels}件</small></div><div class="metric highlight"><div class="label">メーター売上</div><strong>${money(t.meter)}</strong><small>キャンセル・高速は別集計</small></div></div>`;}
function selector(col,values,current,descriptions=false){return `<div class="selector" role="group" aria-label="${safeText(col==='N'?'支払方法':col==='I'?'男性人数':col==='J'?'女性人数':col)}">${values.map(v=>{let key=Array.isArray(v)?v[0]:v,label=Array.isArray(v)?v[1]:v;const visible=(col==='N'||col==='I'||col==='J')?key:(descriptions?`${key} · ${label}`:label);return `<button type="button" data-setcol="${safeText(col)}" data-value="${safeText(key)}" class="chip label-chip ${String(current)===String(key)?'active':''}" aria-label="${safeText(label)}" title="${safeText(label)}" aria-pressed="${String(current)===String(key)}">${safeText(visible)}</button>`}).join('')}</div>`;}
function field(key,raw,opts={}){const info=RAW_COLUMNS.find(x=>x[0]===key)||[key,key];const label=opts.label||info[1];const value=String(raw[key]??'');const required=opts.required?' <span style="color:#b54848">*</span>':'';let control;

function renderDrive(shift){const active=getShift();if(!active){return `${titleBlock('乗務入力','DAILY OPERATIONS','出庫を記録すると、乗務データの入力を開始できます。')}<section class="card hero"><h2 class="hero-heading">現在、乗務中ではありません</h2><button class="btn primary big" type="button" data-tab="shift">🚕 出庫・入庫メニューへ</button></section>${shift?`${metrics(shift)}<div class="card"><h3 class="h2">前回の乗務</h3><p class="meta">${friendlyDate(shift.date)}　${shortTime(shift.startedAt)} ～ ${shortTime(shift.endedAt)}</p><button class="btn" data-tab="history">履歴を確認する</button></div>`:''}`;}
const t=totals(active.records,active.settings,active.date);

function renderNewAction(shift){const count=shift.records.length,waiting=shift.waiting;
 const places=waitingPlaces();
 const waitPlaceOptions=[...places];

function renderDraft(shift){const d=shift.draft,r=d.raw,editing=Boolean(d.editId);const heading=d.kind==='dispatch'?'迎車中 / お迎え先の確認':d.kind==='ride'?(d.status==='alighted'?'降車・精算入力':'実車中 / 乗車情報'):d.kind==='empty'?'空車高速の記録':'迎車キャンセルの記録';return `<section class="card hero"><div class="section-heading"><div><div class="eyebrow">${editing?'営業履歴の修正':`営業№ ${r.A}`}</div><h2 class="hero-heading">${heading}</h2></div><span class="pill ${d.kind==='empty'?'mint':d.kind==='cancel'||d.kind==='dispatch'?'amber':''}">${d.kind==='ride'?(d.status==='alighted'?'精算待ち':'実車中'):prettyTag(d)}</span></div>${d.kind==='dispatch'?renderDispatchForm(shift,d):d.kind==='ride'?renderRideForm(shift,d):d.kind==='empty'?renderEmptyForm(shift,d):renderCancelForm(shift,d)}<div class="actions"><button class="btn red" data-action="discardDraft">${d.kind==='dispatch'?'迎車入力を取り消す（営業記録なし）':'入力を取り消す'}</button></div></section>`;}
function renderDispatchForm(shift,d){const r=d.raw;return `<div class="panel-strip"><strong>迎車依頼受信：${shortTime(r.C)}</strong><br>迎車中は売上や手数料を計上しません。待機履歴は別に保持しています。</div><div class="field-label" style="margin-bottom:8px">配車元</div>${selector('E',DISPATCH_TYPES,r.E,true)}<div class="dispatch-received">${field('C',r,{label:'迎車受信時刻（変更可）'})}</div><div class="dispatch-arrival">${field('AL',r,{label:'お迎え場所・住所'})}${field('F',r,{label:'迎車先到着時の走行距離（km）'})}</div><label class="field" style="margin-top:12px"><span class="field-label">依頼メモ（任意）</span><input class="control" data-meta="dispatchNote" value="${safeText(d.meta?.dispatchNote||'')}" placeholder="待ち合わせ場所・目印など"></label><div class="actions"><button class="btn" data-action="gpsPickup">⌖ 現在地を取得</button></div><div class="warn">迎車中にキャンセルになった場合は「迎車キャンセル」を押してください。待機記録は消しません。</div><div class="action-grid"><button class="btn primary big" data-action="boardDispatch">🚕 お客様が乗車</button><button class="btn red big" data-action="cancelDispatch">× 迎車キャンセル</button></div>${renderAllFields(d)}`;}
function amountDiscount(r){return (r.O==='シ'||r.O==='高')&&(number(r.AR)===null||number(r.AR)===0)?calculatedDiscount(r):amount(r.AR);}

function paymentOptions(selected,canNone=false){return `${canNone?'<option value="">なし</option>':'<option value="">—</option>'}${PAYMENTS.filter(([code])=>code!=='キ').map(([code,label])=>`<option value="${safeText(code)}" ${selected===code?'selected':''}>${safeText(code)}</option>`).join('')}`;}
function renderPaymentDetails(shift,d){
 const raw=d.raw||{},meter=number(raw.K),cfg=feeSettings(shift.settings);
 if(meter===null)return '<div data-payment-detail class="caption-note">メーター金額を入力すると精算明細が表示されます。</div>';
 const toll=hasRealHighway(raw)?amount(raw.W):0;
 const discount=(raw.O==='シ'||raw.O==='高')?amountDiscount(raw):0;
 const go=goCollectionFee(d,cfg,false);
 const uber=uberAppAmounts(d,cfg);
 const surcharge=uberDispatchFeeApplies(d,shift.date,cfg)?amount(uber.surcharge):0;
 const total=estimatedCashDue(d,cfg,shift.date);
 const lines=[['メーター料金（売上）',meter],...(toll?[['実車高速料金',toll]]:[]),...(discount?[['障がい者等の割引',-discount]]:[]),...(go?[['GO車内回収手数料',go]]:[]),...(surcharge?[['Uber配車手数料（納金不要）',surcharge]]:[])];
 if(uber?.valid&&uber.appPaid)lines.push(['Uberアプリ決済額（車内回収外）',-uber.appPaid]);
 const bill=total===null?null:total-(uber?.valid?uber.appPaid:0);
 return `<div class="calc-detail" data-payment-detail><div class="calc-detail-title">精算明細</div>${lines.map(([name,value])=>`<div class="statline"><span>${safeText(name)}</span><b>${value<0?'−':''}${money(Math.abs(value))}</b></div>`).join('')}<div class="statline total"><span>車内で精算する額</span><b>${bill===null?'—':money(bill)}</b></div></div>`;
}
function renderPaymentSplit(shift,d){

 const line=(slot)=>{const code=slot===0?p.first:p.second,amount=slot===0?p.firstAmount:p.secondAmount;

}

ass="card"><h2 class="h2">手数料・控除</h2>${[['GO手数料（降車完了分）',money(t.goFee)],['Uber配車料（会社への納金不要）',money(t.uberSurcharge)],['空車高速 → 雑損',money(t.emptyToll)],['割引（既知ルールのみ）',money(t.discount)],['ETC記録額（実＋空）',money(t.realToll+t.emptyToll)]].map(([k,v])=>`<div class="statline"><span>${k}</span><b>${v}</b></div>`).join('')}<div class="warn">Uberの運営側料率は未確認のため自動計算しません。現金納金額はGO・Uberの配車料と空車高速の雑損を分けて集計します。ETC・キャンセル・全複合金種は別途検証が必要です。</div></section></div><section class="card"><h2 class="h2">支払方法別（精算内訳）</h2>${Object.entries(t.paymentTotals).map(([k,v])=>`<div class="statline"><span>${safeText(LABELS[k]||k)}</span><b>${money(v)}</b></div>`).join('')||'<p class="subtle">精算済みのデータがありません。</p>'}</section>`;}

function renderTrialPrintPages(shift,groups){const t=totals(shift.records,shift.settings,shift.date);

 return groups.map((group,index)=>{const left=Array.from({length:22},(_,i)=>group[i]||null),right=Array.from({length:14},(_,i)=>group[22+i]||null);

}

// Spreadsheet-link settings are local preferences only. No remote Google write
// is attempted until an authenticated, tested connector exists.
const SHEET_TARGET_DEFAULTS={
 mode:'off',printMode:'off',
 spreadsheetName:'TAXIAPP_日報印刷',
 spreadsheetUrl:'',
 fileBaseName:'TAXIAPP',fileNamePattern:'{name}_{date}_{type}'
};
function sheetTargetPrefs(){return {...SHEET_TARGET_DEFAULTS,...(model.prefs?.sheetTarget||{})};}
function validSheetUrl(s){
 try{const u=new URL(String(s||''));return u.protocol==='https:'&&u.hostname==='docs.google.com'&&/^\/spreadsheets\/d\/[a-zA-Z0-9_-]{15,}(\/|$)/.test(u.pathname)?u.href:'';}catch{return '';}
}
function safeFilenamePart(s){return String(s??'').replace(/[\\/:*?"<>|\x00-\x1f\x7f]/g,'_').replace(/\s+/g,' ').replace(/[. ]+$/g,'').trim().slice(0,170);}
function exportFileName(kind,shift){
 const p=sheetTargetPrefs(),day=(kind==='全データ')?dateStamp(new Date()):(shift?.date||dateStamp(new Date()));
 const base=safeFilenamePart(p.fileBaseName)||'TAXIAPP';
 const pattern=String(p.fileNamePattern||SHEET_TARGET_DEFAULTS.fileNamePattern);
 // Prevent unintended collisions if a custom pattern omits the type placeholder.
 const output=pattern.replaceAll('{name}',base).replaceAll('{date}',day).replaceAll('{type}',kind);
 const stem=safeFilenamePart(output)||`${base}_${day}_${kind}`;
 const unique=pattern.includes('{type}')?stem:safeFilenamePart(stem+'_'+kind);
 return unique+(kind==='全データ'?'.json':'.csv');
}

 <label class="field"><span class="field-label">スプレッドシートの表示名（変更可能）</span><input class="control" data-cloud-setting="spreadsheetName" maxlength="160" type="text" value="${safeText(p.spreadsheetName)}"></label>

 <div data-target-link>${url?`<a class="btn" href="${safeText(url)}" target="_blank" rel="noopener noreferrer">↗ 設定したスプレッドシートを開く</a>`:'<span class="danger-note">Googleスプレッドシートの正しいURLを入力してください。送信は行われません。</span>'}</div>

function handleSheetTargetSetting(target){const field=target.dataset.cloudSetting??target.dataset.fileSetting;
 if(!['mode','printMode','spreadsheetName','spreadsheetUrl','fileBaseName','fileNamePattern'].includes(field))return;
 const value=String(target.value||'').trim();
 if(field==='spreadsheetUrl'&&value&&!validSheetUrl(value)){toast('GoogleスプレッドシートのURLを確認してください。設定は変更していません。',true);target.value=sheetTargetPrefs().spreadsheetUrl;return;}
 if(field==='mode'&&!['off','manual','auto'].includes(value))return;
 if(field==='printMode'&&!['off','manual','auto'].includes(value))return;
 if(field==='fileNamePattern'&&(!value||value.length>180)){toast('ファイル名の書式を入力してください。',true);target.value=sheetTargetPrefs().fileNamePattern;return;}
 if(field==='fileBaseName'&&!safeFilenamePart(value)){toast('ファイル名の先頭部分を入力してください。',true);target.value=sheetTargetPrefs().fileBaseName;return;}
 model.prefs.sheetTarget={...sheetTargetPrefs(),[field]:value};saveLater();
 // Render after change, not each keystroke: preserves the caret and Android IME.
 render();
 if((field==='mode'||field==='printMode')&&value==='auto')toast('希望設定を保存しました。Googleへの自動送信はまだ未接続です。');
 else toast('設定を保存しました。');
}

async function readGpsPermission(){
 if(!window.isSecureContext||!navigator.geolocation){setGpsPermissionStatus('現在の開き方では位置情報を利用できません。ChromeでHTTPSのサイトを開いてください。');return;}
 if(!navigator.permissions?.query){setGpsPermissionStatus('このブラウザでは許可状態を直接確認できません。下のボタンで取得をお試しください。');return;}
 try{const p=await navigator.permissions.query({name:'geolocation'});setGpsPermissionStatus(p.state==='granted'?'位置情報：許可済み':p.state==='denied'?'位置情報：ブロックされています（Chromeのサイト設定から変更してください）':'位置情報：未確認。下のボタンで許可を求められます。');p.onchange=()=>{if(tab==='settings')readGpsPermission();};}catch{setGpsPermissionStatus('位置情報の許可状態を確認できません。下のボタンでお試しください。');}

function requestGpsPermission(){

 navigator.geolocation.getCurrentPosition(()=>{setGpsPermissionStatus('位置情報：取得成功（許可済み）');toast('位置情報を取得できました');},err=>{setGpsPermissionStatus(gpsMessage(err));toast(gpsMessage(err),true);},{enableHighAccuracy:true,timeout:15000,maximumAge:0});

function gpsMessage(err){if(err?.code===1)return '位置情報が拒否されています。AndroidとChromeの位置情報を許可してください。';if(err?.code===2)return 'GPSの現在地を取得できません。位置情報をONにして再取得してください。';if(err?.code===3)return 'GPSの取得が時間切れです。屋外などで再取得してください。';return '現在地を取得できません。手入力もできます。';}
// 町名・丁目の逆ジオコーディング。市区町村一覧は同じ公開サイト内に保持し、
// GPSごとの住所問い合わせは国土地理院のサービスへ1回だけ送信します。
// 出典: 国土地理院 https://maps.gsi.go.jp/ および GSI muni.js
let municipalityLookupPromise=null;
const gsiAddressCache=new Map();
function loadMunicipalities(){
 if(!municipalityLookupPromise){
  municipalityLookupPromise=fetch('./municipalities.json',{cache:'force-cache',signal:AbortSignal.timeout(8000)})
   .then(resp=>{if(!resp.ok)throw Error('市区町村表を取得できません');return resp.json();})
   .then(data=>{if(!data||typeof data!=='object'||!data['28207'])throw Error('市区町村表が不正です');return data;})
   .catch(err=>{municipalityLookupPromise=null;throw err;});
 }
 return municipalityLookupPromise;
}
async function reverseAddress(gps){
 const lat=Number(gps.lat),lon=Number(gps.lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('GPS座標が不正です');
 const key=`${lat.toFixed(5)},${lon.toFixed(5)}`;
 if(gsiAddressCache.has(key))return gsiAddressCache.get(key);
 const url=`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
 const [resp,municipalities]=await Promise.all([
  fetch(url,{signal:AbortSignal.timeout(8500)}),
  loadMunicipalities()
 ]);
 if(!resp.ok)throw Error('住所検索通信エラー');
 const response=await resp.json();
 const found=response?.results;
 if(!found?.muniCd||!found?.lv01Nm)throw Error('住所データなし');
 const area=String(found.lv01Nm).trim();
 const city=municipalities[String(Number(found.muniCd))];
 if(!city||!area)throw Error('市区町村・町域の特定不可');
 // 乗務画面は町名＋丁目番号のみ。座標は従来どおり別途保存する。
 const normalized=area.normalize('NFKC').replace(/[一二三四五六七八九十]+(?=丁目)/g,kanji=>{const nums={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};if(kanji==='十')return '10';if(kanji.includes('十')){const [left,right]=kanji.split('十');return String((left?nums[left]:1)*10+(right?nums[right]:0));}return String(nums[kanji]||kanji);}).replace(/([0-9]+)丁目.*$/,'$1');
 const address=normalized;
 gsiAddressCache.set(key,address);
 if(gsiAddressCache.size>64)gsiAddressCache.delete(gsiAddressCache.keys().next().value);
 return address;
}

 model.shifts.sort((a,b)=>String(b.startedIso||'').localeCompare(String(a.startedIso||'')));
 upgradeWaitingHistory();await save();historyDate='';historyShiftId='';tab='history';render();toast(`${addition.length}乗務を追加しました。既存データは維持しました。`);}
appEl.addEventListener('click',event=>{let tabButton=event.target.closest('[data-tab]');if(tabButton){closeKeypad(true,true);renderAfterKeypad=false;tab=tabButton.dataset.tab;render();return;}let action=event.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action.dataset.id);return;}let nowButton=event.target.closest('[data-time-now]');if(nowButton){fillCurrentTime(nowButton.dataset.timeNow);return;}let movePlace=event.target.closest('[data-wait-move]');if(movePlace){moveWaitingPlace(Number(movePlace.dataset.waitMove),movePlace.dataset.waitDirection);return;}let removePlace=event.target.closest('[data-wait-remove]');if(removePlace){removeWaitingPlace(Number(removePlace.dataset.waitRemove));return;}let ui=event.target.closest('[data-ui-key]');if(ui){setUiOption(ui.dataset.uiKey,ui.dataset.uiValue);return;}let inputOption=event.target.closest('[data-input-key]');if(inputOption){setInputOption(inputOption.dataset.inputKey,inputOption.dataset.inputValue);return;}let highway=event.target.closest('[data-highway-mode]');if(highway){toggleRideHighway(highway.dataset.highwayMode);return;}let cash=event.target.closest('[data-deposit]');if(cash){setDeposit(cash.dataset.deposit);return;}let select=event.target.closest('[data-setcol]');if(select){handleSetCol(select.dataset.setcol,select.dataset.value);return;}let waitPlace=event.target.closest('[data-wait-place]');if(waitPlace){const sh=getShift();if(sh?.waiting&&!sh.draft){sh.waiting.place=waitPlace.dataset.waitPlace;saveLater();refreshWaitView(sh.waiting.id);}return;}});
appEl.addEventListener('click',event=>{const target=event.target.closest('[data-pay-amount]');if(!target||!target.readOnly||target.disabled)return;activatePaymentAmount(Number(target.dataset.payAmount));});
appEl.addEventListener('keydown',event=>{if(event.target.id==='newWaitPlace'&&event.key==='Enter'){event.preventDefault();addWaitingPlace(event.target.value);}});appEl.addEventListener('input',handleInput);appEl.addEventListener('change',event=>{if(event.target.id==='importBackup'){importBackup(event.target.files?.[0]);return;}
 if(event.target.id==='historyDate'){historyDate=event.target.value;historyShiftId='';render();return;}
 if(event.target.id==='printShiftSelect'){printShiftId=event.target.value;render();return;}
 if(event.target.id==='historyShiftSelect'){historyShiftId=event.target.value;render();return;}
 if(event.target.matches('[data-plan-end]')){const active=getShift();if(active){active.plannedEndAt=event.target.value;saveLater();render();}return;}
if(event.target.matches('[data-cloud-setting],[data-file-setting]')){handleSheetTargetSetting(event.target);return;}
if(event.target.matches('[data-col],[data-pref],[data-setting],[data-meta],[data-shiftstart],[data-wait-field],[data-pay-method]')){handleInput(event);}});
window.addEventListener('beforeunload',()=>{if(persistTimer){clearTimeout(persistTimer);save();}});
await load();if(upgradeWaitingHistory())await save();render();

})().catch(function (err) {
  console.error('TAXIAPP startup error:',err);
  var root=document.getElementById('app');
  if(root && root.querySelector('.boot')) {
    root.innerHTML='<div style="margin:20px;padding:20px;border:1px solid #c66;border-radius:12px;background:#fff8f8"><h2>TAXIAPPの起動に失敗しました</h2><p>再読み込みしても進まない場合は、Chromeで開いてください。</p><p id="bootErr"></p></div>';
    document.getElementById('bootErr').textContent=String(err && err.message || err);
  }
});
</script>
