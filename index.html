/* v0.3.1: high-visibility waiting clock and single-tap standby notes */

.wait-display{background:#f6fbff;border:2px solid #b5d5eb;border-radius:16px;padding:11px;margin-top:7px;}

html[data-ui-theme="night"] .wait-title,html[data-ui-theme="night"] .wait-gps [role="status"]{color:#c3d7eb;}
@media(max-width:600px){.wait-inputs{grid-template-columns:1fr;gap:9px;}.wait-clock{gap:9px;margin-bottom:9px;}.wait-display{padding:10px 9px;}.wait-clock strong{font-size:clamp(24px,6vw,42px);}.hero:has(.wait-display){padding:13px 10px;}.hero:has(.wait-display) .action-grid{margin-top:10px!important;}}

.highway-fold{margin:22px 0;border-color:#99bed8}.highway-fold summary{font-size:calc(19px * var(--ui-font));font-weight:850;min-height:var(--ui-touch);display:flex;align-items:center}.settlement-section{border-top:2px solid #d2e1ee;margin-top:22px;padding-top:22px}.settlement-section .stepper{margin-bottom:9px}

/* v0.3.0: switchable payment methods, in either order, with an auto remainder */
.payment-split{margin-top:16px;border:2px solid #96b0c8;border-radius:16px;padding:15px;background:#fff;}

/* v0.3.0: Uber app visible amount; two independent payment streams. */

/* v0.3.3: time-now controls and preset waiting places */
.time-with-now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:stretch}

<script>
/* If an exception occurs during boot, don't leave the user on a perpetual spinner. */
(function () {
  function showBootError(message) {
    var root = document.getElementById('app');
    if (root && root.querySelector('.boot')) {
      root.innerHTML = '<main style="padding:30px;font-family:sans-serif;max-width:650px;margin:auto"><h2>起動できませんでした</h2><p>ブラウザの制限またはプログラムエラーが発生しました。</p><p style="overflow-wrap:anywhere">' + String(message || '').replace(/</g,'&lt;') + '</p><p>Chromeで開き直してください。既存データは削除しないでください。</p></main>';
    }
  }

function dutyRemaining(shift,now=Date.now()){

}

// List only this user's pending edit backups; never change or delete them.
function historyProtectedEdits(shift){
 const uid=accountScope.uid;
 const row=historyCloudRows.find(item=>item.id===shift?.id);
 if(!memberDiary()||!shift||historyCloudUid!==uid||!row||
    row.shift?.date!==historyCloudDate)return [];
 const candidates=(shift.records||[]).map(record=>({
  recordId:record.id,kind:record.kind,addRecord:false,
  label:'営業№'+String(record.raw?.A??'—')
 }));
 const names={ride:'乗車',cancel:'キャンセル',empty:'空車高速'};
 for(const kind of Object.keys(names)){
  try{
   const recordId=localStorage.getItem(historyPendingAdditionKey(uid,shift.id,kind));
   if(recordId)candidates.push({recordId,kind,addRecord:true,
    label:'追加中の'+names[kind]});
  }catch{
   candidates.push({recordId:'',kind,addRecord:true,
    label:'追加中の'+names[kind],blocked:true});
  }
 }
 return candidates.flatMap(candidate=>{
  if(candidate.blocked)return [{...candidate,blocked:true}];
  try{
   const raw=localStorage.getItem(historyEditStorageKey(uid,shift.id,candidate.recordId));
   if(raw===null&&!candidate.addRecord)return [];
   const saved=raw===null?null:JSON.parse(raw);
   const valid=saved&&saved.uid===uid&&saved.id===shift.id&&
    saved.recordId===candidate.recordId&&saved.date===shift.date&&
    Number.isSafeInteger(saved.baseRevision)&&
    Boolean(saved.addRecord)===candidate.addRecord;
   return [{...candidate,blocked:!valid,
    stale:Boolean(valid&&saved.baseRevision!==row.revision)}];
  }catch{return [{...candidate,blocked:true}];}
 });
}

 if(record.kind==='ride'){

  }
  for(const [from,to,label] of [['F','L','実車距離'],['S','V','実車高速距離'],['AB','AE','空車高速距離']]){
   if((changed.has(from)||changed.has(to))&&number(record.raw[from])!==null&&

function unchangedHistoryEdit(draft){

 if(Object.entries(draft.fields||{}).some(([key,val])=>val!==String(original.raw?.[key]??'')))return false;

 if(draft.splitSecond!==String(split.second||'')||draft.splitAmount!==String(split.manualAmount??''))return false;

async function commitHistoryLocationEdit(){

 try{if(!historyLocationInputs())throw Error('修正入力が見つかりません');}
 catch(error){draft.message=String(error?.message||error);render();return;}
 if(!accountDiary.ready()||!canEditNow()||accountScope.uid!==draft.uid)return;
 if(unchangedHistoryEdit(draft)){
  try{localStorage.removeItem(historyEditStorageKey(draft.uid,draft.id,draft.recordId));}
  catch{draft.message='変更なしですが、端末の修正控えを整理できません';render();return;}

   {kind:'TAXIAPP_SHIFT_V1',shift:updated};

  if(!saved?.confirmed||saved?.id!==draft.id||saved.revision!==draft.baseRevision+1){
   let checked=null;

   if(accountScope.uid!==draft.uid||accountScopeGeneration!==generation||

   if(checked?.id!==draft.id||
      !Number.isSafeInteger(checked.revision)||checked.revision<=draft.baseRevision||
      JSON.stringify(canonicalStoredDuty(checked.shift))!==
       JSON.stringify(canonicalStoredDuty(packet.shift)))

     '。修正控えを保持し、双方を上書きしません');

  }
  const i=historyCloudRows.findIndex(item=>item.id===draft.id);
  if(i>=0)historyCloudRows[i]={id:draft.id,revision:saved.revision,shift:deepCopy(packet.shift)};
  historyCloudShifts=historyCloudRows.map(item=>item.shift);

  if(historyLocationEdit===draft&&accountScope.uid===draft.uid&&accountScopeGeneration===generation){

function discardHistoryLocationEdit(){

 try{
  const key=historyEditStorageKey(draft.uid,draft.id,draft.recordId);

   const pointer=historyPendingAdditionKey(draft.uid,draft.id,draft.sourceRecord.kind);
   try{localStorage.removeItem(pointer);}
   catch(error){

 };

  ?Math.round((number(selected.endingOdo)-number(selected.startingOdo))*1000)/1000:null;
 const limitKm=Math.round((275+report.exemptKm)*1000)/1000;

  ?'<p class="caption-note">出庫・入庫のトリップがそろっていないため、総走行距離の比較は未計算です。</p>'

function safeFilenamePart(s){return String(s??'').replace(/[\\/:*?"<>|\x00-\x1f\x7f]/g,'_').replace(/\s+/g,' ').replace(/[. ]+$/g,'').trim().slice(0,170);}
function exportFileName(kind,shift){

 // Prevent unintended collisions if a custom pattern omits the type placeholder.

 const stem=safeFilenamePart(output)||`${base}_${day}_${kind}`;
 const unique=pattern.includes('{type}')?stem:safeFilenamePart(stem+'_'+kind);

// POST through a hidden form avoids browser CORS restrictions on Apps Script Web Apps.
// The receiver returns an HTML acknowledgement via postMessage; opaque fetch success
// is NEVER treated as evidence that records reached Google Sheets.
function googlePostRequest(action,fields={}){
 if(!legacyDiary())return Promise.reject(Error('この利用者には管理者用Googleシートへの接続権限がありません'));
 if(!canEditNow()&&!['syncList','syncGet'].includes(action))return Promise.reject(Error('閲覧専用端末ではGoogleへ書き込めません'));
 const endpoint=googleWebAppUrl(sheetTargetPrefs().webAppUrl),key=googleWriteKey();
 if(!endpoint||key.length<24)return Promise.reject(Error('WebアプリURLと接続キーを設定してください'));
 const nonce='tx-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 return new Promise((resolve,reject)=>{
  const iframe=document.createElement('iframe'),form=document.createElement('form');
  iframe.name='taxi_sync_'+nonce.replace(/[^A-Za-z0-9_]/g,'');
  iframe.style.display='none';iframe.setAttribute('aria-hidden','true');
  form.method='POST';form.action=endpoint;form.target=iframe.name;
  form.style.display='none';form.acceptCharset='UTF-8';
  const add=(field,value)=>{
   const item=document.createElement('input');item.type='hidden';
   item.name=field;item.value=String(value);form.appendChild(item);
  };
  add('action',action);add('key',key);add('nonce',nonce);add('origin',window.location.origin);
  for(const [field,value] of Object.entries(fields))add(field,value);
  let settled=false;
  function done(error,response){
   if(settled)return;
   settled=true;clearTimeout(timeout);window.removeEventListener('message',onMessage);
   form.remove();iframe.remove();
   if(error)reject(error);else resolve(response);
  }
  function onMessage(event){
   const origin=String(event.origin||'');
   let trusted=false;
   try{
    const url=new URL(origin),hostname=url.hostname;
    trusted=url.protocol==='https:'&&(hostname==='script.google.com'||
      hostname==='script.googleusercontent.com'||hostname.endsWith('.googleusercontent.com'));
   }catch{}
   if(!trusted)return;
   const data=event.data;
   if(!data||data.type!=='TAXIAPP_SYNC_RESULT'||data.nonce!==nonce)return;
   if(data.ok)done(null,data);
   else done(Error(String(data.message||'Google側の受信エラー')));
  }
  const timeout=setTimeout(()=>done(Error('Googleの受信確認が時間切れです。接続とWebアプリの公開設定を確認してください')),45000);
  window.addEventListener('message',onMessage);
  document.body.appendChild(iframe);document.body.appendChild(form);
  try{form.submit();}catch(error){done(error);}
 });
}

// Only the active or most recently returned duty belongs in the normal
// working set. Older duties may be released ONLY after owner-scoped server
// read-back proves the complete app-calculated packet is identical.
// Unsent, conflicting, offline or un-migrated diaries are never released.
let releasingVerifiedDuties=false;
function canonicalStoredDuty(value){
 if(Array.isArray(value))return value.map(canonicalStoredDuty);
 if(value&&typeof value==='object')
  return Object.fromEntries(Object.keys(value).sort().map(k=>[k,canonicalStoredDuty(value[k])]));
 return value;
}
function localFirestoreOriginal(shift){
 if(memberDiary()&&accountScope.adminFirestore){
  const packet=googleShiftPacket(shift);
  packet.shift.__taxiPrintSummary=deepCopy(packet.summary);
  return packet.shift;
 }
 return deepCopy(shift);
}
async function releaseVerifiedPreviousDuties(activeId){
 if(releasingVerifiedDuties||!memberDiary()||!accountDiary.ready()||
    !canEditNow()||model.activeId!==activeId)return;
 releasingVerifiedDuties=true;
 const generation=accountScopeGeneration,uid=accountScope.uid;
 const sameOwner=()=>accountScopeGeneration===generation&&
  accountScope.uid===uid&&memberDiary()&&canEditNow()&&model.activeId===activeId;
 try{
  for(const old of [...model.shifts]){
   if(!sameOwner())return;
   if(old.id===activeId||!old.endedIso&&!old.endedAt||old.draft)continue;
   // A blank/unfinished or legacy-only record must never be discarded.
   let expected;
   try{expected=localFirestoreOriginal(old);}catch{continue;}
   let server;
   try{server=await accountDiary.request('syncGet',{shiftId:old.id});}
   catch{continue;}
   const confirmedRevision=syncUI.verifiedRevision(old.id);
   if(!sameOwner()||server?.id!==old.id||
      confirmedRevision===null||server.revision!==confirmedRevision||
      JSON.stringify(canonicalStoredDuty(server.shift))!==
       JSON.stringify(canonicalStoredDuty(expected)))continue;
   const at=model.shifts.findIndex(item=>item.id===old.id);
   if(at<0||model.shifts[at].draft||model.shifts[at].id===model.activeId)continue;
   let stillSame;
   try{stillSame=JSON.stringify(canonicalStoredDuty(localFirestoreOriginal(model.shifts[at])))===
    JSON.stringify(canonicalStoredDuty(expected));}catch{continue;}
   if(!stillSame)continue;
   const released=model.shifts.splice(at,1)[0];
   // A failed local write is NOT a completed archive. Reinsert the previous
   // original in memory rather than silently dropping the last protected copy.
   if(await save(true)!==true){
    if(!sameOwner())return; // account switched during IndexedDB write
    model.shifts.splice(Math.min(at,model.shifts.length),0,released);
    await save(true);
    return;
   } // local-only; never move or delete the Firestore original
  }
 }finally{releasingVerifiedDuties=false;}
}

    throw Error('Googleの乗務データが不正です');
   ids.add(shift.id);

  if(shifts.length||memberDiary()){
   const previous=deepCopy(model);
   if(accountScope.adminFirestore&&!accountScope.adminFirestorePreview){
    // The old administrator's 2 real duties may still live in the existing
    // local IndexedDB key. Never hide them just because the new cloud is empty.
    const legacy=db?await idbGet(db,KEY):
     JSON.parse(localStorage.getItem(KEY)||'null');
    if(!currentScope())return false;
    const cloudById=new Map(shifts.map(x=>[x.id,x]));
    const manifest=typeof adminFirestoreManifest==='function'?adminFirestoreManifest(accountScope.uid):null;
    const allLegacy=Array.isArray(legacy?.shifts)?legacy.shifts:[];
    // Only user-selected, individually migrated duties block the cutover.
    // Excluded old test duties stay untouched in the original Google/local copy.
    const selected=new Set(manifest?.sourceIds||allLegacy.map(x=>x.id));
    const source=allLegacy.filter(x=>selected.has(x.id));
    const canonical=shift=>{
     // Compare the pre-existing raw duty using the SAME official app pricing
     // projection, not a second fare calculator or two different schemas.
     const projected=googleShiftPacket(shift).shift;
     return JSON.stringify({...projected,__taxiPrintSummary:undefined,
      records:projected.records.map(r=>({...r,amounts:undefined,payments:undefined}))});
    };
    const missing=source.filter(x=>!cloudById.has(x.id));
    const different=source.filter(x=>cloudById.has(x.id)&&
     canonical(x)!==canonical(cloudById.get(x.id)));
    if(missing.length||different.length)
     throw Error('旧端末の実日報がFirestoreに未移行です（未保存'+missing.length+

   // Match the viewer selection rule: do not arbitrarily select one of
   // multiple unfinished duties, which can display a stale zero-sale duty.
   const open=next.shifts.filter(x=>!x.endedAt&&!x.endedIso);

   const stored=db?await idbGet(db,storageKey):JSON.parse(localStorage.getItem(storageKey)||'null');
   if(!stored||JSON.stringify(stored.shifts)!==JSON.stringify(next.shifts))throw Error('受信した乗務を端末に保存できません');
   if(!currentScope())return false;
   model=next;
  }

// Explicit server verification for the administrator's preview duty.
// All monetary calculations reuse the app's existing packet functions.
async function verifyAdminFirestorePreviewDuty(){
 if(!accountScope.adminFirestorePreview||!canEditNow()||
    !accountDiary.ready()||adminCutoverBusy)return;
 const generation=accountScopeGeneration,uid=accountScope.uid;
 const duty=getShift()||selectedShift();
 if(!duty){adminFirestorePreviewMessage='確認する乗務がありません。先に検証用乗務を作成してください';render();return;}
 const id=duty.id,stable=()=>accountScopeGeneration===generation&&
  accountScope.uid===uid&&accountScope.adminFirestorePreview&&canEditNow();
 adminFirestorePreviewMessage='端末保存→Firestore送信→原本読戻しを確認中…';render();
 try{
  if(persistTimer){clearTimeout(persistTimer);persistTimer=0;}
  if(await save(true)!==true||!stable())throw Error('端末への保存を確認できません');
  if(!await syncUI.run(false,[id])||!stable())
   throw Error('Firestore同期の保存確認が完了していません');
  const expected=localFirestoreOriginal(model.shifts.find(x=>x.id===id));
  const server=await accountDiary.request('syncGet',{shiftId:id});
  if(!stable())return;
  const revision=syncUI.verifiedRevision(id);
  if(server?.id!==id||!Number.isSafeInteger(server?.revision)||
     revision===null||revision!==server.revision||
     JSON.stringify(canonicalStoredDuty(server.shift))!==
      JSON.stringify(canonicalStoredDuty(expected)))
   throw Error('乗務ID・更新番号・原本内容が一致しません。端末の日報は保持しています');
  adminFirestorePreviewMessage='保存確認済み：乗務ID '+id+' ／ 更新番号 '+revision+
   ' ／ 本人Firestore原本と内容一致';
 }catch(error){
  if(!stable())return;
  adminFirestorePreviewMessage='保存未確認：'+String(error?.message||error);
 }finally{if(stable())render();}
}

   adminFirestorePreviewActive=true;adminFirestorePreviewOwnerUid=uid;
   try{await switchAccountScope(source);if(deviceMode==='writer')void syncUI.bootstrapWriter();}
   catch(recovery){console.error('admin-preview-exit-recovery',recovery);}
  }
  toast('旧Google画面への復帰を確認できません：'+String(error?.message||error),true);
 }finally{adminCutoverBusy=false;render();}

async function startAdminFirestoreCutover(){
 if(adminCutoverBusy)return;
 if(!currentLoginScope?.admin||!legacyDiary()||!canEditNow()){
  toast('管理者の操作可能端末でログインしてから保存先を変更してください',true);return;
 }
 const uid=currentLoginScope.uid,sourceGeneration=accountScopeGeneration,
  sourceScope=currentLoginScope;
 const stableOwner=()=>accountScopeGeneration===sourceGeneration&&
  currentLoginScope===sourceScope&&accountScope.uid===uid&&
  legacyDiary()&&canEditNow()&&
  sourceScope.firebase?.auth?.currentUser?.uid===uid;
 if(!stableOwner()){
  toast('ログイン中の本人UIDを確認できません',true);return;
 }
 const selectedIds=[...appEl.querySelectorAll('[data-firestore-migrate-id]:checked')]
  .map(e=>e.dataset.firestoreMigrateId);
 const selected=new Set(selectedIds);
 if(selected.size!==selectedIds.length||selectedIds.some(id=>!model.shifts.some(s=>s.id===id))){
  toast('切替対象の日報選択が正しくありません',true);return;
 }
 if(model.shifts.length&&!selectedIds.length){
  toast('移行する実日報を選択してください。不要な日報は選択しないでください。',true);return;
 }
 const summary=selectedIds.map(id=>{const sh=model.shifts.find(s=>s.id===id);
  return (sh.date||'日付不明')+' '+(sh.records?.length||0)+'件';}).join('\n');
 if(!confirm('【日報保存先をFirestoreへ変更】\n本人UID：'+uid+
   '\n移行対象：'+selectedIds.length+'乗務\n'+summary+
   '\n\n旧Google原本はそのまま残し、選択した乗務だけ新規の本人用Firestoreへ保存します。続けますか？'))return;
 adminCutoverBusy=true;
 const sourceModel=deepCopy(model),manifestKey=ADMIN_FIRESTORE_PREF_PREFIX+uid;
 let applied=false;
 try{
  const backup=JSON.stringify({...sourceModel,ownerUid:uid}),recoveryKey='taxiapp-admin-firestore-recovery-v1-'+uid;
  localStorage.setItem(recoveryKey,backup);
  if(localStorage.getItem(recoveryKey)!==backup)throw Error('切替前の端末バックアップを保存できません');
  download(backup,'TAXIAPP_保存先切替前_'+dateStamp()+'_全日報.json','application/json;charset=utf-8');
  if(!confirm('切替前の全日報バックアップをダウンロードして保管しましたか？\n保存を確認した場合のみ続けます。'))
   return;
  const staging=window.TAXIAPP_ACCOUNT_DIARY.create();
  staging.bind({uid},{...currentLoginScope.firebase,admin:true,storageBackend:'firestore'});
  if(!staging.ready())throw Error('本人用Firestoreの認証が完了していません');
  const listing=await staging.request('syncList',{});
  if(!stableOwner())throw Error('切替中にログインまたは操作権が変わりました');
  if(!Array.isArray(listing?.shifts))throw Error('Firestoreの保存済み原本を確認できません');
  const remote=new Map(listing.shifts.map(item=>[item.id,item]));
  for(const id of selectedIds){
   if(!stableOwner())throw Error('切替中に操作権またはログインが変わりました');
   const original=sourceModel.shifts.find(s=>s.id===id);
   const packet=googleShiftPacket(original);
   packet.shift.__taxiPrintSummary=deepCopy(packet.summary);
   if(remote.has(id)){
    const row=remote.get(id);
    if(row.deleted)throw Error('移行先でゴミ箱にある日報は上書きしません：'+id);
    const existing=await staging.request('syncGet',{shiftId:id});
    if(!stableOwner())throw Error('既存原本の照合中にログインが変わりました');
    if(JSON.stringify(existing.shift)!==JSON.stringify(packet.shift))
     throw Error('Firestoreに異なる内容の同じ乗務IDがあります。移行を停止：'+id);
    continue;
   }
   const sent=await staging.request('syncPut',{baseRevision:0,payload:JSON.stringify(packet)});
   if(!stableOwner())throw Error('保存中にログインが変わりました。Firestore原本を保持して切替は中止しました');
   if(sent?.id!==id||sent?.revision!==1)throw Error('Firestoreへの保存結果が不明：'+id);
   const verified=await staging.request('syncGet',{shiftId:id});
   if(!stableOwner())throw Error('保存後の確認中にログインが変わりました');
   if(verified.id!==id||JSON.stringify(verified.shift)!==JSON.stringify(packet.shift))
    throw Error('Firestore原本の保存後検証に失敗しました：'+id);
  }
  if(!stableOwner())throw Error('保存先の確定前にログインまたは操作権が変わりました');
  const manifest=JSON.stringify({mode:'firestore',uid,sourceIds:selectedIds,at:Date.now()});
  localStorage.setItem(manifestKey,manifest);
  applied=true;
  if(localStorage.getItem(manifestKey)!==manifest)throw Error('保存先選択を端末に記録できません');
  await switchAccountScope(sourceScope);
  const ready=await syncUI.bootstrapWriter();
  if(!ready)throw Error('Firestoreへ切替後、乗務を安全に表示できませんでした');
  toast('Firestoreに保存・読み戻し済み。本人UID専用の保存先へ切り替えました。');
 }catch(error){
  if(applied){
   try{
    localStorage.removeItem(manifestKey);
    // Never switch a newly logged-in account to the old owner's backend.
    if(currentLoginScope===sourceScope&&accountScope.uid===uid){
     await switchAccountScope(sourceScope);
     if(deviceMode==='writer')void syncUI.bootstrapWriter();
    }
   }catch(recovery){console.error('cutover-recovery',recovery);}
  }
  toast('保存先の切替を中止しました。旧Google原本はそのままです：'+String(error?.message||error),true);
 }finally{adminCutoverBusy=false;render();}
}
async function returnAdminToLegacy(){
 if(adminCutoverBusy||!accountScope.adminFirestore||!currentLoginScope?.admin||!canEditNow())return;
 const uid=accountScope.uid,sourceGeneration=accountScopeGeneration,sourceScope=currentLoginScope;
 if(!confirm('旧Googleの保存先に戻しますか？\nFirestoreに保存した日報は消えませんが、新しく入力した乗務はGoogleには自動で移行しません。先にJSONバックアップを保存してください。'))return;
 const backup=JSON.stringify({...model,ownerUid:uid});
 download(backup,'TAXIAPP_Firestore切替前_'+dateStamp()+'.json','application/json;charset=utf-8');
 if(!confirm('Firestore内の日報のバックアップを保管しましたか？'))return;
 if(accountScopeGeneration!==sourceGeneration||currentLoginScope!==sourceScope||
    accountScope.uid!==uid||!accountScope.adminFirestore||!canEditNow()||
    sourceScope.firebase?.auth?.currentUser?.uid!==uid){
  toast('ログインまたは操作権が変わったため旧保存先への切替を中止しました',true);return;
 }
 adminCutoverBusy=true;
 const key=ADMIN_FIRESTORE_PREF_PREFIX+uid,previous=localStorage.getItem(key);
 try{
  localStorage.removeItem(key);
  await switchAccountScope(sourceScope);
  if(currentLoginScope!==sourceScope||accountScope.uid!==uid)
   throw Error('旧保存先への切替中にログインが変わりました');
  if(deviceMode==='writer'&&!(await syncUI.bootstrapWriter()))
   throw Error('旧Googleから日報を安全に受信できませんでした');
  toast('旧Google保存先に戻りました。Firestore原本は保持しています。');
 }catch(error){
  try{
   if(previous!==null)localStorage.setItem(key,previous);
   if(currentLoginScope===sourceScope&&accountScope.uid===uid){
    await switchAccountScope(sourceScope);
    if(deviceMode==='writer')void syncUI.bootstrapWriter();
   }
  }catch(recovery){console.error('legacy-cutover-recovery',recovery);}
  toast('旧Googleへの切替を停止しました：'+String(error?.message||error),true);
 }finally{adminCutoverBusy=false;render();}
}

function handleSheetTargetSetting(target){const field=target.dataset.cloudSetting??target.dataset.fileSetting;
 if(!['mode','syncMode','printMode','spreadsheetName','spreadsheetUrl','webAppUrl','fileBaseName','fileNamePattern'].includes(field))return;
 const value=String(target.value||'').trim();
 if(field==='spreadsheetUrl'&&value&&!validSheetUrl(value)){toast('GoogleスプレッドシートのURLを確認してください。設定は変更していません。',true);target.value=sheetTargetPrefs().spreadsheetUrl;return;}
 if(field==='webAppUrl'&&value&&!googleWebAppUrl(value)){toast('Googleの /exec WebアプリURLを入力してください',true);target.value=sheetTargetPrefs().webAppUrl;return;}
 if(field==='mode'&&!['off','manual','auto'].includes(value))return;
 if(field==='syncMode'&&!['off','on'].includes(value))return;
 if(field==='syncMode'&&value==='on'){
  if(!googleIsConfigured()){
   toast('双方向同期の開始前にGoogle接続URLとキーを設定してください',true);
   target.value=sheetTargetPrefs().syncMode||'off';return;
  }
  const localCount=model.shifts.length;
  const syncConfirmMessage=localCount===0
   ? '【日報の共有を開始】\n\nこの端末の日報：0件\nGoogleに保存済みの日報をこの端末に取り込みます。\n\nGoogleの日報は削除されません。\n\n「OK」で共有開始／「キャンセル」で中止'
   : '【日報の共有を開始】\n\nこの端末の日報：'+localCount+'件\nこの端末だけの日報はGoogleへ保存し、Googleだけの日報はこの端末に取り込みます。\n同じ日報で内容が違う場合は、自動で上書きせず確認待ちにします。\n\n「OK」で共有開始／「キャンセル」で中止';
  if(!confirm(syncConfirmMessage)){
   target.value=sheetTargetPrefs().syncMode||'off';return;
  }
 }
 if(field==='printMode'&&!['off','manual','auto'].includes(value))return;
 if(field==='fileNamePattern'&&(!value||value.length>180)){toast('ファイル名の書式を入力してください。',true);target.value=sheetTargetPrefs().fileNamePattern;return;}
 if(field==='fileBaseName'&&!safeFilenamePart(value)){toast('ファイル名の先頭部分を入力してください。',true);target.value=sheetTargetPrefs().fileBaseName;return;}
 model.prefs.sheetTarget={...sheetTargetPrefs(),[field]:value};saveLater();if(field==='syncMode'&&value==='on')syncUI.schedule();
 // The browser already updated the changed control. Do not rebuild Settings
 // after saving: keep opened categories, keyboard focus and scroll position.
 const filePreview=appEl.querySelector('[data-file-preview] strong');
 if(filePreview&&(field==='fileBaseName'||field==='fileNamePattern'))
  filePreview.textContent=exportFileName('入力_RAW_実車',selectedShift());
 if(field==='mode'&&value==='auto'&&!googleIsConfigured())toast('自動送信にはWebアプリURLと接続キーが必要です',true);
 else toast('設定を保存しました。');
}

 </select></label></div>`:''}</div>`:`<div class="distance-auto-group"><p class="helper">距離の自動・手動を選ぶには、①の「乗車・降車」または「高速道路」の距離管理をONにしてください。</p></div>`}</section>${nativeDiaryGpsEnabled()?'<p class="helper">Android GPS距離ラボを使用中です。従来のブラウザGPSトリップ・中断回数・補正はこの方式には適用しません。</p>':(active?gpsTripUI?.panel(active)||'':'<p class="helper">GPSの距離テストは出庫後に操作できます。</p>')}</div></details><details class="details" data-address-settings><summary>住所取得の設定</summary><div class="inner"><section class="card gps-control"><h2 class="h2">位置情報の許可・確認</h2><div class="gps-status" data-gps-permission-status role="status">${gpsPermissionText||(!window.isSecureContext?'この開き方では位置情報を要求できません。HTTPSのURLで開いてください。':'位置情報の許可状態を確認しています…')}</div><button class="btn primary" data-action="checkGpsPermission" type="button">⌖ 位置情報を確認・許可する</button><p class="gps-help">Android設定 → アプリ → Chrome → 権限 → 位置情報 と、Chromeのサイト設定 → 位置情報を確認してください。すでに「ブロック」の場合は端末側で許可し直す必要があります。<strong>content:// のダウンロード画面では許可できない場合があり、GPSの安定利用にはHTTPS公開が必要</strong>です。</p></section><section class="card"><h2 class="h2">GPS・住所</h2><p class="helper">位置情報は許可したときだけ取得します。Androidでは位置情報設定をONにし、Chromeのサイト設定でも許可してください。端末のHTML直開きでは制限される場合があり、確実な利用にはHTTPS公開が必要です。</p><label class="field"><span class="field-label">取得した座標を住所に変換（オンライン時）</span><select class="control" data-pref="reverseAddress"><option value="on" ${model.prefs.reverseAddress!=='off'?'selected':''}>有効（国土地理院へGPS座標を送り、町名・丁目まで推定）</option><option value="off" ${model.prefs.reverseAddress==='off'?'selected':''}>無効（座標のみ保存）</option></select></label></section></div></details></div></details><details class="details settings-advanced"><summary>バックアップ</summary><div class="inner">${renderDeviceManagementPanel()}<section class="card"><h2 class="h2">バックアップ</h2><div class="statline"><span>現在の端末保存先</span><b>${safeText(storageStatus)}</b></div><p class="caption-note">本番の従来データ保存先を継続します。入力はログインと操作権の確認後に利用できます。</p><p class="helper">JSONは全乗務記録・位置座標・Uber手数料用の入力内容も保持します。通常CSVは44列、手数料CSVは別表です。</p><div class="actions"><button class= function download(textData,file,type){const blob=new Blob([textData],{type}),link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=file;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
let gpsPermissionText='';
function setGpsPermissionStatus(message){gpsPermissionText=String(message);const el=appEl.querySelector('[data-gps-permission-status]');if(el)el.textContent=gpsPermissionText;}
async function readGpsPermission(){
 if(!window.isSecureContext||!navigator.geolocation){setGpsPermissionStatus('現在の開き方では位置情報を利用できません。ChromeでHTTPSのサイトを開いてください。');return;}
 if(!navigator.permissions?.query){setGpsPermissionStatus('このブラウザでは許可状態を直接確認できません。下のボタンで取得をお試しください。');return;}
 try{const p=await navigator.permissions.query({name:'geolocation'});setGpsPermissionStatus(p.state==='granted'?'位置情報：許可済み':p.state==='denied'?'位置情報：ブロックされています（Chromeのサイト設定から変更してください）':'位置情報：未確認。下のボタンで許可を求められます。');p.onchange=()=>{if(tab==='settings')readGpsPermission();};}catch{setGpsPermissionStatus('位置情報の許可状態を確認できません。下のボタンでお試しください。');}
}
function requestGpsPermission(){
 if(!window.isSecureContext||!navigator.geolocation){readGpsPermission();toast('この開き方ではGPSを許可できません。HTTPSで開いてください。',true);return;}
 setGpsPermissionStatus('現在地の取得を試しています。Chromeに許可画面が出たら選択してください。');
 navigator.geolocation.getCurrentPosition(()=>{setGpsPermissionStatus('位置情報：取得成功（許可済み）');toast('位置情報を取得できました');},err=>{setGpsPermissionStatus(gpsMessage(err));toast(gpsMessage(err),true);},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function gpsMessage(err){if(err?.code===1)return '位置情報が拒否されています。AndroidとChromeの位置情報を許可してください。';if(err?.code===2)return 'GPSの現在地を取得できません。位置情報をONにして再取得してください。';if(err?.code===3)return 'GPSの取得が時間切れです。屋外などで再取得してください。';return '現在地を取得できません。手入力もできます。';}
// 町名・丁目の逆ジオコーディング。市区町村一覧は同じ公開サイト内に保持し、
// GPSごとの住所問い合わせは国土地理院のサービスへ1回だけ送信します。
// 出典: 国土地理院 https://maps.gsi.go.jp/ および GSI muni.js
let municipalityLookupPromise=null;
const gsiAddressCache=new Map();
function loadMunicipalities(){
 if(!municipalityLookupPromise){
  municipalityLookupPromise=fetch('./municipalities.json',{cache:'force-cache',signal:AbortSignal.timeout(8000)})
   .then(resp=>{if(!resp.ok)throw Error('市区町村表を取得できません');return resp.json();})
   .then(data=>{if(!data||typeof data!=='object'||!data['28207'])throw Error('市区町村表が不正です');return data;})
   .catch(err=>{municipalityLookupPromise=null;throw err;});
 }
 return municipalityLookupPromise;
}
async function reverseAddress(gps){
 const lat=Number(gps.lat),lon=Number(gps.lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('GPS座標が不正です');
 const key=`${lat.toFixed(5)},${lon.toFixed(5)}`;
 if(gsiAddressCache.has(key))return gsiAddressCache.get(key);
 const url=`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
 const [resp,municipalities]=await Promise.all([
  fetch(url,{signal:AbortSignal.timeout(8500)}),
  loadMunicipalities()
 ]);
 if(!resp.ok)throw Error('住所検索通信エラー');
 const response=await resp.json();
 const found=response?.results;
 if(!found?.muniCd||!found?.lv01Nm)throw Error('住所データなし');
 const area=String(found.lv01Nm).trim();
 const city=municipalities[String(Number(found.muniCd))];
 if(!city||!area)throw Error('市区町村・町域の特定不可');
 // 乗務画面は町名＋丁目番号のみ。座標は従来どおり別途保存する。
 const normalized=area.normalize('NFKC').replace(/[一二三四五六七八九十]+(?=丁目)/g,kanji=>{const nums={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};if(kanji==='十')return '10';if(kanji.includes('十')){const [left,right]=kanji.split('十');return String((left?nums[left]:1)*10+(right?nums[right]:0));}return String(nums[kanji]||kanji);}).replace(/([0-9]+)丁目.*$/,'$1');
 const address=normalized;
 gsiAddressCache.set(key,address);
 if(gsiAddressCache.size>64)gsiAddressCache.delete(gsiAddressCache.keys().next().value);
 return address;
}
function waitRecord(shiftId,waitId){
 const active=model.shifts.find(s=>s.id===shiftId);
 if(!active)return null;
 if(active.waiting?.id===waitId)return active.waiting;
 return active.waitSegments?.find(w=>w.id===waitId)||null;
}
function refreshWaitView(waitId){
 const shift=getShift(),wait=shift?.waiting;
 if(!wait||wait.id!==waitId||shift.draft||tab!=='drive')return;
 const input=appEl.querySelector('[data-wait-field="place"]');
 if(input&&document.activeElement!==input&&input.value!==(wait.place||''))input.value=wait.place||'';
 const choices=appEl.querySelector('#waitPlaceCandidates');
 if(choices){const near=wait.geo?waitCandidates(wait.geo):[],names=new Set(near.map(x=>x.name));choices.innerHTML=near.map(x=>`<option value="${safeText(x.name)}" label="近く・約${Math.round(x.meters)}m"></option>`).join('')+waitingPlaces().filter(name=>!names.has(name)).map(name=>`<option value="${safeText(name)}" label="その他の待機所"></option>`).join('');}
 const status=appEl.querySelector('[data-wait-gps-status]');if(status)status.textContent=wait.gpsStatus||'位置未取得';
 const address=appEl.querySelector('[data-wait-register-address]');if(address&&document.activeElement!==address&&address.value!==(wait.address||waitAddress(wait.place)||''))address.value=wait.address||waitAddress(wait.place)||'';
}
async function getWaitGps(shift,waiting){
 const shiftId=shift.id,waitId=waiting.id;
 if(!navigator.geolocation||!window.isSecureContext){
  const w=waitRecord(shiftId,waitId);if(!w)return;
  w.gpsStatus='GPS不可：HTTPSで開く必要があります。場所は手入力できます。';saveLater();refreshWaitView(waitId);return;
 }
 const w=waitRecord(shiftId,waitId);if(!w)return;
 w.gpsStatus='現在地を取得中…';refreshWaitView(waitId);
 navigator.geolocation.getCurrentPosition(async position=>{
  const target=waitRecord(shiftId,waitId);if(!target)return;
  const geo={lat:position.coords.latitude,lng:position.coords.longitude,accuracy:position.coords.accuracy,recordedAt:new Date().toISOString()};

 if(!confirm(`バックアップから${addition.length}乗務を追加します。既存${model.shifts.length}乗務は変更しません。\n同じIDの${skipped}乗務は上書きせずスキップします。続けますか？`))return;

     addition.some(shift=>!saved.shifts.some(x=>x.id===shift.id))||
     !sameOwner())
   throw Error('復元後の日報が端末に正しく保存されていないか、ログインが変更されました');
 }catch(error){
  if(!sameOwner()){
   toast('復元途中でログインが変わりました。別の利用者の記録は変更していません。',true);
   return;
  }
  model=previous;

  return;
 }

  for(const shift of addition){
   try{syncUI.undoLocalRemoval(shift.id);}
   catch(error){pending.push(shift.id);}

 historyDate='';historyShiftId='';tab='history';render();
 if(pending.length){
  toast(addition.length+'乗務を端末に復元しました。'+pending.length+
   '乗務は削除済み同期情報を解除できませんでした。クラウド照合前に確認してください。',true);
 }else{
  if(syncUI.enabled())syncUI.schedule();
  toast(addition.length+'乗務を復元しました。クラウド原本がゴミ箱の場合は個別に復元してください。');

}
