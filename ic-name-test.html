<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAXIAPP IC名取得テスト</title>
<style>body{font-family:system-ui,"Noto Sans JP",sans-serif;background:#f2f6fb;color:#18314b;margin:0;padding:16px}main{max-width:720px;margin:auto}section{background:white;border:1px solid #ccd8e5;border-radius:12px;padding:18px;margin:14px 0}h1{font-size:23px}label{display:block;margin:12px 0;font-weight:bold}input,select,button{font-size:17px;padding:12px;border-radius:9px;border:1px solid #9aacc0;max-width:100%;box-sizing:border-box}input{width:100%}button{cursor:pointer;background:#1462a3;color:white;border:0;margin:4px 0;min-height:48px}button.secondary{background:#edf3f9;color:#163951;border:1px solid #b4c5d6}button:disabled{opacity:.5}#status{white-space:pre-wrap;background:#f4f7fb;padding:14px;border-radius:8px}li{padding:10px 0;border-bottom:1px solid #e0e6ef}small{color:#52657a}</style></head>
<body><main><h1>高速道路 IC名取得テスト</h1><p>登録済みのIC位置データとGPS座標を端末内で照合します。外部検索サービスには問い合わせません。TAXIAPP営業データへの保存・変更はしません。</p>
<section><button id="loc">現在地を取得</button><button class="secondary" id="sample">伊丹空港周辺で試す</button>
<label>緯度<input id="lat" type="number" step="any" placeholder="緯度"></label><label>経度<input id="lon" type="number" step="any" placeholder="経度"></label>
<label>検索半径<select id="radius"><option value="3000">3 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option></select></label>
<p id="data-status">サーバー内のIC位置データを読み込み中です。</p><button id="reload" class="secondary">位置データを再取得</button><button id="search">周辺のIC名を検索</button><p id="status" role="status">まだ検索していません。</p></section>
<section><h2>検索結果</h2><ol id="results"></ol><small>IC名は道路データに登録された名称・番号です。入口・出口の利用可否、進入方向、高速料金の正確性を保証するものではありません。検索元：サーバーに配置されたIC位置データ。IC代表点と実際の入口・出口は異なる場合があります。</small></section></main>
<script>
"use strict";
const el=id=>document.getElementById(id);
const status=t=>{el("status").textContent=t;};
el("sample").onclick=()=>{el("lat").value="34.7855";el("lon").value="135.4382";status("参考座標をセットしました。検索を押してください。");};
el("loc").onclick=()=>{if(!navigator.geolocation){status("ブラウザで位置情報を利用できません。");return;}status("現在地を取得しています…");navigator.geolocation.getCurrentPosition(p=>{el("lat").value=p.coords.latitude.toFixed(7);el("lon").value=p.coords.longitude.toFixed(7);status("現在地を取得しました（精度 ±"+Math.round(p.coords.accuracy)+"m）。検索を押してください。");},e=>{status(e.code===1?"位置情報の許可がありません。ブラウザと端末の許可を確認してください。":e.code===3?"GPS取得が時間切れです。屋外で再試行してください。":"GPS測位できません。座標を手入力して検索できます。");},{enableHighAccuracy:true,timeout:15000,maximumAge:0});};
function distance(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 6371*2*Math.asin(Math.sqrt(h));}
let icData=[];
async function loadICData(){
 el("data-status").textContent="サーバーの位置データを取得中…";
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);
 try{
  const response=await fetch("./data/ic-positions.json",{cache:"no-store",signal:ctrl.signal});
  if(!response.ok)throw Error("HTTP "+response.status);
  const obj=await response.json(),items=Array.isArray(obj)?obj:obj.items;
  if(!Array.isArray(items))throw Error("位置データの形式が不正です");
  const valid=items.filter(x=>x&&typeof x.name==="string"&&x.name.trim()&&Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude))&&Math.abs(Number(x.latitude))<=90&&Math.abs(Number(x.longitude))<=180);
  if(valid.length!==items.length)throw Error("位置データに不正な座標があります");
  icData=valid;
  el("data-status").textContent=icData.length?"サーバーから"+icData.length+"件のIC位置データを取得しました。":"サーバーへの接続成功。ただし公式IC位置データはまだ未登録です。";
 }catch(e){icData=[];el("data-status").textContent="サーバーの位置データを取得できません："+(e.name==="AbortError"?"通信時間切れ":e.message);}
 finally{clearTimeout(timer);}
}
el("reload").onclick=loadICData;
loadICData();
el("search").onclick=()=>{
 const lat=Number(el("lat").value),lon=Number(el("lon").value),radius=Number(el("radius").value);
 if(!el("lat").value||!el("lon").value||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){status("有効な緯度・経度を入力してください。");return;}
 if(!icData.length){status("サーバーにIC位置データが登録されていません。");return;}
 const items=icData.map(x=>({...x,km:distance(lat,lon,Number(x.latitude),Number(x.longitude))})).filter(x=>x.km<=radius/1000).sort((a,b)=>a.km-b.km);
 el("results").replaceChildren();
 for(const x of items){const li=document.createElement("li");li.textContent=(x.road?x.road+" ／ ":"")+x.name+"　約"+x.km.toFixed(2)+"km（直線距離）"+(x.type?"　"+x.type:"")+(x.direction?"　"+x.direction:"");el("results").appendChild(li);}
 status(items.length?items.length+"件のIC位置データが半径"+radius/1000+"km内に見つかりました。":"半径"+radius/1000+"km内に該当なし。登録データの収録範囲を確認してください。");
};
</script></body></html>
