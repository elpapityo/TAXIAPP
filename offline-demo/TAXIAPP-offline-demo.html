:root{--ui-font:1.30;--ui-touch:62px;--ui-primary-touch:78px;--ui-button-touch:62px;--ui-button-primary:78px}

/* v0.1.5: unobtrusive interface; warnings, GPS status and actual financial values stay visible. */

.cash-deposit{font-size:calc(24px * var(--ui-font));text-align:right;font-weight:800;}
.deposit-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;}
.deposit-buttons .btn{font-size:calc(13px * var(--ui-font));padding:6px 4px;min-width:0;white-space:nowrap;}

html[data-ui-theme="night"] .cash-change{background:#123c34;color:#d6ffeb;border-color:#4a9c84;}

/* v0.3.1: high-visibility waiting clock and single-tap standby notes */
.compact-metrics{grid-template-columns:repeat(2,minmax(0,1fr));}
.gps-trip-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:13px 0}
.gps-trip-stats>div{padding:10px;border:1px solid var(--line);border-radius:10px}
.gps-trip-stats span{display:block;color:var(--muted);font-size:12px}
.gps-trip-stats strong{display:block;margin-top:4px;font-size:22px;font-variant-numeric:tabular-nums}
.gps-trip-status{padding:10px;border:1px solid #b8cee1;background:#eef6ff;border-radius:8px;font-weight:700}
.gps-trip-correction{display:flex;align-items:end;flex-wrap:wrap;gap:10px;margin-top:12px}
.gps-trip-correction .field{flex:1;min-width:170px;max-width:350px}
html[data-ui-theme="night"] .gps-trip-status{color:#edf5ff;background:#243a54}
.metric.meter-check{grid-column:1/-1;background:var(--sheet,#f5f8fc);border-style:dashed;min-width:0}

html[data-ui-theme="night"] .metric.meter-check{background:#263c55;color:#edf5ff}
html[data-ui-theme="night"] .metric.meter-check strong{color:#edf5ff}
.wait-display{background:#f6fbff;border:2px solid #b5d5eb;border-radius:16px;padding:11px;margin-top:7px;}
.wait-clock{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.wait-clock>div{display:flex;flex-direction:column;gap:2px;min-width:0;}
.wait-title{font-size:calc(13px * var(--ui-font));font-weight:750;color:#506782;}
.wait-clock strong{font-size:clamp(25px,calc(30px * var(--ui-font)),56px);line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;}
.wait-inputs{display:grid;grid-template-columns:1.3fr 1fr;gap:9px;align-items:start;}
.wait-inputs .control{font-size:calc(17px * var(--ui-font));font-weight:650;}
.wait-odometer-row{display:flex;align-items:stretch;gap:6px;min-width:0;}
.wait-odometer-row .control{flex:1 1 0;width:0;min-width:0;}
.wait-odometer-row .km-step{flex:0 0 43px;margin:0!important;min-width:43px;min-height:46px;}
.wait-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}.wait-quick .chip{max-width:100%;min-width:0;overflow-wrap:anywhere;text-align:left;}
.wait-gps{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}

.wait-gps .wait-register-fields{flex:0 0 100%;width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(105px,140px);gap:8px;align-items:end;}
.wait-gps .wait-register-fields .field{min-width:0;overflow-wrap:normal;word-break:normal;}
.wait-gps .wait-register-fields .control{min-width:0;box-sizing:border-box;}
@media(max-width:420px){.wait-gps .wait-register-fields{grid-template-columns:minmax(0,1fr);}.wait-gps .wait-register-fields .field{width:100%;}}
.wait-gps [role="status"]{font-size:calc(12px * var(--ui-font));color:#47637d;}
html[data-ui-theme="night"] .wait-display{background:#233b54;border-color:#5f95c3;}
html[data-ui-theme="night"] .wait-title,html[data-ui-theme="night"] .wait-gps [role="status"]{color:#c3d7eb;}
@media(max-width:600px){.wait-inputs{grid-template-columns:1fr;gap:9px;}.wait-clock{gap:9px;margin-bottom:9px;}.wait-display{padding:10px 9px;}.wait-clock strong{font-size:clamp(24px,6vw,42px);}.hero:has(.wait-display){padding:13px 10px;}.hero:has(.wait-display) .action-grid{margin-top:10px!important;}}

.highway-fold{margin:22px 0;border-color:#99bed8}.highway-fold summary{font-size:calc(19px * var(--ui-font));font-weight:850;min-height:var(--ui-touch);display:flex;align-items:center}.settlement-section{border-top:2px solid #d2e1ee;margin-top:22px;padding-top:22px}.settlement-section .stepper{margin-bottom:9px}

/* v0.3.0: Pickup data is always visible and editable at top of the ride screen. */

.inline-location-field>.field .control{min-width:0;width:100%}
.btn.inline-field-icon{width:48px;min-width:48px;min-height:48px;height:var(--ui-touch);padding:0;display:grid;place-items:center;font-size:24px;font-weight:800;line-height:1;border-radius:10px}

/* v0.3.0: switchable payment methods, in either order, with an auto remainder */
.payment-split{margin-top:16px;border:2px solid #96b0c8;border-radius:16px;padding:15px;background:#fff;}
.payment-split h3{margin:0 0 10px;font-size:calc(17px * var(--ui-font));}
.pay-row{display:grid;grid-template-columns:minmax(90px,0.7fr) minmax(100px,1.2fr);gap:10px;align-items:end;margin:10px 0;}
.pay-code{font-size:calc(22px * var(--ui-font));font-weight:850;text-align:center;text-align-last:center;}
.pay-sum{font-size:calc(23px * var(--ui-font));font-weight:820;text-align:right;}
.pay-sum[readonly]{background:#e6edf4!important;color:#425872!important;border-style:dashed!important;cursor:pointer;}
.pay-sum[readonly]:focus{outline:3px solid #2976b8;outline-offset:2px;}
.pay-total{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #d5e3ee;margin-top:8px;font-weight:800;font-size:calc(17px * var(--ui-font));}

/* v0.3.0: Uber app visible amount; two independent payment streams. */
.uber-settlement{margin-top:15px;padding:17px;border:1px solid #aac8e2;border-radius:14px;background:linear-gradient(110deg,#edf7ff,#fff);}
.uber-settlement>.field{max-width:440px}.uber-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px;}
.uber-summary>div{min-width:0;padding:11px;border:1px solid #cfdfeb;background:#fff;border-radius:11px;font-weight:750;font-size:13px;}

@media(max-width:700px){.uber-summary{grid-template-columns:repeat(2,minmax(0,1fr));}.uber-summary>div:last-child{grid-column:1/-1;}}

/* v0.3.0: the grey amount is still tappable; driver may start with either tender. */

html[data-ui-theme="night"] .empty-toll-progress{background:#20364e}

.highway-section-row{padding:13px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}

.highway-choices{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 15px}

/* v0.3.3: time-now controls and preset waiting places */
.time-with-now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:stretch}
.time-with-now .control{min-width:0}

<script>'use strict';
const RAW_COLUMNS = [

 ['M','降車時間','乗降'],['N','金種','精算'],['O','割引','精算'],['P','高速利用','高速共通'],

 ['AL','乗住所','乗降'],['AM','降住所','乗降'],['AN','料金','精算'],['AO','預金','精算'],

const PAYMENTS=[['現','現金'],['G','GOペイ'],['D','DiDiアプリ'],['U','Uber'],['Q','QR決済'],['ク','クレジット'],['交','交通系IC'],['チ','チケット'],['乗','乗込GOペイ'],['キ','キャンセル']];

// The vehicle meter may include the dispatch charge shown for a cancelled call.
// Keep this number strictly separate from taxable sales and all settlement totals.
const CANCEL_METER_CHECK_AMOUNT=700;
function cancelMeterConfig(){
 const p=model?.prefs||{},v=number(p.cancelMeterAmount);
 return {mode:p.cancelMeterMode==='reset'?'reset':'retain',amount:v!==null&&v>=0&&v<=100000?Math.round(v):CANCEL_METER_CHECK_AMOUNT};

function meterCheckValues(t,shift){
 const items=(shift?.records||[]).filter(row=>row.kind==='cancel'&&row.status==='complete');

  const saved=number(row.meta?.cancelMeterAdjustment);
  return sum+(saved!==null&&saved>=0?saved:CANCEL_METER_CHECK_AMOUNT);
 },0);

function stamp(now=new Date()){const pad=n=>String(n).padStart(2,'0');return `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;}
function dateStamp(now=new Date()){const p=n=>String(n).padStart(2,'0');return `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}`;}
function number(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?n:null;}
const amount = v=>number(v)??0;
const money = v=>'¥'+Math.round(amount(v)).toLocaleString('ja-JP');
const feeSettings=(s={})=>({goFee:number(s.goFee)??DEFAULT_GO_FEE,cancelFee:number(s.cancelFee)??DEFAULT_CANCEL_FEE,uberRate:number(s.uberRate)??DEFAULT_UBER_RATE,uberSurcharge:number(s.uberSurcharge)??DEFAULT_UBER_SURCHARGE,uberCrewShare:number(s.uberCrewShare)??DEFAULT_UBER_CREW_SHARE});
function localDateTime(t){const x=t instanceof Date?t:new Date(t);return `${dateStamp(x)}T${stamp(x).slice(0,5)}`;}
function revisedShiftTime(shift,newTime){if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(newTime))throw Error('正しい時刻を指定してください');const old=shift.startedAt;shift.startedAt=newTime+':00';shift.startedIso=new Date(`${shift.date}T${shift.startedAt}`).toISOString();if(shift.draft?.raw?.C===old)shift.draft.raw.C=shift.startedAt;if(!shift.waitSegments?.length&&shift.waiting?.startedAt===old){shift.waiting.startedAt=shift.startedAt;shift.waiting.startedIso=shift.startedIso;}return shift.startedAt;}
function blankRaw(){return Object.fromEntries(RAW_COLUMNS.map(([key])=>[key,'']));}
function newShift(now=new Date(),meta={}){return {id:`shift-${now.getTime()}`,date:dateStamp(now),startedAt:stamp(now),startedIso:now.toISOString(),endedAt:'',company:meta.company||'',driver:meta.driver||'',driverNo:meta.driverNo||'',vehicle:meta.vehicle||'',startingOdo:meta.startingOdo??'',distanceMode:'trip',settings:feeSettings(),records:[],draft:null,waiting:null,waitTrackingVersion:2,waitSegments:[],breakActive:null,breakSessions:[],createdAt:new Date().toISOString()};}

}

 if(shift.waiting||shift.draft)throw new Error('待機開始できません');

}
function breakSeconds(item,now=new Date()){const a=Date.parse(item?.startedIso||''),b=item?.endedIso?Date.parse(item.endedIso):now.getTime();return Number.isFinite(a)&&Number.isFinite(b)?Math.max(0,Math.floor((b-a)/1000)):0;}
function breakElapsedText(item,now=new Date()){const n=breakSeconds(item,now);return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':');}
function breakDurationMinutes(item,now=new Date()){return Math.floor(breakSeconds(item,now)/60);}

function breakClockText(mins){return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');}
function endBreak(shift,when=new Date()){if(!shift?.breakActive)return;const item={...shift.breakActive,endedAt:stamp(when),endedIso:when.toISOString()};(shift.breakSessions??=[]).push(item);shift.breakActive=null;}

 if(!waiting?.startedIso)return '00:00';
 const elapsed=Math.max(0,Math.floor((now.getTime()-Date.parse(waiting.startedIso))/1000));

function makeDispatch(shift,now=new Date(),type='G'){
 if(shift.records.length>=MAX_RECORDS)throw new Error('1乗務60件を超えて登録できません');

function cancelDispatch(shift,now=new Date()){

function makeDraft(shift,kind='ride',now=new Date(),type='乗'){
 if(shift.records.length>=MAX_RECORDS)throw new Error('1乗務60件を超えて登録できません');
 const raw=blankRaw();raw.A=shift.records.length+1;

 if(kind==='ride'){raw.G=stamp(now);raw.P='';}

/* 乗務員回収とアプリ運営会社回収を区別する。

function driverCollects(type){return Boolean(type)&&!['G','D','U','乗','キ'].includes(type);}
function goCollectionFee(row,settings={},completedOnly=false){
 if(!row||row.kind!=='ride'||row.raw?.E!=='G'||(completedOnly&&row.status!=='complete'))return 0;
 const first=row.raw.N,second=row.meta?.splitPayment?.second;
 return driverCollects(first)||driverCollects(second)?feeSettings(settings).goFee:0;
}
function hasRealHighway(raw){return String(raw?.P||'').includes('実');}
function hasEmptyHighway(raw){return String(raw?.P||'').includes('空');}
function calculatedDiscount(raw){
 const meter=number(raw?.K);
 return (raw?.O==='シ'||raw?.O==='高')&&meter!==null?Math.ceil(Math.max(0,meter)/100)*10:0;
}
function updateDiscountForDraft(d,changed=''){
 if(!d?.raw||d.kind!=='ride')return;
 const raw=d.raw;
 if(changed==='AR'){
  d.meta??={};d.meta.discountManual=number(raw.AR)!==null&&number(raw.AR)>0;
  return;
 }
 if(changed==='O'){
  d.meta??={};d.meta.discountManual=false;
 }
 if(raw.O!=='シ'&&raw.O!=='高'){
  if(changed==='O')raw.AR='';
  return;

}
function deriveRaw(row,settings={}){
 const raw={...row.raw}; const cfg=feeSettings(settings);
 const parts=['AF','AG','AH'].map(k=>number(raw[k]));
 if(hasEmptyHighway(raw))raw.AI=parts.reduce((s,x)=>s+(x??0),0);
 const distance=(a,b)=>number(raw[a])!==null&&number(raw[b])!==null?Math.max(0,Math.round((Number(raw[b])-Number(raw[a]))*10)/10):null;
 // 区間距離は運転手が入力しない。乗距離・降距離から自動算出し、
 // 既存44列CSVのX/AJに互換出力する。旧版の手入力値より実距離を優先する。

/* Estimate the cash payment amount using the same basis as the v0.1.4 reference amount.

function uberHasInCabPayment(row){

/* Uber input is the *customer-facing* amount displayed by Uber.
   Example A: meter 2000 -> displayed 1800: app pays 200, in-cab 1800.
   Example B: meter 2000 -> displayed 2100: in-cab pays 2100,

   Do not infer a discount from either case. Never double-count the 100 fee. */
// Fill the initial Uber displayed amount only while the driver has not overridden it.
// The actual Uber amount always remains editable, including an intentionally blank value.
function applyUberDisplayedDefault(d,settings={}){
 if(d?.kind!=='ride'||d.raw?.E!=='U'||!d.meta)return false;
 if(d.meta.uberAppDisplayedManual===true)return false;
 const meter=number(d.raw.K);
 if(meter===null)return false;
 // Historic entries with an actual recorded value are never replaced.
 if(d.meta.uberAppDisplayedDefaulted!==true&&String(d.meta.uberAppDisplayed??'').trim()!=='')return false;
 const fee=feeSettings(settings).uberSurcharge;
 const discount=(d.raw.O==='シ'||d.raw.O==='高')?amountDiscount(d.raw):0;
 const proposed=d.raw.N==='U'?'0':String(Math.max(0,Math.round(meter-discount+fee)));
 if(d.meta.uberAppDisplayed===proposed)return false;
 d.meta.uberAppDisplayed=proposed;

}
function uberAppAmounts(row,settings={}){
 if(row?.kind!=='ride'||row?.raw?.E!=='U')return null;
 const displayed=number(row?.meta?.uberAppDisplayed),meter=number(row?.raw?.K);
 if(displayed===null||meter===null)return null;
 const cfg=feeSettings(settings);
 const discount=(row.raw.O==='シ'||row.raw.O==='高')?amountDiscount(row.raw):0;
 const discountedMeter=Math.max(0,Math.round(meter-discount));
 const positiveDifference=Math.round(displayed-discountedMeter);
 const surcharge=positiveDifference>0?positiveDifference:0;
 const appPaid=Math.max(0,Math.round(discountedMeter-displayed));
 return {displayed,appPaid,surcharge,meter,valid:displayed>=0&&(surcharge===0||surcharge===cfg.uberSurcharge)};

function uberDispatchFeeApplies(row,serviceDate='',settings={}){

function estimatedCashDue(row,settings={},shiftDate=''){
 if(!row||row.kind!=='ride')return null;
 const raw=row.raw||{};
 const authoritative=number(raw.AN);
 if(authoritative!==null)return Math.max(0,Math.round(authoritative));
 const meter=number(raw.K);if(meter===null)return null;
 const cfg=feeSettings(settings),isUber=raw.E==='U';
 const discount=(raw.O==='シ'||raw.O==='高')&&!row.meta?.discountManual&&(number(raw.AR)===null||number(raw.AR)===0)?calculatedDiscount(raw):amount(raw.AR);
 const uberReservation=isUber?amount(row.meta?.uberReservation):0;
 // When the Uber app displays meter + 100 yen, the additional fee is collected
 // from the passenger but is excluded from company cash remittance.
 const app=uberAppAmounts(row,settings);
 const uberSurcharge=app?.valid&&uberDispatchFeeApplies(row,shiftDate,settings)?app.surcharge:0;
 const goFee=goCollectionFee(row,cfg,false);
 return Math.max(0,Math.round(meter+amount(Array.isArray(row.meta?.highwaySections)?window.TAXIAPP_HIGHWAY_SECTIONS.project(raw,row.meta.highwaySections).W:raw.W)+uberReservation+uberSurcharge+goFee-discount));

function cashChange(row,settings={},shiftDate=''){
 const split=paymentBreakdown(row,settings,shiftDate);
 // Cash deposits must be reconciled against CASH due, not card/ticket/app-paid amounts.
 const due=split.due===null?null:Math.max(0,Math.round(split.items.filter(x=>x.type==='現').reduce((sum,x)=>sum+x.amount,0)));
 const deposit=number(row?.raw?.AO);
 return {due,deposit,change:due===null||deposit===null?null:Math.max(0,Math.round(deposit-due)),
         shortage:due===null||deposit===null?null:Math.max(0,Math.round(due-deposit))};

function syncCashChange(row,settings={},shiftDate=''){

}
function pricing(row,settings={},shiftDate=''){
 const cfg=feeSettings(settings),raw=deriveRaw(row,cfg),done=row.status==='complete';
 const meter=row.kind==='ride'&&done?amount(raw.K):0;
 const realToll=row.kind==='ride'&&done?amount(raw.W):0;
 const emptyToll=done&&hasEmptyHighway(raw)&&(row.kind==='ride'||row.kind==='empty')?amount(raw.AI):0;
 // A cancelled dispatch is an operational record, never a fare or paid cancellation.
 const cancellation=0;
 const goFee=done?amount(raw.AQ):0;
 const discount=row.kind==='ride'&&done?amount(raw.AR):0;
 const uberRide=done&&raw.E==='U'&&row.kind==='ride';
 const reservation=uberRide?amount(row.meta?.uberReservation):0;
 const tip=uberRide?amount(row.meta?.uberTip):0;
 // Uber basic commission covers trip sales, cancellation and reservation; never toll or tip.
 const uberFee=0; // 事業者契約の料率は乗務員向けの日報では推測・計上しない。
 // Additional dispatch fee began 2026-09-28; Uber app-paid transactions are excluded.
 const serviceDate=shiftDate||row.meta?.serviceDate||dateStamp(new Date());
 const uberSurcharge=(done&&row.kind==='ride'&&uberDispatchFeeApplies(row,serviceDate,settings))?cfg.uberSurcharge:0;

 return {meter,realToll,emptyToll,cancellation,goFee,uberFee,uberSurcharge,uberCrewShare,reservation,tip,discount,customerBill:meter+realToll+cancellation+reservation+goFee+uberSurcharge-discount,printedDetail:meter+realToll+cancellation,uberCommissionBase:meter+cancellation+reservation};

/* 売上（メーター）と受取額（手数料を含む）を別々に保持する。
   GO回収手数料は会社への納金対象。Uber配車手数料だけ納金対象外。 */
function settledTenderAmounts(row,settings={},shiftDate=''){
 const split=paymentBreakdown(row,settings,shiftDate);
 const raw=split.items.filter(x=>x.type&&x.amount!==null).map(x=>({type:x.type,received:Math.max(0,Math.round(x.amount)),company:Math.max(0,Math.round(x.amount))}));
 const fees=pricing(row,settings,shiftDate);
 // GOの車内回収手数料は会社への納金対象。受取額から控除しない。
 // Uberの配車手数料だけを納金対象から除く（現金優先）。
 let uberLeft=fees.uberSurcharge;
 const driver=raw.filter(x=>driverCollects(x.type)).sort((a,b)=>(a.type==='現'?0:1)-(b.type==='現'?0:1));
 for(const item of driver){const fee=Math.min(item.company,uberLeft);item.company-=fee;uberLeft-=fee;}
 return {items:raw,fees,unallocatedFees:uberLeft,split};
}
function totals(records=[],settings={},shiftDate=''){
 const t={records:records.length,rides:0,cancels:0,emptyHighways:0,cashReceived:0,cashDeposit:0,uberCashNoDeposit:0,meter:0,realToll:0,emptyToll:0,cancellation:0,goFee:0,uberFee:0,uberSurcharge:0,uberCrewShare:0,reservation:0,tip:0,discount:0,customerBill:0,printedDetail:0,paymentTotals:{},unallocatedFees:0};
 for(const row of records){
  if(row.status!=='complete')continue;
  const p=pricing(row,settings,shiftDate);
  if(row.kind==='ride')t.rides++;
  if(row.kind==='cancel')t.cancels++;
  if((row.kind==='ride'||row.kind==='empty')&&hasEmptyHighway(row.raw))t.emptyHighways++;
  for(const key of ['meter','realToll','emptyToll','cancellation','goFee','uberFee','uberSurcharge','uberCrewShare','reservation','tip','discount','customerBill','printedDetail'])t[key]+=p[key];
  if(row.kind==='ride'){
   const settlement=settledTenderAmounts(row,settings,shiftDate);
   t.unallocatedFees+=settlement.unallocatedFees;
   for(const item of settlement.items){t.paymentTotals[item.type]=(t.paymentTotals[item.type]||0)+item.company;
    if(item.type==='現'){t.cashReceived+=item.received;t.cashDeposit+=item.company;t.uberCashNoDeposit+=Math.min(p.uberSurcharge,item.received-item.company);}}
  }

 }
 t.paymentAllocated=Object.entries(t.paymentTotals).reduce((sum,[code,value])=>sum+(code==='キ'?0:value),0);
 // GO手数料は決済の会社納金対象額に含まれる。メーター売上とは別に照合する。
 t.reconciliationDifference=Math.round(t.meter+t.realToll+t.goFee-t.discount-t.paymentAllocated);
 // GO手数料は納金対象（現金・QRなど実際の支払金種に含む）。
 // Uber配車手数料だけ納金対象から控除する。
 t.cashRemittance=t.meter+t.goFee-t.discount-Object.entries(t.paymentTotals).reduce((sum,[code,value])=>sum+(code!=='現'&&code!=='キ'?value:0),0)-t.emptyToll;
 // 実車・空車のETCは別の納金欄。GOは現金納金額に含むため二重加算しない。
 t.etcRemittance=t.realToll+t.emptyToll;
 t.totalRemittance=t.cashRemittance+t.etcRemittance;
 return t;
}

/* The old A:AR schema can store only one main payment code. Split amounts are stored in meta
   and exported separately; never silently attribute the full price to the first method. */
function splitPaymentMeta(row){return row.meta?.splitPayment||{second:'',manualSlot:null,manualAmount:''};}
function paymentBreakdown(row,settings={},shiftDate=''){
 const charge=estimatedCashDue(row,settings,shiftDate);
 const uber=uberAppAmounts(row,settings);
 const first=row.raw?.N||'',cfg=splitPaymentMeta(row),second=cfg.second&&cfg.second!==first?cfg.second:'';
 const slot=cfg.manualSlot===0||cfg.manualSlot===1?cfg.manualSlot:null;
 const amt=number(cfg.manualAmount);
 const hasManual=Boolean(second)&&slot!==null&&amt!==null&&String(cfg.manualAmount)!=='';
 const due=charge===null?null:Math.round(charge);
 let firstAmount=due,secondAmount=0;
 if(second&&due!==null&&hasManual){firstAmount=slot===0?amt:due-amt;secondAmount=slot===1?amt:due-amt;}
 if(!second&&slot===0&&amt!==null&&due!==null)firstAmount=amt;
 if(due===null){firstAmount=null;secondAmount=null;}
 let incomplete=(Boolean(second)&&!hasManual)||(!second&&slot===0&&amt!==null&&due!==null&&amt!==due);
 let invalidUber=Boolean(uber&&!uber.valid);
 let autoUber=false;
 // If the driver enters the amount shown on the Uber app, the difference from
 // the meter is app-paid, NOT a fare discount. Remaining fare is settled in-car.
 // Additional customer dispatch fee (if applicable) is separately accounted for.
 if(uber&&uber.valid&&due!==null){
  autoUber=true;
  const cabinDue=Math.round(due-uber.appPaid);
  if(first==='U'){
   firstAmount=uber.appPaid;
   secondAmount=second?cabinDue:0;
   incomplete=cabinDue>0&&!second;
  }else if(second==='U'){
   firstAmount=cabinDue;secondAmount=uber.appPaid;incomplete=false;
  }else if(second){
   if(hasManual){firstAmount=slot===0?amt:cabinDue-amt;secondAmount=slot===1?amt:cabinDue-amt;}
   else{firstAmount=cabinDue;secondAmount=0;}
   incomplete=!hasManual;
  }else{firstAmount=cabinDue;secondAmount=0;incomplete=!first&&cabinDue>0;}
 }
 const invalid=hasManual&&due!==null&&!(autoUber&&(first==='U'||second==='U'))&&(amt<0||amt>(autoUber?due-uber.appPaid:due)) || (!second&&slot===0&&amt!==null&&due!==null&&(amt<0||amt>due));
 let items=due===null?[]:[{type:first,amount:firstAmount},...(second?[{type:second,amount:secondAmount}]:[])];
 if(autoUber&&first!=='U'&&second!=='U')items.push({type:'U',amount:uber.appPaid});
 return {due,first,second,firstAmount,secondAmount,slot,hasManual,invalid,invalidUber,incomplete,items,uber,autoUber};
}
function validatePaymentBreakdown(row,settings={},shiftDate=''){
 if(row.kind!=='ride')return [];
 const p=paymentBreakdown(row,settings,shiftDate),errors=[];
 if(p.invalidUber)errors.push('Uberアプリ表示額がメーターを超える場合、差額は配車手数料100円か確認してください');
 if(p.invalid)errors.push('支払金額が請求額を超えています');
 if(p.incomplete)errors.push(p.autoUber?'車内決済の金種・割り振りを確認してください':p.second?'どちらか一方の金額を入力してください':'残額がある場合は追加金種を選択してください');
 if(p.second&&p.first===p.second)errors.push('同じ金種を重複して選べません');

}
function splitPaymentRows(shift){const rows=[];
 for(const record of shift.records){if(record.kind!=='ride'||record.status!=='complete')continue;
  const p=settledTenderAmounts(record,shift.settings,shift.date),split=p.split;
  for(const item of p.items){
   rows.push([record.raw.A,record.raw.E,item.type,item.received,item.company,split.due,record.raw.K||0,record.raw.W||0,item.type===record.raw.N?'最初の金種':item.type==='U'&&uberAppAmounts(record,shift.settings)?'Uberアプリ自動計算':'追加金種',record.meta?.uberAppDisplayed??'',item.received-item.company,item.type==='現'?item.company:'']);
  }

}

 if(view==='settings'){app.innerHTML=`<section class="card"><h1 class="h1">設定</h1><p class="helper">表示設定はすべてのデモ画面に反映されます。再読み込みで初期値に戻ります。</p><details class="details" open><summary>表示設定</summary><div class="inner form-grid">${displayChoice('text','文字サイズ',[['normal','標準'],['large','大きい'],['extra','特大']])}${displayChoice('buttons','ボタンサイズ',[['compact','コンパクト'],['normal','標準'],['large','大きい'],['extra','特大']])}${displayChoice('theme','昼夜表示',[['day','昼'],['night','夜']])}${displayChoice('contrast','コントラスト',[['normal','標準'],['high','高コントラスト']])}</div></details><details class="details" open><summary>営業入力の画面サイズ</summary><div class="inner">${displayChoice('width','画面幅',[['full','標準'],['phone','スマホ'],['tablet','タブレット'],['pc','PC']])}<p class="helper">端末の回転ではなく、デモ画面の幅を切り替えます。</p></div></details><div class="actions">${button('reset-display','表示設定を初期値に戻す')}</div>${['営業画面の表示項目','乗務員・車両登録','計算用金額・手数料設定','勤務形態・1乗務の予定','待機場所の設定','距離・住所取得','ログイン中のアカウント情報'].map(label=>`<details class="details"><summary>${label}</summary><div class="inner"><p>${label==='距離・住所取得'?'距離・住所は手入力です。GPS・住所変換は起動しません。':label==='計算用金額・手数料設定'?`GO車内回収手数料 ${money(feeSettings(s?.settings).goFee)} ／ Uber配車手数料 ${money(feeSettings(s?.settings).uberSurcharge)}。このデモでは既存の初期値を使用します。`:label==='乗務員・車両登録'?'出庫画面で、このデモ乗務の乗務員名と車両番号を入力できます。':'この設定の詳細操作はデモでは未対応です。'}</p></div></details>`).join('')}</section>`;return;}
 if(view==='live'){const target=s||model.shifts.find(x=>x.id===selectedId)||model.shifts[0];app.innerHTML=`<section class="card"><h1 class="h1">営業・集計</h1><p class="helper">${s?'乗務中の集計':'直近の日報・合成サンプルの集計'}</p>${target?report(target):'<p>記録はありません。</p>'}</section>`;return;}
 if(view==='print'){app.innerHTML=`<section class="card"><h1 class="h1">印刷準備</h1><p>日報閲覧から営業記録と精算内訳を確認できます。</p><div class="actions"><button class="btn primary" data-view="history">日報を確認する</button></div><p class="warn">Google補助簿への転送・2ページ印刷はデモでは利用できません。外部接続は行いません。</p></section>`;return;}
 if(view==='manage'){app.innerHTML=`<section class="card"><h1 class="h1">管理</h1><p>合成サンプルと、このページで作成した乗務のみを扱います。</p>${['クラウド同期','端末間引継ぎ','バックアップ・復元','日報削除・ゴミ箱'].map(label=>`<details class="details"><summary>${label}</summary><div class="inner">デモでは利用できません。本番データの読込・送信・削除は行いません。</div></details>`).join('')}</section>`;return;}
 if(view==='about'){app.innerHTML=`<section class="card"><h1 class="h1">独立デモの範囲</h1><p>最新mainの画面スタイルと既存の計算・記録作成関数を組み込んだ、操作確認用の簡易画面です。</p><p>出庫 → 迎車／乗車 → 降車・精算 → 入庫 → 日報閲覧を試せます。GO・DiDi・Uber・その他、割引、複合決済、実車高速料金に対応します。</p><p>データはメモリ内のみ。初期日報は架空の地名・金額で作成しています。</p><h2 class="h2">未対応</h2><p>本番UIの完全再現、GPS・地図・住所変換、自動距離、複数高速区間・空車高速入力、日報編集・削除・復元、バックアップ入出力、Google補助簿2ページ印刷、クラウド・認証・端末間引継ぎ、管理者機能。</p><p>料金や手数料の新しい計算エンジンは作成していません。pricing / settledTenderAmounts / totals / paymentBreakdown 等はmainから流用しています。</p><p class="small">元コード: elpapityo/TAXIAPP · main 8ae6c4cf534544e728d45f2e0a0d26c237be4cf9 · 確認日 2026-10-24</p></section>`;return;}
 if(view==='history'){const chosen=model.shifts.find(x=>x.id===selectedId)||model.shifts.find(x=>x.endedAt);app.innerHTML=`<section class="card"><h1 class="h1">日報閲覧</h1><p class="helper">合成日報と、この画面で登録した乗務のみ表示します。</p>${model.shifts.map(x=>`<button class="btn" data-report="${esc(x.id)}">${esc(x.date)} · ${x.endedAt?'入庫済み':'乗務中'} · ${x.records.length}件</button>`).join(' ')}${chosen?report(chosen):'<p>日報はありません。</p>'}</section>`;return;}
 if(!s){app.innerHTML=`<section class="card hero"><h1 class="h1">出庫前</h1><p class="helper">架空の乗務員・車両で試せます。日報閲覧にはサンプルを用意しています。</p><form id="departure"><div class="form-grid">${field('driver','乗務員名','デモ乗務員')}${field('vehicle','車両番号','DEMO-001')}${field('odo','出庫距離（km）','0','number','min="0" step="0.1" required')}${field('date','営業日',dateStamp(),'date','required')}</div><div class="actions"><button class="btn primary big" type="submit">出庫する</button></div></form></section>`;return;}
 if(view==='shift'){app.innerHTML=`<section class="card"><h1 class="h1">出庫・入庫</h1><p>${esc(s.date)}　${esc(s.driver)}　${esc(s.vehicle)}</p><p>出庫 ${esc(s.startedAt)} ／ 出庫距離 ${esc(s.startingOdo)} km</p>${metrics(s)}${s.draft?'<p class="warn">営業を精算または迎車をキャンセルしてから入庫してください。</p>':`<form id="return"><div class="form-grid">${field('odo','入庫距離（km）',s.startingOdo,'number',`min="${esc(s.startingOdo)}" step="0.1" required`)}</div><div class="actions"><button class="btn dark big" type="submit">入庫して日報を確定</button></div></form>`}</section>`;return;}
 const d=s.draft;
 app.innerHTML=`<section class="card"><div class="section-heading"><div><p class="eyebrow">${esc(s.date)} · ${esc(s.vehicle)}</p><h1 class="h1">乗務入力</h1></div><span class="pill mint">${d?.kind==='dispatch'?'迎車中':d?'実車中':s.breakActive?'休憩中':s.waiting?'待機中':'空車'}</span></div>${metrics(s)}${d?draftForm(s,d):`<div class="actions">${button('ride','乗車する','primary big')}${button('dispatch','迎車する','teal big')}${button('wait',s.waiting?'待機終了':'待機する')}${button('break',s.breakActive?'休憩終了':'休憩する')}</div><p class="helper">場所・距離は手入力です。GPSは起動しません。</p>`}</section><section class="card"><h2 class="h2">今回の営業記録</h2>${recordTable(s)}</section>`;
 if(d&&d.kind==='ride')refreshPreview();
}
function draftForm(s,d){if(d.kind==='dispatch')return `<form id="dispatch-form">${select('E','配車区分',DISPATCH_TYPES,d.raw.E)}<div class="actions"><button type="submit" class="btn primary big">乗車する</button>${button('cancel-dispatch','迎車キャンセル','red')}</div></form>`;
 return `<form id="settle"><div class="form-grid three">${select('E','配車区分',[['乗','その他・無線'],['G','GO'],['D','DiDi'],['U','Uber']],d.raw.E)}${field('AL','乗車地',d.raw.AL,'text','required')}${field('AM','降車地',d.raw.AM)}${field('G','乗車時刻',d.raw.G,'time','step="1" required')}${field('M','降車時刻',d.raw.M||stamp(),'time','step="1" required')}${field('F','乗車距離（km）',d.raw.F,'number','min="0" step="0.1" required')}${field('L','降車距離（km）',d.raw.L,'number','min="0" step="0.1" required')}${field('K','メーター金額（円）',d.raw.K,'number','min="0" step="1" required')}${select('N','金種',PAYMENTS.filter(x=>x[0]!=='キ'),d.raw.N||'現')}</div><details class="details"><summary>乗車人数・割引・高速・複合決済</summary><div class="inner form-grid three">${field('I','男性人数',d.raw.I,'number','min="0" step="1"')}${field('J','女性人数',d.raw.J,'number','min="0" step="1"')}${select('O','割引',[['','なし'],['シ','障害者'],['高','高齢者']],d.raw.O)}${field('W','実車高速料金（円）',d.raw.W,'number','min="0" step="1"')}${field('AO','現金預り（円）',d.raw.AO,'number','min="0" step="1"')}${select('second','追加金種',[['','なし'],...PAYMENTS.filter(x=>x[0]!=='キ')],d.meta.splitPayment?.second||'')}${field('manualAmount','追加金種の金額（円）',d.meta.splitPayment?.manualAmount||'','number','min="0" step="1"')}</div></details><div class="panel-strip"><label class="field"><span class="field-label">Uberアプリ表示額（Uber時のみ使用）</span><input class="control" name="uberAppDisplayed" type="number" min="0" step="1" value="${esc(d.meta.uberAppDisplayed)}"></label><p class="small">空欄の初期値は既存処理で設定します。直接入力すると手入力値を保持します。</p></div><div id="preview" aria-live="polite"></div><div class="actions"><button type="submit" class="btn primary big">降車・支払確定</button>${button('discard','入力を取り消す')}</div></form>`;
}
function readDraft(){const s=active(),d=s?.draft,f=document.getElementById('settle');if(!d||!f)return;const data=new FormData(f);for(const key of ['E','AL','AM','G','M','F','L','K','N','I','J','O','W','AO'])d.raw[key]=data.get(key);d.raw.P=amount(d.raw.W)>0?'実':'';d.meta.splitPayment={second:data.get('second'),manualSlot:1,manualAmount:data.get('manualAmount')};if(data.get('second')===d.raw.N)d.meta.splitPayment.second='';d.meta.uberAppDisplayed=data.get('uberAppDisplayed');updateDiscountForDraft(d,'O');applyUberDisplayedDefault(d,s.settings);const input=f.elements.uberAppDisplayed;if(input.value!==d.meta.uberAppDisplayed)input.value=d.meta.uberAppDisplayed;syncCashChange(d,s.settings,s.date);}
function refreshPreview(){readDraft();const s=active(),d=s.draft,p=paymentBreakdown(d,s.settings,s.date),cash=cashChange(d,s.settings,s.date);document.getElementById('preview').innerHTML=`<div class="panel-strip">精算請求額 <strong>${p.due===null?'未入力':money(p.due)}</strong>　おつり <strong>${cash.change===null?'未入力':money(cash.change)}</strong><br>${p.items.map(x=>`${esc(LABELS[x.type]||x.type)} ${money(x.amount)}`).join(' ／ ')}<br><small>完了前のGO手数料集計: ${money(pricing(d,s.settings,s.date).goFee)}（支払確定後に計上）</small></div>`;}
function recordTable(s){return s.records.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>No.</th><th>区分</th><th>乗車 → 降車</th><th>金種</th><th>メーター</th><th>請求額</th></tr></thead><tbody>${s.records.map(r=>`<tr><td>${r.raw.A}</td><td>${r.kind==='cancel'?'キャンセル':esc(r.raw.E)}</td><td>${esc(r.raw.AL)} → ${esc(r.raw.AM)}</td><td>${esc(LABELS[r.raw.N])}</td><td>${money(pricing(r,s.settings,s.date).meter)}</td><td>${money(pricing(r,s.settings,s.date).customerBill)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="helper">営業記録はまだありません。</p>';}
function report(s){const t=totals(s.records,s.settings,s.date);return `<div class="demo-detail"><h2 class="h2">${esc(s.date)} 日報 ${s.synthetic?'（合成サンプル）':''}</h2><p>${esc(s.driver)} ／ ${esc(s.vehicle)}<br>出庫 ${esc(s.startedAt)} → 入庫 ${esc(s.endedAt||'未入庫')}<br>距離 ${esc(s.startingOdo)} → ${esc(s.endingOdo??'未入力')} km</p>${metrics(s)}${recordTable(s)}<details class="details"><summary>精算・決済内訳</summary><div class="inner">${[['割引',t.discount],['実車高速',t.realToll],['ETC納金',t.etcRemittance],['現金受取',t.cashReceived],['照合差額',t.reconciliationDifference],...Object.entries(t.paymentTotals).map(([k,v])=>[LABELS[k]+'（会社精算）',v])].map(([k,v])=>`<div class="statline"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')}</div></details><p class="footnote">本番Google補助簿の印刷様式とは異なる簡易日報です。</p></div>`;}
function fail(e){notice.innerHTML=`<p class="demo-error">${esc(e.message||e)}</p>`;}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;try{if(el.dataset.view){readDraft();view=el.dataset.view;render();return;}if(el.dataset.report){selectedId=el.dataset.report;render();return;}const s=active();switch(el.dataset.action){case 'ride':if(s.breakActive)endBreak(s);pauseWaiting(s);s.draft=makeDraft(s);break;case 'dispatch':if(s.breakActive)endBreak(s);s.draft=makeDispatch(s);break;case 'cancel-dispatch':s.draft=cancelDispatch(s);s.draft.status='complete';s.records.push(s.draft);s.draft=null;break;case 'wait':if(s.breakActive)endBreak(s);if(s.waiting)pauseWaiting(s,new Date(),'cruising');else beginWaiting(s);break;case 'break':pauseWaiting(s,new Date(),'break');if(s.breakActive)endBreak(s);else s.breakActive={startedIso:new Date().toISOString(),startedAt:stamp()};break;case 'discard':s.draft=null;break;default:return;}render();}catch(e){fail(e);}});
document.addEventListener('input',e=>{if(e.target.closest('#settle')){if(e.target.name==='uberAppDisplayed')active().draft.meta.uberAppDisplayedManual=true;refreshPreview();}});
document.addEventListener('change',e=>{if(e.target.closest('#settle'))refreshPreview();});
document.addEventListener('submit',e=>{e.preventDefault();try{const f=e.target,data=new FormData(f),s=active();if(f.id==='departure'){const n=newShift(new Date(),{driver:data.get('driver'),vehicle:data.get('vehicle'),startingOdo:data.get('odo')});n.date=data.get('date');n.startedIso=new Date(`${n.date}T${n.startedAt}`).toISOString();model.shifts.push(n);model.activeId=n.id;view='drive';}
 if(f.id==='dispatch-form'){s.draft.raw.E=data.get('E');boardDispatch(s);}
 if(f.id==='settle'){readDraft();const d=s.draft;const errors=[...validateDraft(d),...validatePaymentBreakdown(d,s.settings,s.date)];if(number(d.raw.L)<number(d.raw.F))errors.push('降車距離は乗車距離以上');if(errors.length)throw Error(errors.join(' ／ '));d.status='complete';d.raw=deriveRaw(d,s.settings);s.records.push(d);s.draft=null;}
 if(f.id==='return'){if(s.draft)throw Error('営業を精算してください');if(Number(data.get('odo'))<Math.max(Number(s.startingOdo),...s.records.map(r=>amount(r.raw.L))))throw Error('入庫距離は出庫・最終降車距離以上にしてください');endBreak(s);pauseWaiting(s,new Date(),'return');s.endingOdo=data.get('odo');s.endedAt=stamp();s.endedIso=new Date().toISOString();selectedId=s.id;model.activeId=null;view='history';}render();}catch(error){fail(error);}});
function seed(){const s=newShift(new Date('2026-10-23T08:00:00+09:00'),{driver:'サンプル乗務員',vehicle:'DEMO-000',startingOdo:0});s.synthetic=true;s.date='2026-10-23';s.startedAt='08:00:00';s.endedAt='17:00:00';s.endingOdo=80;for(const [i,type,pay,meter,from,to] of [[1,'乗','現',1500,'デモ駅','デモ公園'],[2,'G','現',2200,'サンプル広場','架空ホテル'],[3,'U','現',2000,'デモ空港','サンプル商店街']]){const r=makeDraft(s,'ride',new Date(`2026-10-23T${String(8+i).padStart(2,'0')}:00:00+09:00`),type);Object.assign(r.raw,{AL:from,AM:to,F:i*10,L:i*10+5,G:`${8+i}:00:00`,M:`${8+i}:20:00`,K:meter,N:pay});if(type==='U')r.meta.uberAppDisplayed='2100';r.status='complete';r.raw=deriveRaw(r,s.settings);s.records.push(r);}model.shifts.push(s);selectedId=s.id;}
seed();render();


</script></body></html>
