<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAXIAPP GPS日報連携 動作確認</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}body{max-width:640px;margin:auto;padding:14px;background:#0a2336;color:#f4f9ff}section{border:1px solid #62819b;border-radius:13px;padding:13px;margin:13px 0;background:#12344d}button,input{font:inherit;border-radius:8px;min-height:46px;margin:5px 2px}button{background:#1679b9;border:0;color:#fff;padding:9px 12px}button.secondary{background:#38576c}input{background:#102d41;border:1px solid #8ba5b8;color:white;padding:7px;width:95%;box-sizing:border-box}label{display:block;margin-top:12px}p{line-height:1.6}.small{font-size:13px;color:#b6d6e8}.bad{color:#ffd194}.good{color:#a4f0ba}article{border-top:1px solid #57758b;padding:8px 0}
</style></head><body><h1>🚕 GPS日報連携 テスト</h1><p class="small">テスト専用ページです。実際の日報・売上・同期データは読み書きしません。停車中に操作してください。</p><section><h2>GPS連携</h2><p id="pair">確認中</p><button id="ping">GPS通信を確認</button><button class="secondary" id="keyPage">連携キーの登録ページ</button><p id="status">待機中</p><p id="gps">GPS未取得</p></section>
<section><h2>仮の日報入力</h2><p class="small">番号・距離を入力して「仮保存」すると、このページ内の履歴だけに追加されます。</p><label>乗車時 距離（km）<input id="f" type="number" step="0.001" min="0"></label><button data-get="f">⌖ GPS取得（乗車）</button><label>降車時 距離（km）<input id="l" type="number" step="0.001" min="0"></label><button data-get="l">⌖ GPS取得（降車）</button><p class="small">距離を手動変更した場合、その時点の最新GPSを基準にして以後の加算を続けます。</p><button id="save">仮保存（本番には保存しない）</button><p id="calc"></p></section>
<section><h2>仮の営業履歴</h2><div id="history">まだ仮保存がありません</div><button id="reset" class="secondary">このテストの履歴・補正を消す</button></section>
<script src="./gps-native-bridge.js?v=2"></script><script>
'use strict';
const $=id=>document.getElementById(id),B=window.TAXIAPP_EXTERNAL_GPS;
const memory=new Map(),scope='smoke-only';
const storage={getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,v),removeItem:k=>memory.delete(k)};
let last=null,seq=0,records=[],pending=0,editing=null;
function status(t,bad=false){$('status').textContent=t;$('status').className=bad?'bad':'good'}
function keyState(){const k=B.readKey(localStorage);$('pair').textContent=k?'連携キー登録済み（再入力不要）':'キー未登録です。先に通信テストページで登録してください'}
function show(){const base=B.baseline(storage,scope);$('gps').textContent='GPS累計：'+(last?last.tripKm.toFixed(3)+' km':'未取得')+'／補正：'+(base?base.value.toFixed(3)+' km 起点':'なし');
$('history').innerHTML=records.length?records.map((r,i)=>'<article>仮番号 '+(i+1)+'　乗車 '+r.f+'km ／ 降車 '+r.l+'km <button data-edit="'+i+'">履歴を訂正</button></article>').join(''):'まだ仮保存がありません';
$('calc').textContent='このテストの仮保存件数：'+records.length+'件';}
async function fetchGps(){const res=await B.read();last=res;show();return res}
$('ping').onclick=async()=>{try{const d=await fetchGps();status('取得成功：'+d.tripKm.toFixed(3)+'km（画面移動なし）')}catch(e){status(e.message,true)}};
$('keyPage').onclick=()=>location.href='gps-local-chrome-test.html';
document.querySelectorAll('[data-get]').forEach(btn=>btn.onclick=async()=>{
 if(editing!==null){status('履歴訂正中はGPS自動入力を無効にしています。',true);return}
 const field=btn.dataset.get,nonce=++pending,original=$(field).value;btn.disabled=true;
 try{const d=await fetchGps();if(nonce!==pending||editing!==null||$(field).value!==original)return;
 const km=B.calculated(d.tripKm,B.baseline(storage,scope)).toFixed(3);$(field).value=km;status('GPS距離 '+km+' km を反映しました');
 }catch(e){status('取得できません：'+e.message,true)}finally{btn.disabled=false}
});
for(const id of ['f','l'])$(id).addEventListener('change',async()=>{
 if(editing!==null)return;
 const value=$(id).value.trim();if(value===''||!Number.isFinite(Number(value))||Number(value)<0)return;
 const nonce=++pending;
 try{const d=await fetchGps();if(nonce!==pending||$(id).value.trim()!==value||editing!==null)return;
 B.recordManual(storage,scope,d.tripKm,value);show();status('手入力 '+value+'km を最新GPS '+d.tripKm.toFixed(3)+'km に結び付けました');
 }catch(e){status('手入力値は残しました。GPS基準更新は失敗：'+e.message,true)}
});
$('save').onclick=()=>{const f=Number($('f').value),l=Number($('l').value);if(!$('f').value||!$('l').value||!Number.isFinite(f)||!Number.isFinite(l)||f<0||l<f){status('乗車・降車距離を確認してください（降車≧乗車）。',true);return}
 if(editing===null)records.push({f:f.toFixed(3),l:l.toFixed(3)});else records[editing]={f:f.toFixed(3),l:l.toFixed(3)};
 editing=null;$('f').value='';$('l').value='';show();status('仮保存しました。本番の日報データは変更していません。')};
$('history').onclick=e=>{const i=e.target.closest('[data-edit]')?.dataset.edit;if(i===undefined)return;editing=Number(i);$('f').value=records[editing].f;$('l').value=records[editing].l;show();status('過去履歴の訂正モードです。GPSの補正基準は変更されません。')};
$('reset').onclick=()=>{records=[];memory.clear();last=null;editing=null;pending++;$('f').value='';$('l').value='';show();status('仮データを消しました。本番データには影響ありません。')};
keyState();show();
</script></body></html>
