name: GPS Distance Lab v0.6 Baseline Fix APK
on:
  push:
    branches:
      - feat/gps-lab-fix-baseline-split-v060
    paths:
      - 'android-prototype/**'
      - 'distance-console.html'
      - 'tests/gps-distance-lab.test.js'
      - '.github/workflows/android-gps-lab-v060.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test baseline capture, visible failures and split UI
        run: node tests/gps-distance-lab.test.js
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android and run GPS measurement tests
        run: |
          cd android-prototype
          gradle --no-daemon :core:test :app:assembleDebug
      - name: Verify APK separate screen and no Chrome
        run: |
          APK=android-prototype/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='jp.taxiapp.gpsprototype.distancelabv060'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='0.6.0-baseline-fixed'"
          grep -F 'android:label="GPS距離ラボ 計測"' android-prototype/app/src/main/AndroidManifest.xml
          ! "$AAPT" dump permissions "$APK" | grep -F "android.permission.INTERNET"
          python3 - <<'PY'
          from pathlib import Path
          base=Path('android-prototype/app/src/main/java/jp/taxiapp/gpsprototype')
          native=(base/'MainActivity.kt').read_text()
          web=(base/'GpsTestWebActivity.kt').read_text()
          ui=Path('android-prototype/app/src/main/assets/distance-console.html').read_text()
          assert 'GpsTestWebActivity::class.java' in native
          assert 'requestCapture(nonce:String,target:String)' in web
          assert 'onNativeSnapshot(' in web
          assert 'loadDataWithBaseURL' in web
          assert 'id="start-feedback"' in ui
          assert 'id="native-start"' not in ui
          assert 'id="native-stop"' not in ui
          assert 'ACTION_VIEW' not in native and 'Intent.ACTION_VIEW' not in web
          assert 'gps-import-test.html' not in web
          print('Distance Lab v0.6 isolated UI and zero-start bridge verified')
          PY
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Distance-Lab-v0.6.0-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish directly installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/GPS-Distance-Lab-v0.6.0.apk"
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$APK"
          TAG="gps-distance-lab-v0.6.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GPS距離ラボ v0.6.0 — 0km基準記録修正・画面分離" \
              --notes "基準点のGPS受信待ち30秒とエラーの直下表示を追加。GPS計測専用画面とWeb補正画面を分離、Chromeタブは開きません。既存v0.5との共存のため別アプリID。実走行は未検証。" \
              --prerelease
          fi
