name: TAXIAPP v1.3.2 Isolated Native UI Integration APK
on:
  push:
    branches:
      - feat/gps-v132-ui-integration-isolated-20261019
    paths:
      - 'android-prototype/**'
      - 'distance-console.html'
      - 'tests/gps-distance-lab.test.js'
      - 'gps-preview/v0359/**'
      - 'tests/gps-preview-v131-isolation.test.js'
      - 'tests/gps-preview-v131-identity.test.js'
      - '.github/workflows/android-gps-v132-ui-integration.yml'
      - '.github/workflows/android-gps-v131-mode-ui-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native GPS to external browser integration
        run: node tests/gps-distance-lab.test.js
      - name: Test native GPS to actual diary-distance bridge
        run: node tests/gps-diary-bridge.test.js
      - name: Verify isolated v0.3.59 diary preview and v1.3.1 identity
        run: |
          node tests/gps-preview-v131-isolation.test.js
          node tests/gps-preview-v131-identity.test.js
          node tests/gps-diary-bridge.test.js
          node --check gps-preview/v0359/gps-diary-bridge.js
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify native UI modes and display-only zero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('android-prototype/app/src/main/java/jp/taxiapp/gpsprototype')
          activity = (base / 'MainActivity.kt').read_text()
          store = (base / 'GpsStore.kt').read_text()
          server = (base / 'GpsLoopbackServer.kt').read_text()
          assert 'simSpeedLabel.text = "設定速度：$speed km/h（架空の走行）"' in activity
          assert 'simSpeedLabel.visibility = if(sim) View.VISIBLE else View.GONE' in activity
          assert 'if(sim) 0xFFFFD68A.toInt() else 0xFF63EAD2.toInt()' in activity
          assert 'simulationPanel.visibility = if(simulationExpanded) View.VISIBLE else View.GONE' in activity
          assert 'detailPanel.visibility = if(detailExpanded) View.VISIBLE else View.GONE' in activity
          assert 'addDetail(openWeb, 8)' in activity
          assert 'result.optString("webVersion")=="1.3.1"' in activity
          assert 'GpsStore.setDisplayZero(this, runId, baselineKm)' in activity
          assert 'GpsStore.displayDistanceKm(this, s.tripKm)' in activity
          assert 'rawTripKm - base' in store
          assert '.remove("displayZeroRunId")' in store
          assert '.remove("displayZeroRawKm")' in store
          assert 'put("tripKm",s.tripKm)' in server
          assert 'GPS_DISTANCE_LAB_DIARY_V1_3_1_100' in server
          print('Real/sim UI, speed display, collapsed controls, zero-only display, and HTTP identity verified')
          PY
      - name: Compile Android and run GPS measurement tests
        run: |
          cd android-prototype
          gradle --no-daemon :core:test :app:assembleDebug
      - name: Verify invariant package, nonbreaking port and upgrade version
        run: |
          test "$(grep -c 'applicationId = "jp.taxiapp.gpsprototype.distancelabv131"' android-prototype/app/build.gradle.kts)" -eq 1
          grep -F 'versionCode = 2' android-prototype/app/build.gradle.kts
          grep -F 'versionName = "1.3.2-ui-test"' android-prototype/app/build.gradle.kts
          grep -F 'const val PORT = 48768' android-prototype/app/src/main/java/jp/taxiapp/gpsprototype/GpsLoopbackServer.kt
          grep -F 'const val IDENTITY_MARKER = "GPS_DISTANCE_LAB_DIARY_V1_3_1_100"' android-prototype/app/src/main/java/jp/taxiapp/gpsprototype/GpsLoopbackServer.kt
          grep -F '.remove("displayZeroRunId")' android-prototype/app/src/main/java/jp/taxiapp/gpsprototype/GpsStore.kt
          grep -F '.remove("displayZeroRawKm")' android-prototype/app/src/main/java/jp/taxiapp/gpsprototype/GpsStore.kt
          test -s android-prototype/app/src/main/res/drawable-nodpi/gps_distance_icon.png
      - name: Verify external browser and loopback-only GPS
        run: |
          APK=android-prototype/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='jp.taxiapp.gpsprototype.distancelabv131'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='1.3.2-ui-test'"
          grep -F 'android:label="GPS距離ラボ v1.3.2 UI検証"' android-prototype/app/src/main/AndroidManifest.xml
          "$AAPT" dump permissions "$APK" | grep -F "android.permission.INTERNET"
          python3 - <<'PY'
          from pathlib import Path
          base=Path('android-prototype/app/src/main/java/jp/taxiapp/gpsprototype')
          native=(base/'MainActivity.kt').read_text()
          web=(base/'GpsLoopbackServer.kt').read_text()
          ui=Path('android-prototype/app/src/main/assets/distance-console.html').read_text()
          assert 'Intent(Intent.ACTION_VIEW' in native
          assert 'class GpsLoopbackServer' in web
          assert 'route.startsWith("/api/capture?")' in web
          assert 'ServerSocket(PORT,8,InetAddress.getByName("127.0.0.1"))' in web
          assert 'GpsTrackingService.ACTION_REFRESH' in web
          assert '48768' in web
          assert 'ACTION_SIM_START' in (base/'GpsTrackingService.kt').read_text()
          assert 'setOf(0,20,40,60,100)' in (base/'GpsTrackingService.kt').read_text()
          assert 'listOf(listOf(0,20),listOf(40,60),listOf(100))' in native
          assert 'SimulatedDrive' in (base/'GpsTrackingService.kt').read_text()
          assert 'put("simulated",GpsStore.isSimulating(context))' in web
          activity=(base/'MainActivity.kt').read_text()
          service=(base/'GpsTrackingService.kt').read_text()
          manifest=Path('android-prototype/app/src/main/AndroidManifest.xml').read_text()
          assert 'b.isEnabled=true' in activity
          assert 'startGps(simulation=true,initialSpeed=speed)' in activity
          assert 'if (!simulation && checkSelfPermission' in activity
          assert 'FOREGROUND_SERVICE_TYPE_DATA_SYNC' in service
          assert 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' in manifest

          assert 'route=="/api/identity"' in web
          assert 'GPS_DISTANCE_LAB_DIARY_V1_3_1_100' in web
          assert 'openVerifiedExternalBrowser()' in native
          assert 'Web v1.3.1' in ui
          assert 'gps-distance-lab-browser-diary-v131' in ui
          assert 'gps-distance-lab-history-diary-v131' in ui
          assert 'new-session-btn' in ui
          assert 'sessionMismatch()' in ui
          assert 'put("runId",GpsStore.currentRunId(context))' in web
          assert 'id="start-feedback"' in ui
          assert 'id="native-start"' not in ui
          assert 'id="native-stop"' not in ui
          assert 'addJavascriptInterface' not in native and 'WebView' not in native
          assert 'gps-import-test.html' not in web
          print('Diary GPS preview APK v1.3.1 uses external Chrome on dedicated local port')
          PY
      - name: Compare APK signer with the already-installed v1.3.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW="android-prototype/app/build/outputs/apk/debug/app-debug.apk"
          OLD="$RUNNER_TEMP/previous-v131.apk"
          gh release download gps-diary-v1.3.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'GPS-Distance-Lab-v1.3.1-100kmh.apk' --dir "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/GPS-Distance-Lab-v1.3.1-100kmh.apk" "$OLD"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OLD_SHA="$("$SIGNER" verify --print-certs "$OLD" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1)"
          NEW_SHA="$("$SIGNER" verify --print-certs "$NEW" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$OLD_SHA" && test -n "$NEW_SHA"
          echo "Previous v1.3.1 signer: $OLD_SHA" | tee "$RUNNER_TEMP/upgrade-compatibility.txt"
          echo "New v1.3.2 signer: $NEW_SHA" | tee -a "$RUNNER_TEMP/upgrade-compatibility.txt"
          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "Signing compatible: YES. New versionCode=2 can replace prior versionCode=1." | tee -a "$RUNNER_TEMP/upgrade-compatibility.txt"
          else
            echo "Signing compatible: NO. Android will reject in-place upgrade; do NOT uninstall before backing up native GPS measurements." | tee -a "$RUNNER_TEMP/upgrade-compatibility.txt"
            echo "::warning::APK debug signer mismatch. Existing package cannot be updated in place; keep existing app until data backup and installation plan are agreed."
          fi
          cat "$RUNNER_TEMP/upgrade-compatibility.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Diary-v1.3.2-UI-integrated-APK
          path: |
            android-prototype/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/upgrade-compatibility.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish new standalone verification prerelease without overwriting any prior APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gps-diary-v1.3.2-ui-test-20261019"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Verification prerelease already exists. Refusing to overwrite or clobber."
            exit 1
          fi
          APK="$RUNNER_TEMP/GPS-Distance-Lab-v1.3.2-UI-test.apk"
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$APK"
          printf '%s\n' 'Isolated Android-only UI, icon and display-zero changes from PR #77.' \
            'Android package remains jp.taxiapp.gpsprototype.distancelabv131, server port 48768, HTML webVersion 1.3.1.' \
            'Do not install over an existing v1.3.1 app unless signer fingerprints match.' \
            'If signer mismatches, stop and arrange data backup and a safe signing path before installing.' \
            'Existing v1.3.1 release and all production diary data are unchanged.' \
            '' > "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/upgrade-compatibility.txt" >> "$RUNNER_TEMP/notes.txt"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GPS距離ラボ v1.3.2 — PR77画面・アイコン統合検証版" \
            --notes-file "$RUNNER_TEMP/notes.txt" --prerelease
