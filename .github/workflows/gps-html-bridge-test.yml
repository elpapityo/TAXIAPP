name: GPS HTML bridge regression
on:
  push:
    branches:
      - feat/html-native-gps-loopback-20261018
    paths:
      - '*.js'
      - 'tests/**'
      - 'google-apps-script/**'
      - 'index.html'
      - 'gps-native-bridge.js'
      - 'gps-trip-ui.js'
      - 'daily-reference.js'
      - 'highway-report.js'
      - 'tests/daily-reference.test.js'
      - 'tests/highway-trip-limit.test.js'
      - 'tests/gps-native-bridge.test.js'
      - '.github/workflows/gps-html-bridge-test.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - 'tests/**'
      - 'google-apps-script/**'
      - 'index.html'
      - 'gps-native-bridge.js'
      - 'gps-trip-ui.js'
      - 'daily-reference.js'
      - 'highway-report.js'
      - 'tests/daily-reference.test.js'
      - 'tests/highway-trip-limit.test.js'
      - 'tests/gps-native-bridge.test.js'
      - '.github/workflows/gps-html-bridge-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gps-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check gps-native-bridge.js
          node --check gps-diary-bridge.js
          node --check gps-trip-ui.js
          node --check daily-reference.js
          node --check highway-report.js
      - name: 'Full regression suite: fares, daily records, GPS, highway, sync'
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
      - name: Verify source integration guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          ui=Path('gps-trip-ui.js').read_text()
          assert '<script src="./gps-diary-bridge.js?v=20261019-1"></script>' in html
          assert "if(!shift?.draft||shift.draft.editId)" in html
          assert "active.draft?.editId" in html
          assert "window.TAXIAPP_EXTERNAL_GPS.recordManual(localStorage,shiftId,data.tripKm,manualValue,data.runId)" in html
          assert "String(active.draft.raw[id]??'')!==originalField" in html
          assert 'if(root.TAXIAPP_EXTERNAL_GPS)return false;' in ui
          print('HTML guard checks PASS')
          PY
