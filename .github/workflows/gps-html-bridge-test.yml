name: GPS HTML bridge regression
on:
  push:
    branches:
      - feat/html-native-gps-loopback-20261018
    paths:
      - '*.js'
      - 'tests/**'
      - 'google-apps-script/**'
      - 'index.html'
      - 'gps-native-bridge.js'
      - 'gps-trip-ui.js'
      - 'daily-reference.js'
      - 'highway-report.js'
      - 'tests/daily-reference.test.js'
      - 'tests/highway-trip-limit.test.js'
      - 'tests/gps-native-bridge.test.js'
      - '.github/workflows/gps-html-bridge-test.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - 'tests/**'
      - 'google-apps-script/**'
      - 'index.html'
      - 'gps-native-bridge.js'
      - 'gps-trip-ui.js'
      - 'daily-reference.js'
      - 'highway-report.js'
      - 'tests/daily-reference.test.js'
      - 'tests/highway-trip-limit.test.js'
      - 'tests/gps-native-bridge.test.js'
      - '.github/workflows/gps-html-bridge-test.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  gps-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check gps-native-bridge.js
          node --check gps-trip-ui.js
          node --check daily-reference.js
          node --check highway-report.js
      - name: Focused GPS, distance, diary and sync regression tests
        run: |
          set -e
          files=(
            tests/gps-*.test.js
            tests/highway-*.test.js
            tests/daily-reference.test.js
            tests/native-gps-input-race.test.js
            tests/auto-distance-wiring.test.js
            tests/ride-save-gps-race.test.js
            tests/bidirectional-sync.test.js
            tests/partial-duty-sync.test.js
            tests/account-sync-event-scheduling.test.js
            tests/status-sync-event-policy.test.js
          )
          for file in "${files[@]}"; do
            echo "::group::$file"
            node "$file"
            echo '::endgroup::'
          done
      - name: Verify source integration guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          ui=Path('gps-trip-ui.js').read_text()
          assert '<script src="./gps-diary-bridge.js?v=20261020-2"></script>' in html
          assert "if(!shift?.draft||shift.draft.editId)" in html
          assert "active.draft?.editId" in html
          assert "window.TAXIAPP_EXTERNAL_GPS.recordManual(localStorage,shiftId,data.tripKm,manualValue,data.runId)" in html
          assert "String(active.draft.raw[id]??'')!==originalField" in html
          assert 'if(root.TAXIAPP_EXTERNAL_GPS)return false;' in ui
          from pathlib import Path
          bridge=Path('gps-diary-bridge.js').read_text()
          assert 'simulated:x.simulated===true' in bridge
          assert 'data.simulated===true' in html
          assert '模擬入力です：GPS距離' in html
          assert 'allowSimulation' not in bridge
          assert "EXPECTED_MARKER='GPS_DISTANCE_LAB_DIARY_V1_4_0_100'" in bridge
          assert "EXPECTED_PACKAGE='jp.taxiapp.gpsprototype.distancelabv140'" in bridge
          assert "const DB_NAME='taxiapp-store-v1'" in html
          assert "accountSettingsAuto=window.TAXIAPP_ACCOUNT_AUTO.create" in html
          assert "canSync:()=>canEditNow()" in html
          print('HTML guard checks PASS')
          PY
