name: Android diary shell v1.5 verification
on:
  push:
    branches: [feat/android-diary-shell-v150-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test diary regressions
        run: |
          for file in tests/*.test.js; do node "$file"; done
      - name: Android 35 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android tests and APK build
        run: cd android-prototype && gradle --no-daemon :core:test :app:assembleDebug
      - name: Verify app identity and shell isolation
        run: |
          set -eu
          APK=android-prototype/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='jp.taxiapp.gpsprototype.diaryv150'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          grep -F 'settings.allowFileAccess = false' android-prototype/app/src/main/java/jp/taxiapp/gpsprototype/DiaryActivity.kt
          grep -F 'settings.mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW' android-prototype/app/src/main/java/jp/taxiapp/gpsprototype/DiaryActivity.kt
      - uses: actions/upload-artifact@v4
        with:
          name: Diary-v150-shell-validation-debug-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
