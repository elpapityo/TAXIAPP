name: GPS Distance Lab Android v0.5
on:
  push:
    branches:
      - feat/gps-distance-lab-20261019
    paths:
      - 'android-prototype/**'
      - 'distance-console.html'
      - 'tests/gps-distance-lab.test.js'
      - '.github/workflows/android-gps-lab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated UI and GPS calculation
        run: node tests/gps-distance-lab.test.js
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run GPS core tests and build APK
        run: |
          cd android-prototype
          gradle --no-daemon :core:test :app:assembleDebug
      - name: Verify APK package, label, and no browser permission
        run: |
          APK=android-prototype/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='jp.taxiapp.gpsprototype.distancelab'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='0.5.0-single-screen'"
          grep -F 'android:label="GPS距離ラボ"' android-prototype/app/src/main/AndroidManifest.xml
          "$AAPT" dump badging "$APK" | grep -F "application-label:" || true
          ! "$AAPT" dump permissions "$APK" | grep -F "android.permission.INTERNET"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('android-prototype/app/src/main/java/jp/taxiapp/gpsprototype/MainActivity.kt').read_text()
          ui=Path('android-prototype/app/src/main/assets/distance-console.html').read_text()
          assert 'requestCapture(nonce: String, target: String)' in src
          assert 'window.DistanceLab.onNativeSnapshot(' in src
          assert 'loadDataWithBaseURL' in src
          assert 'GPS測定を開始' in ui
          assert '車両トリップ累計の補正' in ui
          assert 'location.href=req.uri' not in ui
          assert 'ACTION_VIEW' not in src
          print('Native/UI single-tab contract PASS')
          PY
      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Distance-Lab-v0.5.0-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/GPS-Distance-Lab-v0.5.0.apk"
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$APK"
          TAG="gps-distance-lab-v0.5.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GPS距離ラボ v0.5.0（1画面・キー不要）" \
              --notes "新規デザイン・単一Android WebView完結版。GPS開始／停止、0kmスタート、区間距離、累計距離、手入力補正。GPS取得でChromeのタブを追加しません。旧アプリとは別ID。実走行精度は未検証。" \
              --prerelease
          fi
