name: Android GPS prototype (isolated branch)
on:
  push:
    branches:
      - prototype/android-background-gps-20261016
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-gps-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-android-prototype:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: JVM distance tests and Android debug build
        run: |
          cd android-prototype
          gradle --no-daemon :core:test :app:assembleDebug
      - name: Check side-by-side APK identity
        run: |
          APK=android-prototype/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='jp.taxiapp.gpsprototype.bridge'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='0.3.1-side-by-side-bridge-test'"
          # AAPT prints localized app labels differently across runner environments.
          # Verify source label exactly and print the actual APK labels for diagnosis.
          grep -F 'android:label="TAXIAPP GPS連携試験"' android-prototype/app/src/main/AndroidManifest.xml
          "$AAPT" dump badging "$APK" | grep -F 'application-label:' || true
      - name: Upload installable GPS test APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIAPP-GPS-distance-test-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish directly installable Android test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/TAXIAPP-GPS-bridge-side-by-side-v0.3.1.apk"
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$APK"
          TAG="gps-distance-bridge-v0.3.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "TAXIAPP GPS距離・住所・時刻連携試験 v0.3.1（旧版と共存）" \
              --notes "旧版とは異なるアプリIDでインストールする並行テスト専用版です。旧GPS試験アプリを削除せずにインストールできます。ただし、計測データは旧版と共有しません。距離・住所・時刻をWeb試験画面に受け渡します。検証用APKのためGPS精度と安全性を保証するものではありません。業務記録には車両トリップを使ってください。" \
              --prerelease
          fi
