name: Android GPS prototype (isolated branch)
on:
  push:
    branches:
      - prototype/android-background-gps-20261016
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-gps-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-android-prototype:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: JVM distance tests and Android debug build
        run: |
          cd android-prototype
          gradle --no-daemon :core:test :app:assembleDebug
      - name: Upload installable GPS test APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIAPP-GPS-distance-test-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish directly installable Android test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/TAXIAPP-GPS-distance-test-v0.3.0.apk"
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$APK"
          TAG="gps-distance-test-v0.3.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "TAXIAPP GPS距離測定・ブラウザ受渡しテスト v0.3.0" \
              --notes "日報本体とは独立したAndroid GPS試験版です。GPS累計・実車・空車の計測と、試験用Webページへの距離受け渡しに対応します。業務データは変更しません。検証用APKのため精度は保証しません。業務記録には現行TAXIAPPと車両トリップを使用してください。" \
              --prerelease
          fi
