name: Android GPS prototype (isolated branch)
on:
  push:
    branches:
      - prototype/android-background-gps-20261016
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-gps-prototype.yml'
  workflow_dispatch:

jobs:
  test-android-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: JVM distance tests and Android debug build
        run: |
          cd android-prototype
          gradle --no-daemon :core:test :app:assembleDebug
