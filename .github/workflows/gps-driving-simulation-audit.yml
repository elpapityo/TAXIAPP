name: GPS v1.1 Driving Replay Audit
on:
  push:
    branches:
      - audit/gps-v110-driving-simulation-20261019
    paths:
      - 'android-prototype/core/**'
      - '.github/workflows/gps-driving-simulation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driving-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run real Kotlin GPS accumulation replay tests
        run: |
          cd android-prototype
          gradle --no-daemon :core:test
      - name: Upload exact test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-v110-driving-simulation-report
          path: android-prototype/core/build/reports/tests/test/
          retention-days: 30
