name: GPS v1.1 Driving Replay Audit
on:
  push:
    branches:
      - audit/gps-v110-driving-simulation-20261019
    paths:
      - 'android-prototype/core/**'
      - '.github/workflows/gps-driving-simulation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driving-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run real Kotlin GPS accumulation replay tests
        run: |
          cd android-prototype
          gradle --no-daemon :core:test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser session and GPS native bridge regression
        run: node tests/gps-distance-lab.test.js
      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build complete Android APK, no release
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android-prototype
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload exact test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-v110-driving-simulation-report
          path: android-prototype/core/build/reports/tests/test/
          retention-days: 30
