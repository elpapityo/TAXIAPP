name: TAXIAPP tests
on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all JavaScript regression tests and summarize failures
        id: regressions
        continue-on-error: true
        run: |
          set -e
          passed=0
          failed=0
          failed_files=()
          shopt -s nullglob
          files=(tests/*.test.js)
          if (( ${#files[@]} == 0 )); then
            echo '::error::No JavaScript regression tests were found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::$file"
            if node "$file"; then
              passed=$((passed + 1))
            else
              status=$?
              failed=$((failed + 1))
              failed_files+=("$file (exit $status)")
              echo "::error file=$file,title=Regression test failed::Exit code $status"
            fi
            echo '::endgroup::'
          done
          {
            echo '## TAXIAPP JavaScript regression tests'
            echo
            echo '| Passed | Failed | Total |'
            echo '| ---: | ---: | ---: |'
            echo "| $passed | $failed | $((passed + failed)) |"
            if ((failed > 0 )); then
              echo
              echo '### Failed files'
              for item in "${failed_files[@]}"; do echo "- $item"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "JavaScript tests: $passed passed, $failed failed."
          if ((failed > 0 )); then exit 1; fi
      - name: Require version bump when the main app changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const main=fs.readFileSync('index.html','utf8');
          const before=cp.execFileSync('git',['show','FETCH_HEAD:index.html'],{encoding:'utf8'});
          if(main===before){console.log('App HTML unchanged');process.exit(0);}
          const version=text=>{
            const match=text.match(/<title>TAXIAPP v(\d+)\.(\d+)\.(\d+) — 乗務日報<\/title>/);
            if(!match)throw new Error('TAXIAPP app version is missing');
            return match.slice(1).map(Number);
          };
          const old=version(before),next=version(main);
          const compare=(a,b)=>a[0]!==b[0]?a[0]-b[0]:a[1]!==b[1]?a[1]-b[1]:a[2]-b[2];
          if(compare(next,old)<=0){
            throw Error('Changing index.html requires an increased app version: '+old.join('.')+' -> '+next.join('.'));
          }
          console.log('App version increased:',old.join('.'),'->',next.join('.'));
          NODE
      - name: Validate HTML scripts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          for(const [,code] of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){
            if(code.trim())new Function(code);
          }
          console.log('Inline HTML scripts compile');
          NODE
      - name: Fail if regression tests failed
        if: steps.regressions.outcome == 'failure'
        run: exit 1
