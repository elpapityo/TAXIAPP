name: TAXIAPP tests
on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure and controller regression tests
        run: |
          set -e
          for file in tests/*.test.js; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
      - name: Validate HTML scripts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          for(const [,code] of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){
            if(code.trim())new Function(code);
          }
          console.log('Inline HTML scripts compile');
          NODE
